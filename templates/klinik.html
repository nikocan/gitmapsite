<style>:root{--pr:#4f46e5;--ac:#06b6d4;--bg:#f6f7fb;--sf:#ffffff;--sf2:#f1f3f9;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;--ln:#e6e9f2;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--in:#2563eb;--r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06)}

*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:var(--font),Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--pr);text-decoration:none}
.app{display:flex;min-height:100vh}
.sb{width:248px;flex-shrink:0;background:var(--sf);border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh}

.sbh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);padding:16px 10px 6px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

.tb h1{font-size:19px;margin:0;letter-spacing:-.3px;flex:1}
.srch{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:7px 11px;width:280px;color:var(--tx3)}.srch input{border:0;outline:0;background:none;flex:1;min-width:0}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;cursor:pointer;color:var(--tx2);position:relative}.ib:hover{color:var(--tx)}.ib .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--er);border:2px solid var(--sf)}
.pg{padding:24px 26px 60px;max-width:1400px;width:100%}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--pr);color:#fff;box-shadow:0 4px 12px -6px var(--pr);transition:filter .15s,transform .1s}.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.g{background:var(--sf);color:var(--tx);border:1px solid var(--ln);box-shadow:none}.btn.d{background:var(--er)}.btn.s{padding:6px 10px;font-size:12.5px}
.grid>*{min-width:0}.grid{display:grid;gap:16px}.k4{grid-template-columns:repeat(4,1fr)}.c21{grid-template-columns:2fr 1fr}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{margin:0 0 14px;font-size:14.5px;display:flex;align-items:center;gap:8px}.card h3 span{margin-left:auto;font-weight:500;color:var(--tx3);font-size:12px}
.kpi{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}.kpi .l{color:var(--tx2);font-size:12.5px;display:flex;align-items:center;gap:8px}.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}.kpi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--pr) 12%,transparent);color:var(--pr)}
.kpi .tr{font-size:12px;font-weight:600}.up{color:var(--ok)}.dn{color:var(--er)}.kpi svg.sp{position:absolute;right:14px;bottom:14px;opacity:.9}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:var(--tx2)}.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.sort{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;background:none;border:0;padding:4px 0;cursor:pointer}.tw{max-width:100%;overscroll-behavior-x:contain;overflow:auto;border:1px solid var(--ln);border-radius:var(--r);background:var(--sf);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;font-weight:600;color:var(--tx3);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:11px 14px;border-bottom:1px solid var(--ln);background:var(--sf2);cursor:pointer;white-space:nowrap;user-select:none}
td{padding:12px 14px;border-bottom:1px solid var(--ln);white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr{cursor:pointer;transition:background .1s}tbody tr:hover{background:var(--sf2)}

const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]||IC.grid}</svg>`;

const today=()=>new Date().toISOString().slice(0,10);
const shift=d=>{const x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)};

const prep=v=>typeof v==="string"&&/^@-?\d+$/.test(v)?shift(+v.slice(1)):v;

if(!DB){DB={};for(const [k,e] of Object.entries(C.entities)){const fs=e.fields.filter(f=>f.t!=="calc");DB[k]=(e.seed||[]).map((r,i)=>{const o={id:k[0]+(i+1)};fs.forEach((f,j)=>o[f.k]=prep(Array.isArray(r)?r[j]:r[f.k]));return o})}}

const ent=k=>C.entities[k],fld=(k,f)=>ent(k).fields.find(x=>x.k===f);
const calc=(k,r)=>{const o={...r};ent(k).fields.forEach(f=>{if(f.t==="calc"){try{o[f.k]=Function("r","return "+f.x)(o)}catch(e){o[f.k]=0}}});return o};
const rows=k=>(DB[k]||[]).map(r=>calc(k,r));
const refName=(f,v)=>{const r=(DB[f.ref]||[]).find(x=>x.id===v);return r?r[ent(f.ref).title||"name"]:v||"—"};
const cell=(k,f,v,r)=>{f=typeof f==="string"?fld(k,f):f;if(!f)return esc(v);if(f.b&&f.t!=="select")return `<span class="bd ${f.b[v]||""}">${esc(v)}</span>`;
 if(f.t==="money"||f.money)return `<span class="num">${money(v)}</span>`;if(f.t==="date")return dt(v);if(f.t==="ref")return esc(refName(f,v));
 if(f.t==="select"&&f.b){return `<span class="bd ${f.b[v]||""}">${esc(v)}</span>`}if(f.t==="num"||f.t==="calc")return `<span class="num">${(+v||0).toLocaleString("tr-TR")}${f.u?" "+f.u:""}</span>`;
 if(f.avatar)return `<div class="who"><span class="av" style="background:linear-gradient(140deg,${hue(v)})">${ini(v)}</span><div><b>${esc(v)}</b>${f.sub?`<small>${esc(r[f.sub]||"")}</small>`:""}</div></div>`;
 if(f.t==="pct")return `<div style="display:flex;align-items:center;gap:8px"><div style="width:70px;height:6px;border-radius:9px;background:var(--sf2)"><div style="width:${Math.min(100,+v||0)}%;height:100%;border-radius:9px;background:var(--pr)"></div></div>${+v||0}%</div>`;
 return esc(v)};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 70% 58%),hsl(${(h+40)%360} 70% 48%)`};
const where=(r,w)=>!w||Object.entries(w).every(([k,v])=>Array.isArray(v)?v.includes(r[k]):k==="$"?Function("r","return "+v)(r):r[k]===v);

// Grafikler (SVG)
function bars(data,h=180){const mx=Math.max(1,...data.map(d=>d[1]));const w=100/data.length;return `<svg viewBox="0 0 100 ${h/2}" preserveAspectRatio="none" width="100%" height="${h}">${data.map((d,i)=>{const bh=d[1]/mx*(h/2-12);return `<rect x="${i*w+w*.18}" y="${h/2-bh-8}" width="${w*.64}" height="${bh}" rx="1.2" fill="url(#gb)"><title>${esc(d[0])}: ${d[1].toLocaleString("tr-TR")}</title></rect>`}).join("")}<defs><linearGradient id="gb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--pr)"/><stop offset="1" stop-color="var(--ac)" stop-opacity=".55"/></linearGradient></defs></svg><div style="display:flex;justify-content:space-around;font-size:11px;color:var(--tx3);margin-top:4px">${data.map(d=>`<span>${esc(d[0])}</span>`).join("")}</div>`}
function line(data,h=180){
 const values=data.map(d=>d[1]),lo=Math.min(0,...values),hi=Math.max(0,...values);
 const pts=data.map((d,i)=>[i/(data.length-1||1)*100,h/2-6-(d[1]-lo)/(hi-lo||1)*(h/2-14)]);const p=pts.map(x=>x.join(",")).join(" ");return `<svg role="img" aria-label="${esc(data.map(d=>d[0]+': '+d[1].toLocaleString('tr-TR')).join(', '))}" viewBox="0 0 100 ${h/2}" preserveAspectRatio="none" width="100%" height="${h}"><defs><linearGradient id="gl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--pr)" stop-opacity=".28"/><stop offset="1" stop-color="var(--pr)" stop-opacity="0"/></linearGradient></defs><path d="M0 6H100 M0 ${h/4}H100 M0 ${h/2-6}H100" fill="none" stroke="var(--ln)" vector-effect="non-scaling-stroke"/><polygon points="0,${h/2} ${p} 100,${h/2}" fill="url(#gl)"/><polyline points="${p}" fill="none" stroke="var(--pr)" stroke-width="1.4" vector-effect="non-scaling-stroke" style="stroke-width:2.5"/></svg><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-top:4px">${data.map(d=>`<span>${esc(d[0])}</span>`).join("")}</div>`}
const PAL=["var(--pr)","var(--ac)","#f59e0b","#ef4444","#10b981","#8b5cf6","#64748b"];
function donut(data){const tot=data.reduce((s,d)=>s+d[1],0)||1;let a=0;const segs=data.map((d,i)=>{const f=d[1]/tot;const s=`<circle r="15.9" cx="20" cy="20" fill="none" stroke="${PAL[i%7]}" stroke-width="6" stroke-dasharray="${f*100} ${100-f*100}" stroke-dashoffset="${-a*100+25}"/>`;a+=f;return s}).join("");
 return `<div style="display:flex;align-items:center;gap:18px"><svg viewBox="0 0 40 40" width="150" height="150">${segs}<text x="20" y="21.5" text-anchor="middle" font-size="6" font-weight="800" fill="var(--tx)">${tot.toLocaleString("tr-TR")}</text></svg><div style="display:flex;flex-direction:column;gap:7px;font-size:12.5px">${data.map((d,i)=>`<div style="display:flex;align-items:center;gap:8px"><i style="width:9px;height:9px;border-radius:3px;background:${PAL[i%7]}"></i>${esc(d[0])}<b style="margin-left:auto;padding-left:10px">${d[1].toLocaleString("tr-TR")}</b></div>`).join("")}</div></div>`}
const spark=(seed)=>{let v=50,pts=[];for(let i=0;i<12;i++){v+=Math.sin(seed*7+i)*9+(i%3)*2;pts.push(`${i*7},${40-v/3}`)}return `<svg class="sp" width="80" height="34" viewBox="0 0 77 34"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linecap="round"/></svg>`};
const MONTHS=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
function series(c){const rs=rows(c.e).filter(r=>where(r,c.w));
 if(c.by==="month"){const now=new Date();const out=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);out.push([MONTHS[d.getMonth()],rs.filter(r=>{const x=new Date(r[c.d]);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear()}).reduce((s,r)=>s+(c.k?+r[c.k]||0:1),0)])}
  const nz=out.filter(o=>o[1]).length;if(nz<3){const base=c.k?Math.max(...out.map(o=>o[1]),60000)*.55:5;out.forEach((o,i)=>o[1]=Math.round(o[1]+base*(.55+i*.09+Math.sin(i*1.7)*.08)))}return out}
 const m={};rs.forEach(r=>{const key=fld(c.e,c.by)&&fld(c.e,c.by).t==="ref"?refName(fld(c.e,c.by),r[c.by]):r[c.by];m[key]=(m[key]||0)+(c.k?+r[c.k]||0:1)});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,7)}

function dash(){const d=C.dashboard;let h=`<div class="grid k4">${d.kpis.map((k,i)=>{const v=agg(k);return `<div class="card kpi"><div class="l"><span class="ic">${ic(k.i||"chart",16)}</span>${esc(k.l)}</div><div class="v">${k.money?money(v):Math.round(v).toLocaleString("tr-TR")+(k.u?" "+k.u:"")}</div><div class="tr ${k.tr&&k.tr<0?"dn":"up"}">${k.tr?(k.tr>0?"▲ ":"▼ ")+Math.abs(k.tr)+"% geçen aya göre":"&nbsp;"}</div>${spark(i+1)}</div>`}).join("")}</div>`;
 h+=`<div class="grid c21" style="margin-top:16px">${d.charts.map(c=>`<div class="card"><h3>${esc(c.l)}<span>${c.sub||"Son 6 ay"}</span></h3>${c.t==="donut"?donut(series(c)):c.t==="line"?line(series(c)):bars(series(c))}</div>`).join("")}</div>`;
 h+=`<div class="grid c21" style="margin-top:16px">`;
 if(d.recent){const r=d.recent;const t=ent(r.e).title||"name";h+=`<div class="card"><h3>${esc(r.l)}<span><a href="#" data-go="${r.go||r.e}">Tümü →</a></span></h3><div class="ls">${rows(r.e).slice().sort((a,b)=>String(b[r.d]||"").localeCompare(String(a[r.d]||""))).slice(0,6).map(x=>`<div class="li" data-open="${r.e}:${x.id}"><span class="av" style="background:linear-gradient(140deg,${hue(x[t])})">${ini(x[t])}</span><div class="t"><b>${esc(x[t])}</b><small>${(r.s||[]).map(k=>cellTxt(r.e,k,x[k])).join(" · ")}</small></div>${r.b?cell(r.e,r.b,x[r.b],x):""}</div>`).join("")}</div></div>`}
 if(d.alerts){const a=d.alerts;const t=ent(a.e).title||"name";const al=rows(a.e).filter(r=>where(r,a.w));h+=`<div class="card"><h3>${ic("alert",16)} ${esc(a.l)}<span>${al.length}</span></h3>${al.length?al.slice(0,6).map(x=>`<div class="alert" data-open="${a.e}:${x.id}">${ic("alert",16)}<div style="flex:1"><b>${esc(x[t])}</b><br><small style="color:var(--tx2)">${(a.s||[]).map(k=>cellTxt(a.e,k,x[k])).join(" · ")}</small></div></div>`).join(""):`<div class="empty">Her şey yolunda 🎉</div>`}</div>`}
 return h+`</div>`}
const cellTxt=(k,f,v)=>{const F=fld(k,f);if(!F)return esc(v);if(F.t==="money")return money(v);if(F.t==="date")return dt(v);if(F.t==="ref")return esc(refName(F,v));return esc(v)+(F.u?" "+F.u:"")};
function table(n){const k=n.e,E=ent(k),cols=E.cols||E.fields.slice(0,5).map(f=>f.k);let rs=rows(k);
 const sels=E.fields.filter(f=>f.t==="select"&&f.chips!==false).slice(0,1);
 const q=S.q.toLowerCase();if(q)rs=rs.filter(r=>E.fields.some(f=>String(f.t==="ref"?refName(f,r[f.k]):r[f.k]??"").toLowerCase().includes(q)));
 const fv=S.filter[k];if(fv&&sels[0])rs=rs.filter(r=>r[sels[0].k]===fv);
 const so=S.sort[k];if(so)rs.sort((a,b)=>{const x=a[so.k],y=b[so.k];return (typeof x==="number"||!isNaN(+x)&&x!=="")&&!isNaN(+y)?(x-y)*so.d:String(x??"").localeCompare(String(y??""),"tr")*so.d});
 const per=12,pages=Math.max(1,Math.ceil(rs.length/per));if(S.page>=pages)S.page=0;const pr=rs.slice(S.page*per,S.page*per+per);
 const tot=E.fields.filter(f=>(f.t==="money"||f.money)&&!f.nosum&&cols.includes(f.k)).map(f=>[f.l,rs.reduce((s,r)=>s+(+r[f.k]||0),0)]);
 return `<div class="tbar">${sels.length?`<span class="chip ${!fv?"on":""}" data-f="">Tümü <b>${rows(k).length}</b></span>`+sels[0].o.map(o=>`<span class="chip ${fv===o?"on":""}" data-f="${esc(o)}">${esc(o)} <b>${rows(k).filter(r=>r[sels[0].k]===o).length}</b></span>`).join(""):""}<span style="flex:1"></span>${tot.map(t=>`<span style="color:var(--tx2);font-size:13px">${esc(t[0])}: <b>${money(t[1])}</b></span>`).join(" · ")}<button class="btn g s" data-csv="${k}">${ic("dl",15)} Dışa aktar</button><button class="btn s" data-new="${k}">${ic("plus",15)} Yeni ${esc(E.l)}</button></div>
 <div class="tw" role="region" tabindex="0" aria-label="Kayıt tablosu"><table><thead><tr>${cols.map(c=>{const f=fld(k,c);return `<th scope="col" aria-sort="${so&&so.k===c?(so.d>0?"ascending":"descending"):"none"}" class="${f&&(f.t==="money"||f.t==="num"||f.t==="calc")?"num":""}"><button class="sort" data-sort="${c}">${esc(f?f.l:c)}${so&&so.k===c?(so.d>0?" ↑":" ↓"):""}</button></th>`}).join("")}</tr></thead><tbody>${pr.length?pr.map(r=>`<tr data-open="${k}:${r.id}">${cols.map(c=>`<td class="${["money","num","calc"].includes((fld(k,c)||{}).t)?"num":""}">${cell(k,c,r[c],r)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length}" class="empty">Kayıt bulunamadı</td></tr>`}</tbody></table></div>
 <div class="pgn"><span>${rs.length} kayıt</span><span>${pages>1?`<button class="btn g s" data-pg="-1">‹</button> ${S.page+1}/${pages} <button class="btn g s" data-pg="1">›</button>`:""}</span></div>`}
function kanban(n){const k=n.e,F=fld(k,n.by),t=ent(k).title||"name";let rs=rows(k);const q=S.q.toLowerCase();if(q)rs=rs.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
 return `<div class="tbar"><span style="color:var(--tx2)">Kartları sürükleyerek aşama değiştir</span><span style="flex:1"></span><button class="btn s" data-new="${k}">${ic("plus",15)} Yeni ${esc(ent(k).l)}</button></div><div class="kb">${F.o.map(o=>{const c=rs.filter(r=>r[n.by]===o);return `<div class="kc" data-col="${esc(o)}"><div class="kh"><span class="bd ${F.b&&F.b[o]||""}">${esc(o)}</span><span>${c.length}</span>${n.sum?`<em>${money(c.reduce((s,r)=>s+(+r[n.sum]||0),0))}</em>`:""}</div>${c.map(r=>`<div class="kcard" draggable="true" data-id="${r.id}" data-open="${k}:${r.id}"><b>${esc(r[t])}</b><small style="color:var(--tx2)">${(n.s||[]).map(x=>cellTxt(k,x,r[x])).join(" · ")}</small><div class="m">${n.sum?`<b style="margin:0;color:var(--tx)">${money(r[n.sum])}</b>`:""}${n.d?`<span>${dt(r[n.d])}</span>`:""}</div></div>`).join("")}</div>`}).join("")}</div>`}
function agenda(n){const k=n.e,t=ent(k).title||"name";let rs=rows(k).filter(r=>r[n.d]>=shift(-1)).sort((a,b)=>(a[n.d]+a[n.tm]).localeCompare(b[n.d]+b[n.tm]));const g={};rs.forEach(r=>(g[r[n.d]]=g[r[n.d]]||[]).push(r));
 return `<div class="tbar"><span style="color:var(--tx2)">Yaklaşan ${rs.length} kayıt</span><span style="flex:1"></span><button class="btn s" data-new="${k}">${ic("plus",15)} Yeni ${esc(ent(k).l)}</button></div>${Object.entries(g).map(([d,l])=>`<div class="ag-d">${new Date(d).toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"})}<span>${d===today()?"Bugün":""} · ${l.length}</span></div>${l.map(r=>`<div class="ag" data-open="${k}:${r.id}" style="border-left-color:${r[n.c]&&fld(k,n.c).b?`var(--${fld(k,n.c).b[r[n.c]]==="ok"?"ok":fld(k,n.c).b[r[n.c]]==="er"?"er":fld(k,n.c).b[r[n.c]]==="wa"?"wa":"pr"})`:"var(--pr)"}"><span class="tm">${esc(r[n.tm])}</span><div style="flex:1"><b>${esc(r[t])}</b><br><small style="color:var(--tx3)">${(n.s||[]).map(x=>cellTxt(k,x,r[x])).join(" · ")}</small></div>${n.c?cell(k,n.c,r[n.c],r):""}</div>`).join("")}`).join("")||`<div class="empty">Yaklaşan kayıt yok</div>`}`}
function settings(){return `<div class="grid" style="max-width:640px"><div class="card"><h3>${ic("cog",16)} Görünüm</h3><button class="btn g" data-theme>${ic("moon",16)} ${S.theme==="dark"?"Açık temaya geç":"Koyu temaya geç"}</button></div><div class="card"><h3>${ic("dl",16)} Veriler</h3><p style="color:var(--tx2);margin-top:0">Tüm veriler bu cihazda tarayıcının yerel depolamasında tutulur.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn g" data-json>${ic("dl",16)} Yedek indir (JSON)</button><button class="btn d" data-reset>${ic("trash",16)} Demo verisine dön</button></div></div><div class="card"><h3>${ic("star",16)} Hakkında</h3><p style="color:var(--tx2);margin:0">${esc(C.name)} · Gitmapp hazır şablonu. Gitmapp Geliştir'de açıp yapay zekâyla işine göre değiştirebilirsin.</p></div></div>`}
// Çekmece: ayrıntı / form / belge
function drawer(k,id,edit){const E=ent(k);const r=id?calc(k,DB[k].find(x=>x.id===id)||{}):{};const t=E.title||"name";const bg=document.createElement("div");bg.className="ov-bg";
 const form=edit||!id;const body=form?E.fields.filter(f=>f.t!=="calc").map(f=>`<div class="fl"><label>${esc(f.l)}${f.req?" *":""}</label>${f.t==="select"?`<select name="${f.k}">${f.o.map(o=>`<option ${r[f.k]===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`:f.t==="ref"?`<select name="${f.k}">${(DB[f.ref]||[]).map(x=>`<option value="${x.id}" ${r[f.k]===x.id?"selected":""}>${esc(x[ent(f.ref).title||"name"])}</option>`).join("")}</select>`:f.t==="area"?`<textarea name="${f.k}" rows="3">${esc(r[f.k])}</textarea>`:`<input name="${f.k}" ${f.req?"required":""} type="${f.t==="money"||f.t==="num"||f.t==="pct"?"number":f.t==="date"?"date":f.t==="email"?"email":f.t==="tel"?"tel":f.t==="time"?"time":"text"}" step="any" value="${esc(r[f.k]??(f.t==="date"?today():""))}">`}</div>`).join("")
  :`<dl class="dl">${E.fields.map(f=>`<dt>${esc(f.l)}</dt><dd>${cell(k,f,r[f.k],r)}</dd>`).join("")}</dl>${E.doc?`<div style="margin-top:18px"><button class="btn g" data-doc>${ic("print",16)} ${esc(E.doc)} görüntüle / yazdır</button></div>`:""}`;
 bg.innerHTML=`<form class="drw"><header><span class="av" style="background:linear-gradient(140deg,${hue(r[t]||E.l)})">${ini(r[t]||E.l)}</span><h2>${form?(id?"Düzenle: ":"Yeni ")+esc(id?r[t]:E.l):esc(r[t])}</h2><button type="button" class="ib" data-x>${ic("x",16)}</button></header><div class="bd2">${body}</div><footer>${form?`<button class="btn">${ic("check",16)} Kaydet</button><button type="button" class="btn g" data-x>Vazgeç</button>`:`<button type="button" class="btn" data-ed>${ic("edit",16)} Düzenle</button><span style="flex:1"></span><button type="button" class="btn g" data-del style="color:var(--er)">${ic("trash",16)} Sil</button>`}</footer></form>`;
 document.body.appendChild(bg);const close=()=>bg.remove();bg.onclick=e=>{if(e.target===bg)close()};bg.querySelectorAll("[data-x]").forEach(b=>b.onclick=close);
 const ed=bg.querySelector("[data-ed]");if(ed)ed.onclick=()=>{close();drawer(k,id,true)};
 const de=bg.querySelector("[data-del]");if(de)de.onclick=()=>{if(confirm("Bu kayıt silinsin mi?")){DB[k]=DB[k].filter(x=>x.id!==id);save();close();render();toast("Silindi")}};
 const dc=bg.querySelector("[data-doc]");if(dc)dc.onclick=()=>{close();showDoc(k,id)};
 bg.querySelector("form").onsubmit=e=>{e.preventDefault();if(!form)return;const fd=new FormData(e.target);const o=id?DB[k].find(x=>x.id===id):{id:k[0]+Date.now().toString(36)};const before={...o};
  E.fields.forEach(f=>{if(f.t==="calc")return;let v=fd.get(f.k);if(["money","num","pct"].includes(f.t))v=+v||0;o[f.k]=v});if(!id)DB[k].unshift(o);
  (E.effects||[]).forEach(fx=>{const tg=(DB[fx.target]||[]).find(x=>x.id===o[fx.match]);if(tg){const d=Function("r","return "+fx.delta)(o)-(id?Function("r","return "+fx.delta)(before):0);tg[fx.field]=(+tg[fx.field]||0)+d}});
  save();close();render();toast(id?"Güncellendi":"Kaydedildi")};
}
function showDoc(k,id){const E=ent(k),r=calc(k,DB[k].find(x=>x.id===id));const L=E.docMap;const party=L.party?(DB[fld(k,L.party).ref]||[]).find(x=>x.id===r[L.party])||{}:{};
 const pg=$("#pg");pg.innerHTML=`<div class="tbar no-print"><button class="btn g" data-back>‹ Geri</button><span style="flex:1"></span><button class="btn" onclick="print()">${ic("print",16)} Yazdır / PDF</button></div><div class="doc"><div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap"><div><div style="font-weight:800;font-size:18px;color:${C.brand.pr}">${esc(C.company||C.name)}</div><div style="color:#666;margin-top:4px;line-height:1.5">${esc(C.address||"")}</div></div><div style="text-align:right"><h2>${esc(E.doc).toUpperCase()}</h2><div style="color:#666;margin-top:4px">No: <b>${esc(r[L.no]||id)}</b><br>Tarih: ${dt(r[L.date])}${L.due?`<br>Vade: ${dt(r[L.due])}`:""}</div></div></div>
 <div style="margin:26px 0 18px;padding:14px;background:#f7f7fa;border-radius:10px"><div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.06em">Sayın</div><b style="font-size:15px">${esc(party.name||refName(fld(k,L.party)||{},r[L.party]))}</b>${party.city||party.address?`<div style="color:#666">${esc(party.address||party.city)}</div>`:""}${party.tax?`<div style="color:#666">VKN: ${esc(party.tax)}</div>`:""}</div>
 <table><thead><tr><th>Açıklama</th><th class="num">Miktar</th><th class="num">Birim fiyat</th><th class="num">Tutar</th></tr></thead><tbody><tr><td>${esc(r[L.desc])}</td><td class="num">${r[L.qty]||1}</td><td class="num">${money((+r[L.amount]||0)/(+r[L.qty]||1))}</td><td class="num">${money(r[L.amount])}</td></tr></tbody></table>
 <div class="tot"><div><span>Ara toplam</span><b>${money(r[L.amount])}</b></div><div><span>KDV (%${r[L.vat]||0})</span><b>${money((+r[L.amount]||0)*(+r[L.vat]||0)/100)}</b></div><div class="g"><span>Genel toplam</span><span>${money(r[L.total])}</span></div></div>
 <p style="color:#888;margin-top:30px;font-size:12px">${esc(C.docNote||"Ödemenizi vade tarihine kadar IBAN hesabımıza yapabilirsiniz. Teşekkür ederiz.")}</p></div>`;
 pg.querySelector("[data-back]").onclick=()=>render()}
function render(){const n=C.nav.find(x=>x.id===S.view)||C.nav[0];$("#ttl").textContent=n.label;
 const al=C.dashboard.alerts?rows(C.dashboard.alerts.e).filter(r=>where(r,C.dashboard.alerts.w)).length:0;$("#bell").innerHTML=ic("bell",18)+(al?'<span class="dot"></span>':"");
 document.querySelectorAll(".nv,.mb button").forEach(b=>b.classList.toggle("on",b.dataset.v===n.id));
 $("#pg").innerHTML=n.type==="dashboard"?dash():n.type==="kanban"?kanban(n):n.type==="agenda"?agenda(n):n.type==="settings"?settings():table(n)}
// Kabuk
document.body.innerHTML=`<div class="app"><aside class="sb"><div class="brand"><i>${ic(C.icon||"grid",18)}</i><div>${esc(C.name)}<small>${esc(C.tagline||"")}</small></div></div>${C.nav.map(n=>(n.h?`<div class="sbh">${esc(n.h)}</div>`:"")+`<button class="nv" data-v="${n.id}">${ic(n.icon,18)}${esc(n.label)}${n.e&&n.type!=="settings"?`<b>${(DB[n.e]||[]).length}</b>`:""}</button>`).join("")}<div class="sbf"><span class="av">${ini(C.user.name)}</span><div><b>${esc(C.user.name)}</b><span>${esc(C.user.role)}</span></div></div></aside>
<div class="main"><header class="tb"><h1 id="ttl"></h1><label class="srch">${ic("search",16)}<input id="q" placeholder="Ara…"></label><button class="ib" id="th" title="Tema">${ic("moon",17)}</button><button class="ib" id="bell" title="Uyarılar"></button></header><div class="pg" id="pg"></div></div>
<nav class="mb">${C.nav.slice(0,5).map(n=>`<button data-v="${n.id}">${ic(n.icon,20)}${esc(n.short||n.label.split(" ")[0])}</button>`).join("")}</nav></div>`;
document.addEventListener("click",e=>{const t=e.target.closest("[data-v],[data-open],[data-new],[data-sort],[data-f],[data-pg],[data-go],[data-csv],[data-theme],[data-reset],[data-json]");if(!t)return;const d=t.dataset;
 if(d.v){S.view=d.v;S.q="";$("#q").value="";S.page=0;render();scrollTo(0,0)}else if(d.go!==undefined){e.preventDefault();const n=C.nav.find(x=>x.e===d.go);if(n){S.view=n.id;render()}}
 else if(d.open){const [k,id]=d.open.split(":");drawer(k,id)}else if(d.new)drawer(d.new);
 else if(d.sort){const k=C.nav.find(x=>x.id===S.view).e;const c=S.sort[k];S.sort[k]={k:d.sort,d:c&&c.k===d.sort?-c.d:1};render();document.querySelector('button[data-sort="'+CSS.escape(d.sort)+'"]')?.focus({preventScroll:true})}
 else if(d.f!==undefined){const k=C.nav.find(x=>x.id===S.view).e;S.filter[k]=d.f||null;S.page=0;render()}else if(d.pg){S.page+=+d.pg;render()}
 else if(d.csv){const E=ent(d.csv);const head=E.fields.map(f=>f.l);const lines=[head,...rows(d.csv).map(r=>E.fields.map(f=>f.t==="ref"?refName(f,r[f.k]):r[f.k]))].map(l=>l.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";"));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+lines.join("\n")],{type:"text/csv"}));a.download=d.csv+".csv";a.click()}
 else if(d.theme!==undefined)$("#th").click();else if(d.reset!==undefined){if(confirm("Tüm değişiklikler silinip demo verisine dönülsün mü?")){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}}
 else if(d.json!==undefined){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}));a.download=C.id+"-yedek.json";a.click()}});
$("#q").oninput=e=>{S.q=e.target.value;S.page=0;const n=C.nav.find(x=>x.id===S.view);if(n.type==="dashboard"){const f=C.nav.find(x=>x.type==="table");if(f){S.view=f.id}}render();$("#q").focus()};
$("#th").onclick=()=>{S.theme=S.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=S.theme;try{localStorage.setItem(KEY+"_th",S.theme)}catch(e){}render()};
$("#bell").onclick=()=>{S.view=C.nav[0].id;render()};
let drag=null;document.addEventListener("dragstart",e=>{const c=e.target.closest(".kcard");if(c){drag=c.dataset.id;e.dataTransfer.effectAllowed="move"}});
document.addEventListener("dragover",e=>{const c=e.target.closest(".kc");if(c&&drag){e.preventDefault();document.querySelectorAll(".kc").forEach(x=>x.classList.toggle("ov",x===c))}});
document.addEventListener("drop",e=>{const c=e.target.closest(".kc");if(c&&drag){e.preventDefault();const n=C.nav.find(x=>x.id===S.view);const r=DB[n.e].find(x=>x.id===drag);if(r){r[n.by]=c.dataset.col;save();toast("“"+c.dataset.col+"” aşamasına taşındı")}drag=null;render()}});
document.addEventListener("dragend",()=>{drag=null;document.querySelectorAll(".kc").forEach(x=>x.classList.remove("ov"))});
render();
})();
</script></body></html>
