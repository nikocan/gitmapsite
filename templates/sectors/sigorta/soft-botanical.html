<style>:root{--pr:#0f766e;--ac:#f59e0b;--bg:#fbfaf7;--sf:#fff;--sf2:#f3f1ec;--tx:#14161c;--tx2:#4b5160;--tx3:#8a90a0;--ln:#e8e5de;--r:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--font),Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit;text-decoration:none}img,svg{display:block}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.nav{position:sticky;top:12px;z-index:30;margin:12px auto 0;max-width:1200px;padding:0 16px}
.nav-in{display:flex;align-items:center;gap:22px;padding:10px 12px 10px 18px;border-radius:18px;background:color-mix(in srgb,var(--sf) 78%,transparent);backdrop-filter:blur(18px) saturate(1.4);border:1px solid color-mix(in srgb,var(--ln) 80%,transparent);box-shadow:0 10px 30px -18px rgba(20,22,28,.35)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.3px}.logo i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(140deg,var(--pr),var(--ac));color:#fff;font-style:normal;font-size:17px}
.links{display:flex;gap:4px;margin-left:auto}.links a{padding:8px 12px;border-radius:10px;color:var(--tx2);font-weight:500;font-size:14.5px}.links a:hover{background:var(--sf2);color:var(--tx)}

.btn.g{background:var(--sf);color:var(--tx);border:1px solid var(--ln);box-shadow:none}.btn.s{padding:9px 14px;font-size:14px;border-radius:12px}.btn.w{background:#fff;color:var(--tx)}
.eyb{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--pr);background:color-mix(in srgb,var(--pr) 10%,transparent);padding:6px 12px;border-radius:99px}

.lead{font-size:18.5px;color:var(--tx2);max-width:560px;margin:0 0 26px}

.sbar{display:flex;gap:8px;align-items:stretch;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:8px;box-shadow:0 24px 50px -30px rgba(20,22,28,.45);flex-wrap:wrap}
.sbar .f{flex:1;min-width:130px;display:flex;flex-direction:column;padding:6px 12px;border-right:1px solid var(--ln)}.sbar .f:last-of-type{border:0}.sbar label{font-size:11.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}.sbar select,.sbar input{border:0;outline:0;background:none;font-weight:600;padding:2px 0}
.tabs{display:inline-flex;gap:4px;background:var(--sf2);padding:4px;border-radius:14px;margin-bottom:12px}.tabs button{border:0;background:none;padding:8px 16px;border-radius:10px;font-weight:600;color:var(--tx2);cursor:pointer}.tabs button.on{background:var(--sf);color:var(--tx);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}.stats div{padding:18px;border-radius:18px;background:var(--sf);border:1px solid var(--ln)}.stats b{display:block;font-size:30px;letter-spacing:-1px}.stats span{color:var(--tx3);font-size:14px}
section.s{padding:70px 0}.sh{display:flex;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}.sh h2{font-size:clamp(28px,3.4vw,42px);letter-spacing:-1.2px;line-height:1.08;margin:10px 0 0;flex:1;min-width:260px}.sh p{color:var(--tx2);max-width:420px;margin:0}

.lim{position:relative;aspect-ratio:4/3;overflow:hidden}.lim svg{width:100%;height:100%;transition:transform .6s}.lcard:hover .lim svg{transform:scale(1.04)}
.tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);color:var(--tx);font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px}.tag.pr{background:var(--pr);color:#fff;left:auto;right:56px}
.fav{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;color:var(--tx2)}.fav.on{color:#e11d48}
.lb{padding:16px 18px 18px}.lb .pr{font-size:22px;font-weight:800;letter-spacing:-.6px}.lb .pr small{font-size:13px;color:var(--tx3);font-weight:600}.lb h3{margin:4px 0 2px;font-size:16px}.lb .loc{color:var(--tx3);font-size:14px;display:flex;align-items:center;gap:5px}
.specs{display:flex;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--ln);color:var(--tx2);font-size:13.5px}.specs span{display:flex;align-items:center;gap:6px}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}.fbar select,.fbar input{border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:10px 12px;font-weight:500}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--tx2)}.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(170px,auto);gap:16px}.bx{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}.bx.w2{grid-column:span 2}.bx.h2{grid-row:span 2}.bx.dk{background:var(--tx);color:var(--bg)}.bx.dk p{color:color-mix(in srgb,var(--bg) 70%,transparent)}.bx.br{background:linear-gradient(150deg,var(--pr),color-mix(in srgb,var(--pr) 60%,var(--ac)));color:#fff}.bx.br p{color:rgba(255,255,255,.85)}
.bx .bi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--pr) 12%,transparent);color:var(--pr);font-size:22px}.bx.dk .bi,.bx.br .bi{background:rgba(255,255,255,.14);color:#fff}.bx h3{margin:6px 0 0;font-size:19px;letter-spacing:-.3px}.bx p{margin:0;color:var(--tx2);font-size:14.5px}.bx .big{font-size:48px;font-weight:800;letter-spacing:-2px;margin-top:auto}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:s}.step{padding:24px;border-radius:var(--r);background:var(--sf);border:1px solid var(--ln)}.step::before{counter-increment:s;content:counter(s,decimal-leading-zero);font-weight:800;font-size:15px;color:var(--pr)}.step h3{margin:10px 0 6px}.step p{margin:0;color:var(--tx2);font-size:14.5px}
.tst{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.tc{padding:24px;border-radius:var(--r);background:var(--sf);border:1px solid var(--ln);display:flex;flex-direction:column;gap:14px}.tc q{font-size:16px;line-height:1.6;quotes:none}.st{color:#f59e0b;letter-spacing:2px}.who{display:flex;gap:12px;align-items:center;margin-top:auto}.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}.who b{display:block;font-size:14.5px}.who span{font-size:13px;color:var(--tx3)}
.faq{max-width:820px}.faq details{border-bottom:1px solid var(--ln);padding:18px 4px}.faq summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:20px}.faq summary::after{content:"+";font-size:24px;color:var(--pr);line-height:1;transition:transform .2s}.faq details[open] summary::after{transform:rotate(45deg)}.faq p{color:var(--tx2);margin:10px 0 0}
.cta{border-radius:32px;padding:56px;background:radial-gradient(500px 260px at 90% 10%,color-mix(in srgb,var(--ac) 45%,transparent),transparent 70%),linear-gradient(140deg,var(--tx),color-mix(in srgb,var(--tx) 70%,var(--pr)));color:#fff;display:flex;gap:30px;align-items:center;justify-content:space-between;flex-wrap:wrap}.cta h2{font-size:clamp(28px,3.5vw,44px);letter-spacing:-1.4px;margin:0;max-width:620px;line-height:1.08}.cta p{color:rgba(255,255,255,.75);margin:10px 0 0}
.ctc{display:grid;grid-template-columns:1fr 1fr;gap:24px}.form{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:26px;display:grid;gap:12px}.form input,.form select,.form textarea{border:1px solid var(--ln);background:var(--bg);border-radius:12px;padding:12px 14px;outline:0;width:100%}.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--pr);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 15%,transparent)}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.map{border-radius:var(--r);overflow:hidden;border:1px solid var(--ln);min-height:320px;position:relative;background:var(--sf2)}
.info{display:flex;flex-direction:column;gap:10px;margin-top:14px}.info div{display:flex;gap:10px;align-items:center;color:var(--tx2)}
footer.ft{padding:50px 0 40px;border-top:1px solid var(--ln);margin-top:40px;color:var(--tx3);font-size:14px}.ftg{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px}.ftg b{display:block;color:var(--tx);margin-bottom:10px}.ftg a{display:block;padding:3px 0}.ftg a:hover{color:var(--tx)}
.md-bg{position:fixed;inset:0;z-index:60;background:rgba(15,17,22,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fi .2s}@keyframes fi{from{opacity:0}}
.md{width:min(1000px,100%);max-height:92vh;overflow:auto;background:var(--sf);border-radius:28px;animation:up .3s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(20px);opacity:0}}
.md-x{position:sticky;top:12px;float:right;margin:12px 12px 0 0;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);cursor:pointer;font-size:18px;z-index:2;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.gal{display:grid;grid-template-columns:2fr 1fr;gap:8px;padding:8px}.gal>div{border-radius:20px;overflow:hidden}.gal .side{display:grid;gap:8px}.gal svg{width:100%;height:100%}
.mdb{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;padding:20px 28px 30px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:14px 0}.feat span{display:flex;gap:8px;align-items:center;color:var(--tx2);font-size:14.5px}.feat span::before{content:"✓";color:var(--pr);font-weight:800}
.box{background:var(--sf2);border-radius:18px;padding:18px}
.wz{max-width:760px;margin:0 auto;background:var(--sf);border:1px solid var(--ln);border-radius:28px;padding:28px;box-shadow:0 30px 60px -40px rgba(20,22,28,.5)}
.wzs{display:flex;gap:8px;margin-bottom:22px}.wzs i{flex:1;height:5px;border-radius:9px;background:var(--sf2)}.wzs i.on{background:var(--pr)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.opt{border:1.5px solid var(--ln);border-radius:16px;padding:16px;cursor:pointer;background:var(--sf);text-align:left;display:flex;flex-direction:column;gap:6px;transition:.15s}.opt:hover{border-color:var(--pr)}.opt.on{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 7%,var(--sf));box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 12%,transparent)}.opt .e{font-size:26px}.opt b{font-size:15px}.opt small{color:var(--tx3)}
.offer{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--ln);border-radius:18px;margin-bottom:10px}.offer.best{border-color:var(--pr);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 10%,transparent)}.offer .p{margin-left:auto;text-align:right}.offer .p b{font-size:22px;letter-spacing:-.5px;display:block}
.mtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;position:sticky;top:84px;z-index:5}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.mi{display:flex;gap:16px;align-items:center;padding:14px;border-radius:20px;background:var(--sf);border:1px solid var(--ln)}.plate{width:92px;height:92px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:46px;box-shadow:inset 0 0 0 7px rgba(255,255,255,.65),0 12px 24px -12px rgba(0,0,0,.35)}.mi h3{margin:0;font-size:16.5px}.mi p{margin:3px 0 8px;color:var(--tx2);font-size:13.5px}.mi .r{display:flex;align-items:center;justify-content:space-between}.mi .r b{font-size:17px}
.add{width:36px;height:36px;border-radius:50%;border:0;background:var(--pr);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
.cartbtn{position:fixed;right:22px;bottom:22px;z-index:40;display:flex;align-items:center;gap:10px;background:var(--tx);color:var(--bg);border:0;border-radius:99px;padding:14px 20px;font-weight:700;cursor:pointer;box-shadow:0 20px 40px -14px rgba(0,0,0,.6)}.cartbtn b{background:var(--ac);color:#111;border-radius:99px;padding:1px 9px}
.drw{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--sf);z-index:70;display:flex;flex-direction:column;animation:sl .25s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px -20px rgba(0,0,0,.4)}@keyframes sl{from{transform:translateX(40px);opacity:0}}
.drw header{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--ln)}.drw .b{flex:1;overflow:auto;padding:14px 20px}.drw footer{padding:18px 20px;border-top:1px solid var(--ln)}
.ci{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.ci .q{display:flex;align-items:center;gap:8px;margin-left:auto}.ci .q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;z-index:90;animation:fi .2s}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}.reveal.in{opacity:1;transform:none}
.mnav{display:none}
@media(max-width:960px){.hero-g,.ctc,.mdb{grid-template-columns:1fr}.lgrid,.tst,.steps{grid-template-columns:1fr 1fr}.bento{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.ftg{grid-template-columns:1fr 1fr}.mgrid{grid-template-columns:1fr}}
@media(max-width:640px){.links{display:none}.mnav{display:grid;margin-left:auto}.lgrid,.tst,.steps,.bento{grid-template-columns:1fr}.bx.w2{grid-column:auto}.cta{padding:32px}.sbar .f{border-right:0;border-bottom:1px solid var(--ln);min-width:100%}.hero{padding-top:44px}.gal{grid-template-columns:1fr}.gal .side{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}.feat{grid-template-columns:1fr}.plate{width:72px;height:72px;font-size:36px}}

:root{--pr:#2563eb;--ac:#10b981;--font:'Manrope'}</style><style data-gm-tpl-theme>
:root[data-gm-template-style]{
 --pr:var(--gm-pr);--ac:var(--gm-ac);--bg:var(--gm-bg);--sf:var(--gm-sf);--sf2:color-mix(in srgb,var(--gm-bg) 65%,var(--gm-ln));
 --tx:var(--gm-tx);--tx2:color-mix(in srgb,var(--gm-tx) 83%,var(--gm-bg));--tx3:var(--tx2);--ln:var(--gm-ln);
 --panel:var(--sf);--paper:var(--bg);--ink:var(--tx);--line:var(--ln);
 --r:var(--gm-radius,12px);--sh:var(--gm-shadow,0 8px 22px -19px var(--tx));
 --gm-display:system-ui,sans-serif;--gm-weight:750;--gm-tracking:-.042em;--gm-space:clamp(22px,4.2vw,58px);
 color:var(--tx);background:var(--bg)
}
:root[data-gm-template-style][data-theme="dark"]{
 --bg:#101820;--sf:#1c2730;--sf2:#263441;--tx:#f1f5f7;--ln:#435460;
 --pr:color-mix(in srgb,var(--gm-pr) 70%,#111);--ac:color-mix(in srgb,var(--gm-ac) 40%,#fff)
}
[data-gm-template-style] :is(h1,h2,.big){font-family:var(--gm-display);font-weight:var(--gm-weight);letter-spacing:var(--gm-tracking);overflow-wrap:anywhere}
[data-gm-template-style] :is(.hero h1,.hero h2){text-wrap:balance}
[data-gm-template-style] :is(.card,.surface,.history,main>div.grid>article,main>div.grid>form,.workflow>form,.work>form,.offer,.kc,.kcard,.lcard){
 background:var(--sf);color:var(--tx);border:var(--gm-border,1px) solid var(--ln);border-radius:var(--r);box-shadow:var(--sh)
}
[data-gm-template-style] :is(.work,.workflow,main>.grid,.pg>.grid,.lgrid,.bento){gap:var(--gm-gap,18px)}
[data-gm-template-style] :is(.tb,.sb,.nav-in,body>header){background:var(--sf);color:var(--tx);border-color:var(--ln)}
[data-gm-template-style] body>header>a{background:var(--sf2);color:var(--tx)}
[data-gm-template-style] body>header{gap:12px}
[data-gm-template-style] :is(.lead,.offer small,small.muted,footer):not(.hero *){color:var(--tx2)}

[data-gm-template-style] .hero:has(.hero-copy){border-radius:var(--r);overflow:hidden}
[data-gm-template-style] .hero-copy{padding:var(--gm-space);background:var(--gm-pr);color:#fff}
[data-gm-template-style] .hero-copy p{color:white}
[data-gm-template-style] .hero:not(:has(.hero-copy,.hero-g)) {

 position:relative;overflow:hidden;margin-bottom:var(--gm-gap,18px)
}
[data-gm-template-style] .hero:not(:has(.hero-copy,.hero-g)) :is(h1,p,.lead,a){color:white}

[data-gm-template-style] .offer[aria-pressed="true"]{background:var(--sf2);border-color:var(--gm-pr);box-shadow:inset 4px 0 var(--gm-pr)}

 const draw=()=>{let ls=C.listings.map((l,i)=>[l,i]).filter(([l,i])=>(!F.type||l.type===F.type)&&(!F.city||l.city===F.city)&&(!F.rooms||l.rooms===F.rooms)&&(!F.max||l.price<=F.max)&&(!F.fav||fav.includes(i)));
  ls.sort((a,b)=>F.sort==="asc"?a[0].price-b[0].price:F.sort==="desc"?b[0].price-a[0].price:F.sort==="m2"?b[0].m2-a[0].m2:a[1]-b[1]);$("#lgrid").innerHTML=ls.map(([l,i])=>card(l,i)).join("")||`<p style="color:var(--tx3);grid-column:1/-1;text-align:center;padding:40px">Bu kriterlere uygun ilan bulunamadı.</p>`};draw();
 document.addEventListener("click",e=>{const t=e.target.closest("[data-lt],[data-fav],[data-l],#favf,[data-ht]");if(!t)return;
  if(t.dataset.ht!==undefined){document.querySelectorAll("#htabs button").forEach(b=>b.classList.toggle("on",b===t));F.type=t.dataset.ht==="Satılık"||t.dataset.ht==="Kiralık"?t.dataset.ht:"";return}
  if(t.dataset.lt!==undefined){F.type=t.dataset.lt;document.querySelectorAll("[data-lt]").forEach(c=>c.classList.toggle("on",c===t));draw()}
  else if(t.dataset.fav){e.stopPropagation();const i=+t.dataset.fav;fav=fav.includes(i)?fav.filter(x=>x!==i):[...fav,i];LS.set("fav",fav);draw();toast(fav.includes(i)?"Favorilere eklendi":"Favorilerden çıkarıldı")}
  else if(t.id==="favf"){F.fav=!F.fav;t.classList.toggle("on",F.fav);draw()}
  else if(t.dataset.l)openL(+t.dataset.l)});
 $("#lsort").onchange=e=>{F.sort=e.target.value;draw()};
 const hs=$("#hsearch");if(hs)hs.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(hs));F.city=d.city;F.rooms=d.rooms;F.max=+d.max||0;draw();document.getElementById("ilanlar").scrollIntoView({behavior:"smooth"})};
 const openL=i=>{const l=C.listings[i];const m=document.createElement("div");m.className="md-bg";m.innerHTML=`<div class="md"><button class="md-x">✕</button><div class="gal"><div style="aspect-ratio:4/3">${house(l.title,i,l.kind)}</div><div class="side"><div>${house(l.title+"a",i+20,l.kind)}</div><div>${house(l.title+"b",i+40,l.kind)}</div></div></div>
  <div class="mdb"><div><span class="eyb">${esc(l.type)} · ${esc(l.kind)}</span><h2 style="font-size:30px;letter-spacing:-.8px;margin:10px 0 4px">${esc(l.title)}</h2><div class="loc" style="color:var(--tx3);display:flex;gap:6px;align-items:center">${ic("pin",15)} ${esc(l.district)}, ${esc(l.city)} · İlan no ${1000+i*37}</div><div class="specs" style="font-size:15px"><span>${ic("bed")} ${esc(l.rooms)}</span><span>${ic("area")} ${l.m2} m² net</span><span>${ic("floor")} ${esc(l.floor)}</span><span>🏗️ ${esc(l.age)} yaşında</span></div><p style="color:var(--tx2)">${esc(l.desc)}</p><b>Özellikler</b><div class="feat">${l.feat.map(f=>`<span>${esc(f)}</span>`).join("")}</div></div>
  <div><div class="box"><div style="font-size:30px;font-weight:800;letter-spacing:-1px">${money(l.price)}${l.type==="Kiralık"?" <small style='font-size:14px;color:var(--tx3)'>/ ay</small>":""}</div>${l.type==="Satılık"?`<div style="color:var(--tx2);font-size:14px">m² fiyatı ${money(l.price/l.m2)}</div>`:""}<div class="who" style="margin:16px 0"><span class="av" style="background:var(--pr)">${C.agent.split(" ").map(w=>w[0]).join("")}</span><div><b>${esc(C.agent)}</b><span>Gayrimenkul danışmanı</span></div></div>
  <form class="form" data-lead="ilan" style="padding:0;border:0;background:none"><input type="hidden" name="ilan" value="${esc(l.title)}"><input name="ad" required placeholder="Ad Soyad"><input name="tel" required placeholder="Telefon"><textarea name="mesaj" rows="2">Merhaba, “${esc(l.title)}” ilanı hakkında bilgi almak istiyorum.</textarea><button class="btn">Danışmana sor</button><a class="btn g" href="https://wa.me/?text=${encodeURIComponent(l.title+" ilanı hakkında bilgi almak istiyorum")}" target="_blank" rel="noopener">WhatsApp ile yaz</a></form></div></div></div></div>`;
  document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.closest(".md-x"))m.remove()};m.querySelector("form").addEventListener("submit",()=>setTimeout(()=>m.remove(),300))};
}
const calc=$("#calc");if(calc){const f=()=>{const d=Object.fromEntries([...calc.querySelectorAll("input,select")].map(x=>[x.name,+x.value]));const P=Math.max(0,d.p-d.d),r=d.r/100,n=d.n;const m=r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n;$("#calcv").textContent=money(m);$("#calct").textContent=`Kredi tutarı ${money(P)} · Toplam geri ödeme ${money(m*n)}`};calc.oninput=f;f()}
// Sigorta teklif sihirbazı
if(C.quote){const Q={step:0,p:null,d:{}};const P=C.products;const steps=["Ürün","Bilgiler","İletişim","Teklifler"];
 const fields={kasko:[["plaka","Plaka","34 ABC 123"],["model","Marka / model","Toyota Corolla 2022"],["yil","Model yılı","2022"]],trafik:[["plaka","Plaka","34 ABC 123"],["ruhsat","Ruhsat seri no","AB 123456"]],konut:[["adres","Konut adresi","Kadıköy, İstanbul"],["m2","Brüt m²","120"],["yil","Bina yılı","2008"]],dask:[["adres","Konut adresi","Çankaya, Ankara"],["m2","Brüt m²","95"]],saglik:[["dogum","Doğum yılı","1988"],["kisi","Sigortalanacak kişi sayısı","1"]],isyeri:[["faaliyet","Faaliyet alanı","Kafe"],["deger","Tahmini demirbaş değeri (₺)","400000"]],seyahat:[["ulke","Gideceğiniz ülke","Almanya"],["gun","Kaç gün","10"]]};
 const draw=()=>{const w=$("#wz");const pr=P.find(x=>x.id===Q.p);let h=`<div class="wzs">${steps.map((s,i)=>`<i class="${i<=Q.step?"on":""}"></i>`).join("")}</div><div style="color:var(--tx3);font-size:13px;font-weight:700">ADIM ${Q.step+1}/4 · ${steps[Q.step].toUpperCase()}</div>`;
  if(Q.step===0)h+=`<h3 style="font-size:24px;margin:6px 0 16px">Hangi sigortayı arıyorsun?</h3><div class="opts">${P.map(p=>`<button class="opt ${Q.p===p.id?"on":""}" data-qp="${p.id}"><span class="e">${ic(insuranceIcons[p.id],24)}</span><b>${esc(p.t)}</b><small>${esc(p.s||"")}</small></button>`).join("")}</div>`;
  if(Q.step===1)h+=`<h3 style="font-size:24px;margin:6px 0 16px">${esc(pr.t)} için birkaç bilgi</h3><form class="form" id="qf" style="padding:0;border:0">${(fields[Q.p]||[]).map(([k,l,ph])=>`<label style="font-size:13px;font-weight:600;color:var(--tx2)">${esc(l)}<input name="${k}" required placeholder="${esc(ph)}" value="${esc(Q.d[k]||"")}"></label>`).join("")}</form>`;
  if(Q.step===2)h+=`<h3 style="font-size:24px;margin:6px 0 16px">Teklifleri nereye gönderelim?</h3><form class="form" id="qf" style="padding:0;border:0"><div class="row2"><input name="ad" required placeholder="Ad Soyad" value="${esc(Q.d.ad||"")}"><input name="tel" required placeholder="Telefon" value="${esc(Q.d.tel||"")}"></div><input name="tc" placeholder="T.C. kimlik no (isteğe bağlı)" maxlength="11"><label style="display:flex;gap:8px;font-size:13px;color:var(--tx2)"><input type="checkbox" required style="width:auto"> KVKK kapsamında bilgilerimin teklif için işlenmesini kabul ediyorum.</label></form>`;
  if(Q.step===3){const base=pr.base;const cs=C.companies.map((c,i)=>({c,v:Math.round(base*(0.86+((hue(c+Q.p+(Q.d.tel||""))%30)/100)))})).sort((a,b)=>a.v-b.v);
   h+=`<h3 style="font-size:24px;margin:6px 0 4px">${esc(pr.t)} teklifleri hazır</h3><p style="color:var(--tx2);margin:0 0 16px">${cs.length} şirketten anında fiyat aldık. Uzmanımız en uygun teminatı seçmen için seni arayacak.</p>${cs.map((o,i)=>`<div class="offer ${i?"":"best"}"><span class="av" style="background:hsl(${hue(o.c)} 55% 45%);border-radius:14px">${o.c[0]}</span><div><b>${esc(o.c)}</b><div style="color:var(--tx3);font-size:13px">${i===0?"⭐ En uygun fiyat · ":""}12 ay · taksit imkânı</div></div><div class="p"><b>${money(o.v)}</b><button class="btn s ${i?"g":""}" data-pick="${esc(o.c)}">Bu teklifi seç</button></div></div>`).join("")}`}
  h+=`<div style="display:flex;justify-content:space-between;margin-top:20px">${Q.step?`<button class="btn g" data-qb>‹ Geri</button>`:"<span></span>"}${Q.step<3?`<button class="btn" data-qn ${Q.step===0&&!Q.p?"disabled style='opacity:.5'":""}>${Q.step===2?"Teklifleri getir":"Devam"} ${ic("arrow",17)}</button>`:""}</div>`;w.innerHTML=h};draw();
 document.addEventListener("click",e=>{const t=e.target.closest("[data-qp],[data-qn],[data-qb],[data-pick],[data-quote]");if(!t)return;
  if(t.dataset.quote){Q.p=t.dataset.quote;Q.step=1;draw();document.getElementById("teklif").scrollIntoView({behavior:"smooth"});return}
  if(t.dataset.qp){Q.p=t.dataset.qp;draw()}else if(t.dataset.qb!==undefined){Q.step--;draw()}
  else if(t.dataset.qn!==undefined){const f=$("#qf");if(f){if(!f.reportValidity())return;Object.assign(Q.d,Object.fromEntries(new FormData(f)))}if(Q.step===0&&!Q.p)return;Q.step++;draw()}
  else if(t.dataset.pick){const l=LS.get("talepler",[]);l.unshift({tur:"teklif",urun:Q.p,sirket:t.dataset.pick,...Q.d,t:new Date().toISOString()});LS.set("talepler",l);toast(t.dataset.pick+" teklifi için talebin alındı. Uzmanımız seni arayacak.");Q.step=0;Q.p=null;Q.d={};draw()}});
}
// Restoran menüsü ve sepet
if(C.menu){let cat=0,cart=LS.get("cart",{});const all=C.menu.flatMap(m=>m.items);
 const draw=()=>{$("#mgrid").innerHTML=C.menu[cat].items.map(it=>`<div class="mi reveal in">${plate(it.e,it.c)}<div style="flex:1"><h3>${esc(it.n)}${it.tag?` <span class="eyb" style="font-size:10.5px;padding:3px 8px;vertical-align:middle">${esc(it.tag)}</span>`:""}</h3><p>${esc(it.d)}</p><div class="r"><b>${money(it.p)}</b><button class="add" data-add="${esc(it.n)}" aria-label="Sepete ekle">+</button></div></div></div>`).join("");cb()};
 const total=()=>Object.entries(cart).reduce((s,[n,q])=>s+(all.find(x=>x.n===n)||{p:0}).p*q,0);const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
 const btn=document.createElement("button");btn.className="cartbtn";document.body.appendChild(btn);
 const cb=()=>{btn.style.display=count()?"flex":"none";btn.innerHTML=`🛍️ Sepet <b>${count()}</b> ${money(total())}`;LS.set("cart",cart)};
 const openCart=()=>{const d=document.createElement("div");d.innerHTML=`<div class="md-bg" style="justify-content:flex-end;padding:0"></div><aside class="drw"><header><b style="font-size:18px">Siparişin</b><button class="btn g s" data-cx>Kapat</button></header><div class="b">${Object.entries(cart).map(([n,q])=>{const it=all.find(x=>x.n===n);return `<div class="ci">${it.e} <div><b>${esc(n)}</b><div style="color:var(--tx3);font-size:13px">${money(it.p)}</div></div><div class="q"><button data-dec="${esc(n)}">−</button>${q}<button data-add="${esc(n)}">+</button></div></div>`}).join("")||"<p>Sepetin boş.</p>"}</div><footer><div style="display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-bottom:12px"><span>Toplam</span><span>${money(total())}</span></div><a class="btn" style="width:100%" target="_blank" rel="noopener" href="https://wa.me/${C.whatsapp}?text=${encodeURIComponent("Merhaba, sipariş vermek istiyorum:\n"+Object.entries(cart).map(([n,q])=>q+" x "+n).join("\n")+"\nToplam: "+money(total()))}">WhatsApp ile sipariş ver</a></footer></aside>`;document.body.appendChild(d);d.onclick=e=>{if(e.target.classList.contains("md-bg")||e.target.closest("[data-cx]"))d.remove();else if(e.target.closest("[data-add],[data-dec]"))setTimeout(()=>{d.remove();if(count())openCart()},0)}};
 btn.onclick=openCart;document.addEventListener("click",e=>{const t=e.target.closest("[data-mc],[data-add],[data-dec]");if(!t)return;if(t.dataset.mc){cat=+t.dataset.mc;document.querySelectorAll("[data-mc]").forEach(c=>c.classList.toggle("on",c===t));draw()}else if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;cb();if(!t.closest(".drw"))toast(t.dataset.add+" sepete eklendi")}else if(t.dataset.dec){const n=t.dataset.dec;cart[n]=(cart[n]||0)-1;if(cart[n]<=0)delete cart[n];cb()}});draw()}
window.__house=house;
})();
</script></body></html>
