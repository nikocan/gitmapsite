<header><b>Ajans Mesaisi</b><a href="#task">Süreyi yaz</a></header><main><div class="hero"><h1>Proje süre çizelgesi</h1><p class="lead">Müşteri işine harcanan süreyi moladan ayırın. Saatlik bedelle faturalandırılabilir tutarı hesaplayın.</p></div>
<div class="work"><section class="surface"><h2>Hizmet özeti</h2><div class="readout"><span>Net çalışma</span><output id="hours">—</output></div><div class="readout"><span>Hizmet bedeli</span><output id="fee">—</output></div></section><form id="task"><h2>Süreyi yaz</h2><label>Müşteri ve iş<input type="text" name="name" required ></label><label>Başlangıç<input type="time" name="start" required value="09:00"></label><label>Bitiş<input type="time" name="end" required value="11:00"></label><label>Mola (dakika)<input type="number" name="pause" required min="0" value="0"></label><label>Saatlik ücret (₺)<input type="number" name="price" required min="0.01" step="0.01"></label><button type="submit">Süreyi yaz</button></form></div>
<section class="history"><h2>Müşteri çalışma kayıtları</h2><p id="empty">Henüz kayıt yok.</p><ul id="records"></ul></section><p role="status" id="status"></p></main><footer>Örnek veriler bu cihazda saklanır.</footer>
<script>
const form=document.querySelector("form");
const key="gitmapp-mesai";
const list=document.querySelector("#records"),statusLine=document.querySelector("#status");
let rows=[];
try{rows=JSON.parse(localStorage.getItem(key)||"[]")}catch{}
/* gitmapp-task-records */
const amount=n=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY"}).format(n);
const values=()=>Object.fromEntries(new FormData(form));
const show=(id,text)=>document.getElementById(id).textContent=text;
function persist(){
 render();form.dispatchEvent(new Event("gitmapp-save"));
 try{localStorage.setItem(key,JSON.stringify(rows));statusLine.textContent="Kaydedildi."}
 catch{statusLine.textContent="Kayıt bu oturumda tutuluyor. Cihaz depolaması dolu veya kapalı."}
}
function minutes(time){if(!time)return NaN;const [h,m]=time.split(":").map(Number);return h*60+m}
function calc(v){return minutes(v.end)-minutes(v.start)-Number(v.pause)}
function update(){const v=values(),net=calc(v);show("hours",net>0?net+" dk":"—");show("fee",net>0&&v.price?amount(net/60*Number(v.price)):"—")}
function makeRecord(v){const net=calc(v);if(!(net>0)){form.end.setCustomValidity("Aynı günde bitiş saati ve moladan sonra çalışma süresi pozitif olmalı.");form.reportValidity();return}return {text:v.name+" · "+net+" dk · "+amount(net/60*Number(v.price))}}
function render(){
 list.replaceChildren();document.querySelector("#empty").hidden=rows.length>0;
 for(const row of rows){
  const li=document.createElement("li");li.textContent=row.text;
  list.append(li);
 }
 update();
}
form.addEventListener("input",()=>{for(const el of form.elements)el.setCustomValidity?.("");update()});
form.addEventListener("submit",event=>{
 event.preventDefault();const row=makeRecord(values());if(!row)return;
 rows.unshift(row);form.reset();persist();
});
render();
</script></body></html>
