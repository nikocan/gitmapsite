<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mola Seans</title>
<!-- Gitmapp hazır şablonu · Randevu UI kiti -->
<style>
:root{--pr:#285448;--ac:#a39b6d;--bg:#eaf1ed;--sf:#fafffa;--sf2:#dcebe3;--tx:#152b24;--tx2:#405b50;--ln:#c8ddd1;--r:18px;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1120px;margin:auto;padding:18px clamp(15px,4vw,45px)}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ln);gap:12px}header strong{font:600 26px Georgia,serif}nav{display:flex;gap:6px}button,input{font:inherit}button{cursor:pointer;min-height:42px;padding:8px 12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:9px}.primary,button[aria-current=true],button[aria-pressed=true]{background:var(--pr);color:white;border-color:var(--pr)}button:disabled{opacity:.55;cursor:default}:focus-visible{outline:2px solid var(--pr);outline-offset:3px}.hero{display:grid;grid-template-columns:1fr 1fr;background:var(--sf2);border-radius:var(--r);overflow:hidden}.hero>div{padding:clamp(19px,4vw,50px);align-self:center}.art{min-height:260px;background:var(--sf) url("./art/pilates.webp") center/cover}.split,.offer-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.card{padding:clamp(13px,3vw,28px);background:var(--sf);border:1px solid var(--ln);border-radius:var(--r)}.card>*+*,.hero p,.card time{margin-top:11px}h1{font:500 clamp(34px,6vw,66px)/1 Georgia,serif;letter-spacing:-.04em;margin:0}h2,h3,p{margin:0}p,footer{color:var(--tx2)}.slot-list{display:flex;flex-wrap:wrap;gap:6px}.date input{display:block;margin-top:4px;min-height:42px;padding:7px;border:1px solid var(--ln);border-radius:7px;color:var(--tx);background:var(--sf)}.visit{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.visit+.visit{margin-top:10px}[role=status]{min-height:1.5em}@media(max-width:620px){header button{font-size:13px;padding-inline:8px}.hero,.split,.offer-list{grid-template-columns:1fr}.art{min-height:178px;order:-1}}
</style></head><body>
<header><strong>Mola</strong><nav aria-label="Randevu uygulaması"><button data-view="services">Seanslar</button><button data-view="visits">Randevularım</button></nav></header>
<main id="main"></main><footer><p id="status" role="status"></p>Deneme randevuları bu tarayıcıda tutulur.</footer>
<script>
const key="gitmapp-molaseans";
const services=[["Reformer","Küçük grup, 50 dakika",750],["Özel pilates","Bire bir, 50 dakika",1490],["Esneme","Başlangıç grubu, 35 dakika",550]];
const hours=["09:00","10:30","13:00","15:00","17:00"];
const now=new Date();
const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
const formatDate=date=>date.split("-").reverse().join(".");
const today=dateKey(now),money=new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0});
let visits=[];
try{const saved=JSON.parse(localStorage.getItem(key)||"null");if(Array.isArray(saved))visits=saved.filter(r=>services[r.service]&&typeof r.day==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(r.day)&&hours.includes(r.hour))}catch{}
let screen="services",choice=0,day=today,hour="";
const main=document.querySelector("#main"),statusLine=document.querySelector("#status");
const save=()=>{try{localStorage.setItem(key,JSON.stringify(visits))}catch{}};
const booked=(date,time)=>visits.some(r=>r.day===date&&r.hour===time);
function render(){
 document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.view===screen)));
 if(screen==="services"){
  main.innerHTML=`<section class="hero"><div><h1>Kendinize zaman ayırın.</h1><p>Hareket, denge ve esneme seanslarını keşfedin.</p></div><div class="art" role="img" aria-label="Pilates stüdyosu"></div></section><section class="offer-list">${services.map(([name,desc,price],i)=>`<article class="card"><h2>${name}</h2><p>${desc}</p><p>${money.format(price)}</p><button class="primary" data-choice="${i}">Seans seç</button></article>`).join("")}</section>`;
 }else if(screen==="booking"){
  const [name,desc,price]=services[choice];
  main.innerHTML=`<h1>Saat seçin</h1><div class="split"><section class="card"><label class="date">Randevu günü<input id="day" type="date" min="${today}" value="${day}" required></label><div class="slot-list" aria-label="Müsait saatler">${hours.map(t=>`<button data-hour="${t}" aria-pressed="${hour===t}" ${!day||booked(day,t)?"disabled":""}>${t}</button>`).join("")}</div></section><section class="card"><h2>${name}</h2><p>${desc} · ${money.format(price)}</p><p id="summary">${formatDate(day)}${hour?" · "+hour:""}</p><button class="primary" data-confirm ${hour?"":"disabled"}>Randevuyu onayla</button></section></div>`;
 }else if(screen==="done"){
  main.innerHTML=`<section class="card"><h1>Randevu kaydedildi.</h1><p>${services[choice][0]} · ${formatDate(day)} · ${hour}</p><button class="primary" data-view="visits">Randevularıma git</button></section>`;
 }else{
  main.innerHTML=`<h1>Randevularım</h1><div class="card">${visits.length?visits.map((r,i)=>`<article class="visit"><div><h2>${services[r.service][0]}</h2><p>${formatDate(r.day)} · ${r.hour}</p></div><button data-cancel="${i}">İptal et</button></article>`).join(""):'<p>Henüz bir randevunuz yok.</p>'}</div>`;
 }
}
function go(next){screen=next;render();const h=main.querySelector("h1");h.tabIndex=-1;h.focus()}
document.addEventListener("change",e=>{if(e.target.id!=="day")return;day=e.target.validity.valid?e.target.value:"";hour="";render();main.querySelector("#day").focus()});
document.addEventListener("click",e=>{
 const d=e.target.closest("button")?.dataset;if(!d)return;
 if(d.view){go(d.view);return}
 if(d.choice!==undefined){choice=Number(d.choice);hour="";go("booking");return}
 if(d.hour){hour=d.hour;render();main.querySelector('[aria-pressed="true"]').focus();return}
 if(d.confirm!==undefined&&hour&&!booked(day,hour)){visits=[{service:choice,day,hour},...visits].slice(0,50);save();go("done");return}
 if(d.cancel!==undefined){visits=visits.filter((_,i)=>i!==Number(d.cancel));save();go("visits");statusLine.textContent="Randevu iptal edildi."}
});render();
</script></body></html>
