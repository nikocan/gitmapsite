 "@food":()=>`<div style="position:relative;height:480px"><div style="position:absolute;inset:20px 30px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#f3e7d9 60%,#e7d2bb);box-shadow:0 50px 80px -40px rgba(80,40,10,.55),inset 0 0 0 18px rgba(255,255,255,.7);display:grid;place-items:center;font-size:170px">${C.heroEmoji||"🍝"}</div>${[["⭐ 4.9","Google'da 1.280 yorum",0,8],["🛵 30 dk","Ücretsiz teslimat",62,72],["🌿 %100","Günlük taze ürün",64,6]].map(([b,t,x,y])=>`<div style="position:absolute;left:${x}%;top:${y}%;background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(8px);border:1px solid var(--ln);padding:12px 16px;border-radius:18px;box-shadow:0 14px 30px -18px rgba(0,0,0,.45)"><b style="display:block;font-size:18px">${b}</b><span style="font-size:13px;color:var(--tx3)">${t}</span></div>`).join("")}</div>`};
// Bölümler
const S={};
S.nav=()=>`<div class="nav"><div class="nav-in"><a href="#" class="logo"><i>${ic("brand_"+C.id,24)}</i>${esc(C.name)}</a><nav class="links">${C.links.map(([t,h])=>`<a href="${h}">${esc(t)}</a>`).join("")}</nav><a class="btn s" href="${C.cta[1]}">${esc(C.cta[0])}</a></div></div>`;
S.hero=c=>`<section class="hero"><div class="blob"></div><div class="wrap"><div class="hero-g"><div class="reveal"><span class="eyb">${esc(c.eyebrow)}</span><h1 class="big">${c.title}</h1><p class="lead">${esc(c.sub)}</p>
 ${c.search?`<div class="tabs" id="htabs">${c.search.tabs.map((t,i)=>`<button class="${i?"":"on"}" data-ht="${esc(t)}">${esc(t)}</button>`).join("")}</div><form class="sbar" id="hsearch"><div class="f"><label>Konum</label><select name="city"><option value="">Tüm şehirler</option>${[...new Set(C.listings.map(l=>l.city))].map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div class="f"><label>Oda</label><select name="rooms"><option value="">Farketmez</option>${["1+1","2+1","3+1","4+1","5+1"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="f"><label>En fazla</label><input name="max" type="number" placeholder="₺ bütçe"></div><button class="btn">${ic("search",18)} Ara</button></form>`
 :`<div style="display:flex;gap:10px;flex-wrap:wrap">${c.ctas.map((b,i)=>`<a class="btn ${i?"g":""}" href="${b[1]}">${esc(b[0])}${i?"":" "+ic("arrow",17)}</a>`).join("")}</div>`}
 ${c.trust?`<div style="display:flex;gap:14px;align-items:center;margin-top:26px;color:var(--tx2);font-size:14px"><div style="display:flex">${["#f59e0b","#0ea5e9","#ec4899","#22c55e"].map((x,i)=>`<span class="av" style="width:34px;height:34px;font-size:12px;background:${x};margin-left:${i?-10:0}px;border:2px solid var(--bg)">${"AEMK"[i]}</span>`).join("")}</div>${c.trust}</div>`:""}</div>
 <div class="reveal">${ART[c.art]?ART[c.art]():c.art}</div></div>${c.stats?`<div class="stats reveal">${c.stats.map(([b,s])=>`<div><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("")}</div>`:""}</div></section>`;
S.listings=c=>`<section class="s" id="ilanlar"><div class="wrap"><div class="sh reveal"><div><span class="eyb">${esc(c.eyebrow)}</span><h2>${esc(c.title)}</h2></div><p>${esc(c.sub)}</p></div>
 <div class="fbar"><span class="chip on" data-lt="">Tümü</span><span class="chip" data-lt="Satılık">Satılık</span><span class="chip" data-lt="Kiralık">Kiralık</span><span style="flex:1"></span><select id="lsort"><option value="new">En yeni</option><option value="asc">Fiyat (artan)</option><option value="desc">Fiyat (azalan)</option><option value="m2">m² (büyük)</option></select><span class="chip" id="favf">♥ Favoriler</span></div><div class="lgrid" id="lgrid"></div></div></section>`;
S.calc=c=>`<section class="s" id="kredi"><div class="wrap"><div class="ctc"><div class="reveal"><span class="eyb">Kredi hesaplama</span><h2 style="font-size:40px;letter-spacing:-1.2px;line-height:1.08;margin:12px 0">Aylık taksitini<br>saniyeler içinde gör.</h2><p class="lead">Konut kredisi oranlarıyla yaklaşık taksitini hesapla, bütçene uygun ilanları gör.</p></div>
 <div class="form reveal" id="calc"><div class="row2"><label>Konut fiyatı<input name="p" type="number" value="4500000"></label><label>Peşinat<input name="d" type="number" value="1500000"></label></div><div class="row2"><label>Vade (ay)<select name="n">${[60,96,120,180].map(x=>`<option ${x===120?"selected":""}>${x}</option>`).join("")}</select></label><label>Aylık faiz %<input name="r" type="number" step=".01" value="${c.rate||2.79}"></label></div><div class="box"><span style="color:var(--tx3);font-size:13px">Tahmini aylık taksit</span><div id="calcv" style="font-size:36px;font-weight:800;letter-spacing:-1px"></div><span id="calct" style="color:var(--tx2);font-size:14px"></span></div></div></div></div></section>`;
S.bento=c=>`<section class="s" id="${c.id||"neden"}"><div class="wrap"><div class="sh reveal"><div><span class="eyb">${esc(c.eyebrow)}</span><h2>${esc(c.title)}</h2></div><p>${esc(c.sub||"")}</p></div><div class="bento">${c.items.map(b=>`<div class="bx reveal ${b.c||""}"><span class="bi">${b.i}</span><h3>${esc(b.t)}</h3><p>${esc(b.d)}</p>${b.big?`<div class="big">${esc(b.big)}</div>`:""}</div>`).join("")}</div></div></section>`;
S.steps=c=>`<section class="s"><div class="wrap"><div class="sh reveal"><div><span class="eyb">${esc(c.eyebrow)}</span><h2>${esc(c.title)}</h2></div></div><div class="steps">${c.items.map(([t,d])=>`<div class="step reveal"><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join("")}</div></div></section>`;
S.testimonials=c=>`<section class="s"><div class="wrap"><div class="sh reveal"><div><span class="eyb">${esc(c.eyebrow||"Yorumlar")}</span><h2>${esc(c.title)}</h2></div></div><div class="tst">${c.items.map(([q,n,r])=>`<div class="tc reveal"><span class="st">★★★★★</span><q>${esc(q)}</q><div class="who"><span class="av" style="background:hsl(${hue(n)} 60% 50%)">${n.split(" ").map(w=>w[0]).join("")}</span><div><b>${esc(n)}</b><span>${esc(r)}</span></div></div></div>`).join("")}</div></div></section>`;
S.faq=c=>`<section class="s" id="sss"><div class="wrap"><div class="sh reveal"><div><span class="eyb">SSS</span><h2>${esc(c.title||"Sık sorulan sorular")}</h2></div></div><div class="faq">${c.items.map(([q,a],i)=>`<details ${i?"":"open"}><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}</div></div></section>`;
S.cta=c=>`<section class="s"><div class="wrap"><div class="cta reveal"><div><h2>${esc(c.title)}</h2><p>${esc(c.sub)}</p></div><a class="btn w" href="${c.btn[1]}">${esc(c.btn[0])} ${ic("arrow",17)}</a></div></div></section>`;
S.contact=c=>`<section class="s" id="iletisim"><div class="wrap"><div class="ctc"><div class="reveal"><span class="eyb">İletişim</span><h2 style="font-size:40px;letter-spacing:-1.2px;line-height:1.08;margin:12px 0">${esc(c.title)}</h2><p class="lead">${esc(c.sub)}</p><div class="info"><div>${ic("pin")} ${esc(c.address)}</div><div>${ic("phone")} ${esc(c.phone)}</div><div>${ic("mail")} ${esc(c.email)}</div><div>${ic("clock")} ${esc(c.hours)}</div></div>
 <div class="map" style="margin-top:20px;min-height:200px">${mapSvg()}</div></div><form class="form reveal" data-lead="iletisim"><div class="row2"><input name="ad" required placeholder="Ad Soyad"><input name="tel" required placeholder="Telefon"></div><input name="eposta" type="email" placeholder="E-posta">${c.select?`<select name="konu">${c.select.map(x=>`<option>${esc(x)}</option>`).join("")}</select>`:""}<textarea name="mesaj" rows="4" placeholder="Mesajınız"></textarea><label style="display:flex;gap:8px;font-size:13px;color:var(--tx2)"><input type="checkbox" required style="width:auto"> KVKK aydınlatma metnini okudum, iletişime geçilmesini kabul ediyorum.</label><button class="btn">Gönder ${ic("arrow",17)}</button></form></div></div></section>`;
const mapSvg=()=>`<svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" style="position:absolute;inset:0"><rect width="400" height="220" fill="#eef0ea"/>${Array.from({length:9},(_,i)=>`<path d="M${-20+i*55} 0 L${20+i*45} 220" stroke="#fff" stroke-width="${i%3?5:10}"/>`).join("")}${Array.from({length:6},(_,i)=>`<path d="M0 ${i*44} L400 ${10+i*40}" stroke="#fff" stroke-width="${i%2?4:9}"/>`).join("")}<path d="M0 160 Q120 120 220 170 T400 150 V220 H0z" fill="#cfe2f3"/><rect x="40" y="30" width="60" height="40" rx="6" fill="#d7e8cf"/><rect x="270" y="60" width="80" height="50" rx="6" fill="#d7e8cf"/><g transform="translate(200 96)"><circle r="26" fill="var(--pr)" opacity=".18"/><path d="M0 14s-14-12-14-22a14 14 0 0 1 28 0c0 10-14 22-14 22z" fill="var(--pr)"/><circle cy="-8" r="5" fill="#fff"/></g></svg>`;
const insuranceIcons={kasko:"car",trafik:"road-horizon",konut:"home",dask:"wall",saglik:"heart",isyeri:"storefront",seyahat:"airplane"};
S.products=c=>`<section class="s" id="urunler"><div class="wrap"><div class="sh reveal"><div><span class="eyb">${esc(c.eyebrow)}</span><h2>${esc(c.title)}</h2></div><p>${esc(c.sub)}</p></div><div class="bento">${C.products.map((p,i)=>`<div class="bx reveal ${i===0?"w2 br":i===3?"dk":""}" style="cursor:pointer" data-quote="${esc(p.id)}"><span class="bi">${ic(insuranceIcons[p.id],24)}</span><h3>${esc(p.t)}</h3><p>${esc(p.s)}</p><span style="margin-top:auto;font-weight:700;display:flex;align-items:center;gap:6px">Teklif al ${ic("arrow",16)}</span></div>`).join("")}</div></div></section>`;
S.quote=c=>`<section class="s" id="teklif"><div class="wrap"><div class="sh reveal" style="justify-content:center;text-align:center"><div><span class="eyb">2 dakikada teklif</span><h2>${esc(c.title)}</h2></div></div><div class="wz reveal" id="wz"></div></div></section>`;
S.menu=c=>`<section class="s" id="menu"><div class="wrap"><div class="sh reveal"><div><span class="eyb">${esc(c.eyebrow)}</span><h2>${esc(c.title)}</h2></div><p>${esc(c.sub)}</p></div><div class="mtabs">${C.menu.map((m,i)=>`<span class="chip ${i?"":"on"}" data-mc="${i}">${esc(m.c)}</span>`).join("")}</div><div class="mgrid" id="mgrid"></div></div></section>`;
S.reserve=c=>`<section class="s" id="rezervasyon"><div class="wrap"><div class="ctc"><div class="reveal"><span class="eyb">Rezervasyon</span><h2 style="font-size:40px;letter-spacing:-1.2px;line-height:1.08;margin:12px 0">${esc(c.title)}</h2><p class="lead">${esc(c.sub)}</p></div><form class="form reveal" data-lead="rezervasyon"><div class="row2"><input name="ad" required placeholder="Ad Soyad"><input name="tel" required placeholder="Telefon"></div><div class="row2"><input name="tarih" type="date" required><select name="saat">${["12:00","13:00","19:00","19:30","20:00","20:30","21:00","21:30"].map(x=>`<option>${x}</option>`).join("")}</select></div><select name="kisi">${[1,2,3,4,5,6,8,10].map(x=>`<option ${x===2?"selected":""}>${x} kişi</option>`).join("")}</select><textarea name="not" rows="3" placeholder="Özel istek (doğum günü, cam kenarı…)"></textarea><button class="btn">Masayı ayırt ${ic("arrow",17)}</button></form></div></div></section>`;
S.logos=c=>`<section style="padding:20px 0 10px"><div class="wrap" style="display:flex;gap:40px;flex-wrap:wrap;align-items:center;justify-content:center;color:var(--tx3);font-weight:800;font-size:20px;letter-spacing:-.5px;opacity:.8">${c.items.map(x=>`<span>${esc(x)}</span>`).join("")}</div></section>`;
S.footer=()=>`<footer class="ft"><div class="wrap"><div class="ftg"><div><a href="#" class="logo" style="color:var(--tx)"><i>${ic("brand_"+C.id,24)}</i>${esc(C.name)}</a><p style="max-width:320px">${esc(C.footer)}</p></div>${C.foot.map(([h,ls])=>`<div><b>${esc(h)}</b>${ls.map(l=>`<a href="#">${esc(l)}</a>`).join("")}</div>`).join("")}</div><div style="margin-top:30px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><span>© ${new Date().getFullYear()} ${esc(C.name)}. Tüm hakları saklıdır.</span><span>Gitmapp ile yapıldı</span></div></div></footer>`;
document.body.innerHTML=S.nav()+C.sections.map(s=>S[s.type](s)).join("")+S.footer();
// Etkileşimler
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");obs.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(x=>obs.observe(x));
document.addEventListener("submit",e=>{const f=e.target.closest("[data-lead]");if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(f));const l=LS.get("talepler",[]);l.unshift({...d,tur:f.dataset.lead,t:new Date().toISOString()});LS.set("talepler",l);f.reset();toast(f.dataset.lead==="rezervasyon"?"Rezervasyon talebiniz alındı, SMS ile onaylanacak.":"Mesajınız alındı, en kısa sürede dönüş yapacağız.")});
// Emlak
if(C.listings){let F={type:"",city:"",rooms:"",max:0,sort:"new",fav:false};let fav=LS.get("fav",[]);
 const card=(l,i)=>`<div class="lcard" data-l="${i}"><div class="lim">${house(l.title,i,l.kind)}<span class="tag">${esc(l.type)}</span>${l.badge?`<span class="tag pr">${esc(l.badge)}</span>`:""}<button class="fav ${fav.includes(i)?"on":""}" data-fav="${i}" aria-label="Favori">${ic("heart",17)}</button></div><div class="lb"><div class="pr">${money(l.price)}${l.type==="Kiralık"?" <small>/ ay</small>":""}</div><h3>${esc(l.title)}</h3><div class="loc">${ic("pin",14)} ${esc(l.district)}, ${esc(l.city)}</div><div class="specs"><span>${ic("bed",16)} ${esc(l.rooms)}</span><span>${ic("area",16)} ${l.m2} m²</span><span>${ic("floor",16)} ${esc(l.floor)}</span></div></div></div>`;
 const draw=()=>{let ls=C.listings.map((l,i)=>[l,i]).filter(([l,i])=>(!F.type||l.type===F.type)&&(!F.city||l.city===F.city)&&(!F.rooms||l.rooms===F.rooms)&&(!F.max||l.price<=F.max)&&(!F.fav||fav.includes(i)));
  ls.sort((a,b)=>F.sort==="asc"?a[0].price-b[0].price:F.sort==="desc"?b[0].price-a[0].price:F.sort==="m2"?b[0].m2-a[0].m2:a[1]-b[1]);$("#lgrid").innerHTML=ls.map(([l,i])=>card(l,i)).join("")||`<p style="color:var(--tx3);grid-column:1/-1;text-align:center;padding:40px">Bu kriterlere uygun ilan bulunamadı.</p>`};draw();
 document.addEventListener("click",e=>{const t=e.target.closest("[data-lt],[data-fav],[data-l],#favf,[data-ht]");if(!t)return;
  if(t.dataset.ht!==undefined){document.querySelectorAll("#htabs button").forEach(b=>b.classList.toggle("on",b===t));F.type=t.dataset.ht==="Satılık"||t.dataset.ht==="Kiralık"?t.dataset.ht:"";return}
  if(t.dataset.lt!==undefined){F.type=t.dataset.lt;document.querySelectorAll("[data-lt]").forEach(c=>c.classList.toggle("on",c===t));draw()}
  else if(t.dataset.fav){e.stopPropagation();const i=+t.dataset.fav;fav=fav.includes(i)?fav.filter(x=>x!==i):[...fav,i];LS.set("fav",fav);draw();toast(fav.includes(i)?"Favorilere eklendi":"Favorilerden çıkarıldı")}
  else if(t.id==="favf"){F.fav=!F.fav;t.classList.toggle("on",F.fav);draw()}
  else if(t.dataset.l)openL(+t.dataset.l)});
 $("#lsort").onchange=e=>{F.sort=e.target.value;draw()};
 const hs=$("#hsearch");if(hs)hs.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(hs));F.city=d.city;F.rooms=d.rooms;F.max=+d.max||0;draw();document.getElementById("ilanlar").scrollIntoView({behavior:"smooth"})};
 const openL=i=>{const l=C.listings[i];const m=document.createElement("div");m.className="md-bg";m.innerHTML=`<div class="md"><button class="md-x">✕</button><div class="gal"><div style="aspect-ratio:4/3">${house(l.title,i,l.kind)}</div><div class="side"><div>${house(l.title+"a",i+20,l.kind)}</div><div>${house(l.title+"b",i+40,l.kind)}</div></div></div>
  <div class="mdb"><div><span class="eyb">${esc(l.type)} · ${esc(l.kind)}</span><h2 style="font-size:30px;letter-spacing:-.8px;margin:10px 0 4px">${esc(l.title)}</h2><div class="loc" style="color:var(--tx3);display:flex;gap:6px;align-items:center">${ic("pin",15)} ${esc(l.district)}, ${esc(l.city)} · İlan no ${1000+i*37}</div><div class="specs" style="font-size:15px"><span>${ic("bed")} ${esc(l.rooms)}</span><span>${ic("area")} ${l.m2} m² net</span><span>${ic("floor")} ${esc(l.floor)}</span><span>🏗️ ${esc(l.age)} yaşında</span></div><p style="color:var(--tx2)">${esc(l.desc)}</p><b>Özellikler</b><div class="feat">${l.feat.map(f=>`<span>${esc(f)}</span>`).join("")}</div></div>
  <div><div class="box"><div style="font-size:30px;font-weight:800;letter-spacing:-1px">${money(l.price)}${l.type==="Kiralık"?" <small style='font-size:14px;color:var(--tx3)'>/ ay</small>":""}</div>${l.type==="Satılık"?`<div style="color:var(--tx2);font-size:14px">m² fiyatı ${money(l.price/l.m2)}</div>`:""}<div class="who" style="margin:16px 0"><span class="av" style="background:var(--pr)">${C.agent.split(" ").map(w=>w[0]).join("")}</span><div><b>${esc(C.agent)}</b><span>Gayrimenkul danışmanı</span></div></div>
  <form class="form" data-lead="ilan" style="padding:0;border:0;background:none"><input type="hidden" name="ilan" value="${esc(l.title)}"><input name="ad" required placeholder="Ad Soyad"><input name="tel" required placeholder="Telefon"><textarea name="mesaj" rows="2">Merhaba, “${esc(l.title)}” ilanı hakkında bilgi almak istiyorum.</textarea><button class="btn">Danışmana sor</button><a class="btn g" href="https://wa.me/?text=${encodeURIComponent(l.title+" ilanı hakkında bilgi almak istiyorum")}" target="_blank" rel="noopener">WhatsApp ile yaz</a></form></div></div></div></div>`;
  document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.closest(".md-x"))m.remove()};m.querySelector("form").addEventListener("submit",()=>setTimeout(()=>m.remove(),300))};
}
const calc=$("#calc");if(calc){const f=()=>{const d=Object.fromEntries([...calc.querySelectorAll("input,select")].map(x=>[x.name,+x.value]));const P=Math.max(0,d.p-d.d),r=d.r/100,n=d.n;const m=r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n;$("#calcv").textContent=money(m);$("#calct").textContent=`Kredi tutarı ${money(P)} · Toplam geri ödeme ${money(m*n)}`};calc.oninput=f;f()}
// Sigorta teklif sihirbazı
if(C.quote){const Q={step:0,p:null,d:{}};const P=C.products;const steps=["Ürün","Bilgiler","İletişim","Teklifler"];
 const fields={kasko:[["plaka","Plaka","34 ABC 123"],["model","Marka / model","Toyota Corolla 2022"],["yil","Model yılı","2022"]],trafik:[["plaka","Plaka","34 ABC 123"],["ruhsat","Ruhsat seri no","AB 123456"]],konut:[["adres","Konut adresi","Kadıköy, İstanbul"],["m2","Brüt m²","120"],["yil","Bina yılı","2008"]],dask:[["adres","Konut adresi","Çankaya, Ankara"],["m2","Brüt m²","95"]],saglik:[["dogum","Doğum yılı","1988"],["kisi","Sigortalanacak kişi sayısı","1"]],isyeri:[["faaliyet","Faaliyet alanı","Kafe"],["deger","Tahmini demirbaş değeri (₺)","400000"]],seyahat:[["ulke","Gideceğiniz ülke","Almanya"],["gun","Kaç gün","10"]]};
 const draw=()=>{const w=$("#wz");const pr=P.find(x=>x.id===Q.p);let h=`<div class="wzs">${steps.map((s,i)=>`<i class="${i<=Q.step?"on":""}"></i>`).join("")}</div><div style="color:var(--tx3);font-size:13px;font-weight:700">ADIM ${Q.step+1}/4 · ${steps[Q.step].toUpperCase()}</div>`;
  if(Q.step===0)h+=`<h3 style="font-size:24px;margin:6px 0 16px">Hangi sigortayı arıyorsun?</h3><div class="opts">${P.map(p=>`<button class="opt ${Q.p===p.id?"on":""}" data-qp="${p.id}"><span class="e">${ic(insuranceIcons[p.id],24)}</span><b>${esc(p.t)}</b><small>${esc(p.s||"")}</small></button>`).join("")}</div>`;
  if(Q.step===1)h+=`<h3 style="font-size:24px;margin:6px 0 16px">${esc(pr.t)} için birkaç bilgi</h3><form class="form" id="qf" style="padding:0;border:0">${(fields[Q.p]||[]).map(([k,l,ph])=>`<label style="font-size:13px;font-weight:600;color:var(--tx2)">${esc(l)}<input name="${k}" required placeholder="${esc(ph)}" value="${esc(Q.d[k]||"")}"></label>`).join("")}</form>`;
  if(Q.step===2)h+=`<h3 style="font-size:24px;margin:6px 0 16px">Teklifleri nereye gönderelim?</h3><form class="form" id="qf" style="padding:0;border:0"><div class="row2"><input name="ad" required placeholder="Ad Soyad" value="${esc(Q.d.ad||"")}"><input name="tel" required placeholder="Telefon" value="${esc(Q.d.tel||"")}"></div><input name="tc" placeholder="T.C. kimlik no (isteğe bağlı)" maxlength="11"><label style="display:flex;gap:8px;font-size:13px;color:var(--tx2)"><input type="checkbox" required style="width:auto"> KVKK kapsamında bilgilerimin teklif için işlenmesini kabul ediyorum.</label></form>`;
  if(Q.step===3){const base=pr.base;const cs=C.companies.map((c,i)=>({c,v:Math.round(base*(0.86+((hue(c+Q.p+(Q.d.tel||""))%30)/100)))})).sort((a,b)=>a.v-b.v);
   h+=`<h3 style="font-size:24px;margin:6px 0 4px">${esc(pr.t)} teklifleri hazır</h3><p style="color:var(--tx2);margin:0 0 16px">${cs.length} şirketten anında fiyat aldık. Uzmanımız en uygun teminatı seçmen için seni arayacak.</p>${cs.map((o,i)=>`<div class="offer ${i?"":"best"}"><span class="av" style="background:hsl(${hue(o.c)} 55% 45%);border-radius:14px">${o.c[0]}</span><div><b>${esc(o.c)}</b><div style="color:var(--tx3);font-size:13px">${i===0?"⭐ En uygun fiyat · ":""}12 ay · taksit imkânı</div></div><div class="p"><b>${money(o.v)}</b><button class="btn s ${i?"g":""}" data-pick="${esc(o.c)}">Bu teklifi seç</button></div></div>`).join("")}`}
  h+=`<div style="display:flex;justify-content:space-between;margin-top:20px">${Q.step?`<button class="btn g" data-qb>‹ Geri</button>`:"<span></span>"}${Q.step<3?`<button class="btn" data-qn ${Q.step===0&&!Q.p?"disabled style='opacity:.5'":""}>${Q.step===2?"Teklifleri getir":"Devam"} ${ic("arrow",17)}</button>`:""}</div>`;w.innerHTML=h};draw();
 document.addEventListener("click",e=>{const t=e.target.closest("[data-qp],[data-qn],[data-qb],[data-pick],[data-quote]");if(!t)return;
  if(t.dataset.quote){Q.p=t.dataset.quote;Q.step=1;draw();document.getElementById("teklif").scrollIntoView({behavior:"smooth"});return}
  if(t.dataset.qp){Q.p=t.dataset.qp;draw()}else if(t.dataset.qb!==undefined){Q.step--;draw()}
  else if(t.dataset.qn!==undefined){const f=$("#qf");if(f){if(!f.reportValidity())return;Object.assign(Q.d,Object.fromEntries(new FormData(f)))}if(Q.step===0&&!Q.p)return;Q.step++;draw()}
  else if(t.dataset.pick){const l=LS.get("talepler",[]);l.unshift({tur:"teklif",urun:Q.p,sirket:t.dataset.pick,...Q.d,t:new Date().toISOString()});LS.set("talepler",l);toast(t.dataset.pick+" teklifi için talebin alındı. Uzmanımız seni arayacak.");Q.step=0;Q.p=null;Q.d={};draw()}});
}
// Restoran menüsü ve sepet
if(C.menu){let cat=0,cart=LS.get("cart",{});const all=C.menu.flatMap(m=>m.items);
 const draw=()=>{$("#mgrid").innerHTML=C.menu[cat].items.map(it=>`<div class="mi reveal in">${plate(it.e,it.c)}<div style="flex:1"><h3>${esc(it.n)}${it.tag?` <span class="eyb" style="font-size:10.5px;padding:3px 8px;vertical-align:middle">${esc(it.tag)}</span>`:""}</h3><p>${esc(it.d)}</p><div class="r"><b>${money(it.p)}</b><button class="add" data-add="${esc(it.n)}" aria-label="Sepete ekle">+</button></div></div></div>`).join("");cb()};
 const total=()=>Object.entries(cart).reduce((s,[n,q])=>s+(all.find(x=>x.n===n)||{p:0}).p*q,0);const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
 const btn=document.createElement("button");btn.className="cartbtn";document.body.appendChild(btn);
 const cb=()=>{btn.style.display=count()?"flex":"none";btn.innerHTML=`🛍️ Sepet <b>${count()}</b> ${money(total())}`;LS.set("cart",cart)};
 const openCart=()=>{const d=document.createElement("div");d.innerHTML=`<div class="md-bg" style="justify-content:flex-end;padding:0"></div><aside class="drw"><header><b style="font-size:18px">Siparişin</b><button class="btn g s" data-cx>Kapat</button></header><div class="b">${Object.entries(cart).map(([n,q])=>{const it=all.find(x=>x.n===n);return `<div class="ci">${it.e} <div><b>${esc(n)}</b><div style="color:var(--tx3);font-size:13px">${money(it.p)}</div></div><div class="q"><button data-dec="${esc(n)}">−</button>${q}<button data-add="${esc(n)}">+</button></div></div>`}).join("")||"<p>Sepetin boş.</p>"}</div><footer><div style="display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-bottom:12px"><span>Toplam</span><span>${money(total())}</span></div><a class="btn" style="width:100%" target="_blank" rel="noopener" href="https://wa.me/${C.whatsapp}?text=${encodeURIComponent("Merhaba, sipariş vermek istiyorum:\n"+Object.entries(cart).map(([n,q])=>q+" x "+n).join("\n")+"\nToplam: "+money(total()))}">WhatsApp ile sipariş ver</a></footer></aside>`;document.body.appendChild(d);d.onclick=e=>{if(e.target.classList.contains("md-bg")||e.target.closest("[data-cx]"))d.remove();else if(e.target.closest("[data-add],[data-dec]"))setTimeout(()=>{d.remove();if(count())openCart()},0)}};
 btn.onclick=openCart;document.addEventListener("click",e=>{const t=e.target.closest("[data-mc],[data-add],[data-dec]");if(!t)return;if(t.dataset.mc){cat=+t.dataset.mc;document.querySelectorAll("[data-mc]").forEach(c=>c.classList.toggle("on",c===t));draw()}else if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;cb();if(!t.closest(".drw"))toast(t.dataset.add+" sepete eklendi")}else if(t.dataset.dec){const n=t.dataset.dec;cart[n]=(cart[n]||0)-1;if(cart[n]<=0)delete cart[n];cb()}});draw()}
window.__house=house;
