<style>
:root{--pr:#16504e;--bg:#f6f5f0;--tx:#20251f;--panel:white;font-family:system-ui,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1120px;margin:auto;padding:20px clamp(16px,4vw,48px)}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #bdbeb6;font-weight:700}
a{color:var(--pr);padding:10px 0}h1{font-size:clamp(38px,6vw,78px);line-height:1.02;letter-spacing:-.045em;margin:16px 0}h2{font-size:22px;margin:0 0 20px}
.hero{padding:30px 0}.hero p{max-width:64ch;line-height:1.6}.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px}
article,form,.history{background:var(--panel);padding:clamp(16px,3vw,32px);border:1px solid #c3c6bc;border-radius:14px;min-width:0}
label{display:grid;gap:5px;font-weight:600;font-size:14px;margin:0 0 14px}
input,select,textarea,button{font:inherit;min-height:44px;width:100%;min-width:0;border:1px solid #767a70;border-radius:6px;padding:9px;background:white;color:#20251f}
textarea{resize:vertical}button{font-weight:650;background:var(--pr);color:white;border:0;cursor:pointer}
:focus-visible{outline:3px solid #145ac5;outline-offset:3px}
.history{margin-top:24px}.history ul{padding-left:22px}.history li{padding:8px 0;white-space:pre-line;overflow-wrap:anywhere}.history img{display:block;max-height:100px;max-width:100%;margin-top:6px}footer{font-size:13px}
@media(max-width:680px){.grid{grid-template-columns:minmax(0,1fr)}header,main,footer{padding:15px}.hero{padding:16px 0}.grid{gap:16px}}
#homes p{padding:15px;border-left:4px solid var(--pr);background:#eaf1ec}.hero p{font-size:18px}</style></head>
<body><header><strong>Sokak Rehberi</strong><a href="#task">Ziyaret iste</a></header><main>
<div class="hero"><h1>Mahallende bir ev</h1><p>Bütçenize göre ilanları süzün ve seçtiğiniz daire için ziyaret saati isteyin.</p></div><div class="grid"><article><h2>Kiralık daireler</h2><label>Bütçe sınırı<select id="budget"><option value="100000">Tüm ilanlar</option><option value="32000">32.000 ₺ ve altı</option><option value="20000">20.000 ₺ ve altı</option></select></label><div id="homes"></div></article>
<form id="task"><h2>Ziyaret iste</h2><label>İlan<select name="home" required><option value="">Seçin</option></select></label><label>Ziyaretçi<input name="guest" type="text" required ></label><label>Ziyaret tarihi<input name="visit" type="datetime-local" required ></label><button type="submit">Ziyaret iste</button></form></div>
<section class="history"><h2>Ziyaret talepleri</h2><p id="empty">Henüz kayıt yok.</p><ul id="records"></ul><p role="status" id="status"></p></section>
</main><footer>Bu cihazdaki örnek çalışma alanı</footer>
<script>
const form=document.querySelector("form"),list=document.querySelector("#records"),statusLine=document.querySelector("#status");
const key="gitmapp-ziyaret";let rows=[];
try{rows=JSON.parse(localStorage.getItem(key)||"[]")}catch{}
/* gitmapp-task-records */
function render(){
 list.replaceChildren();document.querySelector("#empty").hidden=rows.length>0;
 for(const row of rows){
  const item=document.createElement("li");item.textContent=row.text;
  if(row.photo){const image=new Image();image.src=row.photo;image.alt="İş emri fotoğrafı";item.append(image)}
  list.append(item);
 }
}

const homes=[["Çınar Sokak · 2+1",29000],["İskele Cadde · 3+1",38000],["Park Yolu · 1+1",25000]],budget=document.querySelector("#budget");
function filter(){const options=homes.filter(([,p])=>p<=Number(budget.value));const panel=document.querySelector("#homes");panel.replaceChildren();form.home.replaceChildren(new Option("Seçin",""));for(const [name,price] of options){const p=document.createElement("p");p.textContent=name+" · "+price.toLocaleString("tr-TR")+" ₺";panel.append(p);form.home.add(new Option(name,name))}if(!options.length)panel.textContent="Bu bütçeye uygun ilan yok."}budget.onchange=filter;filter();
form.addEventListener("submit",async event=>{
 event.preventDefault();const data=new FormData(form);
 const entries=[...form.querySelectorAll("[name]")].filter(el=>el.type!=="file").map(el=>el.closest("label").firstChild.textContent.trim()+" · "+String(data.get(el.name)).trim());
 const row={text:entries.join("\n")};const file=data.get("photo");
 if(file?.size){
  if(file.size>350000||!["image/png","image/jpeg","image/webp"].includes(file.type)){statusLine.textContent="350 KB altında PNG, JPEG veya WebP seçin.";return}
  try{row.photo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}catch{statusLine.textContent="Fotoğraf okunamadı.";return}
 }
 rows.unshift(row);render();form.reset();
 try{localStorage.setItem(key,JSON.stringify(rows));form.dispatchEvent(new Event("gitmapp-save"));statusLine.textContent="Kaydedildi."}
 catch{statusLine.textContent="Bu önizlemede kayıt oluşturuldu. Cihaz depolaması kullanılamıyor."}
});render();
</script></body></html>
