<style>
:root{--pr:#284937;--paper:#ecf0e8;--ink:#202421;color:var(--ink);background:var(--paper);font:16px/1.55 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1180px;margin:auto;padding:18px clamp(16px,4vw,52px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #92978e}
header b{letter-spacing:-.03em;font-size:19px}header a{color:var(--pr);font-weight:650;min-height:44px;display:inline-flex;align-items:center}
h1,h2,h3,p{margin:0}h1{font-size:clamp(38px,5.8vw,77px);line-height:1.04;letter-spacing:-.055em;max-width:19ch}
h2{font-size:22px;line-height:1.2;letter-spacing:-.03em;margin-bottom:18px}.lead{max-width:62ch;margin-top:12px;color:#39443d}
.hero{padding:clamp(18px,4vw,50px) 0}.work{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
.surface,form,.history{min-width:0;background:#fff;padding:clamp(16px,3vw,30px);border:1px solid #a3aaa1;border-radius:12px}
.history{margin-top:22px}.history ul{padding:0;list-style:none;margin:0}.history li{border-top:1px solid #c0c6bf;padding:12px 0;white-space:pre-line;overflow-wrap:anywhere}
label{display:grid;gap:4px;font-weight:600;margin-bottom:12px}
input,select,button,textarea{font:inherit;min-height:44px;min-width:0;width:100%;padding:8px 10px;border:1px solid #71796f;border-radius:5px;background:white;color:#171e19}
button{background:var(--pr);color:#fff;font-weight:650;cursor:pointer;border:0}button:disabled{background:#515a55}
:focus-visible{outline:3px solid #005bc2;outline-offset:3px}.item{display:flex;justify-content:space-between;gap:15px;border-top:1px solid #bfc5be;padding:14px 0;align-items:center}
.item span{font-size:14px}.readout{margin-top:16px;padding-top:12px;border-top:2px solid var(--pr)}output{display:block;font-weight:720;font-size:26px;overflow-wrap:anywhere}
.pill{display:inline-block;font-weight:bold;margin-right:12px}.check{display:flex;align-items:center;gap:12px}.check input{min-height:22px;width:22px;height:22px}.check{min-height:44px}
small,footer{color:#454d46}#status{margin-top:8px}.history button,.surface button{width:auto;min-width:44px;margin:6px 0}fieldset{border:0;margin:0;padding:0}legend{font-weight:700;margin-bottom:6px}
.surface{background:#21352f;color:white}.readout{border-color:#9fb7ac}.surface output{font-family:monospace;font-size:32px}
@media(max-width:700px){.work{grid-template-columns:minmax(0,1fr)}header,main,footer{padding:13px 16px}.work{gap:15px}.hero{padding:22px 0}.surface,form,.history{padding:16px}.history{margin-top:15px}}
header,main,footer{max-width:1100px}.work{grid-template-columns:1fr}.surface{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px;border-radius:2px}.surface h2{grid-column:1/-1}.surface .readout{margin:0}.surface output{font-variant-numeric:tabular-nums;font-size:clamp(19px,3vw,38px)}#task,.history{border-radius:2px}
@media(min-width:701px){#task{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 16px}#task h2,#task button{grid-column:1/-1}.hero h1{max-width:none}.history li{font-family:ui-monospace,monospace}}
</style></head><body>
<header><b>Bakım Sayacı</b><a href="#task">Bakımı izle</a></header><main><div class="hero"><h1>Periyodik bakım</h1><p class="lead">Son bakım kilometresini ve bakım aralığını girin. Yaklaşan veya geciken bakımı hesaplayın.</p></div>
<div class="work"><section class="surface"><h2>Kilometre göstergesi</h2><div class="readout"><span>Sıradaki bakım</span><output id="due">—</output></div><div class="readout"><span>Güncel durum</span><output id="distance">—</output></div></section><form id="task"><h2>Bakımı izle</h2><label>Araç veya ekipman<input type="text" name="name" required ></label><label>Son bakım (km)<input type="number" name="last" required min="0"></label><label>Güncel sayaç (km)<input type="number" name="now" required min="0"></label><label>Bakım aralığı<select name="interval" required><option value="">Seçin</option><option value="5000">5.000 km</option><option value="10000">10.000 km</option></select></label><button type="submit">Bakımı izle</button></form></div>
<section class="history"><h2>Takip listesi</h2><p id="empty">Henüz kayıt yok.</p><ul id="records"></ul></section><p role="status" id="status"></p></main><footer>Örnek veriler bu cihazda saklanır.</footer>
<script>
const form=document.querySelector("form");
const key="gitmapp-bakim";
const list=document.querySelector("#records"),statusLine=document.querySelector("#status");
let rows=[];
try{rows=JSON.parse(localStorage.getItem(key)||"[]")}catch{}
/* gitmapp-task-records */
const amount=n=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY"}).format(n);
const values=()=>Object.fromEntries(new FormData(form));
const show=(id,text)=>document.getElementById(id).textContent=text;
function persist(){
 render();form.dispatchEvent(new Event("gitmapp-save"));
 try{localStorage.setItem(key,JSON.stringify(rows));statusLine.textContent="Kaydedildi."}
 catch{statusLine.textContent="Kayıt bu oturumda tutuluyor. Cihaz depolaması dolu veya kapalı."}
}
function report(v){const next=Number(v.last)+Number(v.interval),remaining=next-Number(v.now);return {next,label:remaining<0?(-remaining)+" km gecikti":remaining===0?"Bakım zamanı":remaining+" km kaldı"}}
function update(){const v=values(),ready=v.last!==""&&v.now!==""&&v.interval;show("due",ready?report(v).next+" km":"—");show("distance",ready?report(v).label:"Sayaçları girin")}
function makeRecord(v){if(Number(v.now)<Number(v.last)){form.now.setCustomValidity("Güncel sayaç son bakımdan küçük olamaz.");form.reportValidity();return}return {text:v.name+" · Sonraki bakım "+report(v).next+" km · "+report(v).label}}
function render(){
 list.replaceChildren();document.querySelector("#empty").hidden=rows.length>0;
 for(const row of rows){
  const li=document.createElement("li");li.textContent=row.text;
  list.append(li);
 }
 update();
}
form.addEventListener("input",()=>{for(const el of form.elements)el.setCustomValidity?.("");update()});
form.addEventListener("submit",event=>{
 event.preventDefault();const row=makeRecord(values());if(!row)return;
 rows.unshift(row);form.reset();persist();
});
render();
</script></body></html>
