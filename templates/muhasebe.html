 <table><thead><tr><th>Açıklama</th><th class="num">Miktar</th><th class="num">Birim fiyat</th><th class="num">Tutar</th></tr></thead><tbody><tr><td>${esc(r[L.desc])}</td><td class="num">${r[L.qty]||1}</td><td class="num">${money((+r[L.amount]||0)/(+r[L.qty]||1))}</td><td class="num">${money(r[L.amount])}</td></tr></tbody></table>
 <div class="tot"><div><span>Ara toplam</span><b>${money(r[L.amount])}</b></div><div><span>KDV (%${r[L.vat]||0})</span><b>${money((+r[L.amount]||0)*(+r[L.vat]||0)/100)}</b></div><div class="g"><span>Genel toplam</span><span>${money(r[L.total])}</span></div></div>
 <p style="color:#888;margin-top:30px;font-size:12px">${esc(C.docNote||"Ödemenizi vade tarihine kadar IBAN hesabımıza yapabilirsiniz. Teşekkür ederiz.")}</p></div>`;
 pg.querySelector("[data-back]").onclick=()=>render()}
function render(){const n=C.nav.find(x=>x.id===S.view)||C.nav[0];$("#ttl").textContent=n.label;
 const al=C.dashboard.alerts?rows(C.dashboard.alerts.e).filter(r=>where(r,C.dashboard.alerts.w)).length:0;$("#bell").innerHTML=ic("bell",18)+(al?'<span class="dot"></span>':"");
 document.querySelectorAll(".nv,.mb button").forEach(b=>b.classList.toggle("on",b.dataset.v===n.id));
 $("#pg").innerHTML=n.type==="dashboard"?dash():n.type==="kanban"?kanban(n):n.type==="agenda"?agenda(n):n.type==="settings"?settings():table(n)}
// Kabuk
document.body.innerHTML=`<div class="app"><aside class="sb"><div class="brand"><i>${ic("brand_"+C.id,24)}</i><div>${esc(C.name)}<small>${esc(C.tagline||"")}</small></div></div>${C.nav.map(n=>(n.h?`<div class="sbh">${esc(n.h)}</div>`:"")+`<button class="nv" data-v="${n.id}">${ic(n.icon,18)}${esc(n.label)}${n.e&&n.type!=="settings"?`<b>${(DB[n.e]||[]).length}</b>`:""}</button>`).join("")}<div class="sbf"><span class="av">${ini(C.user.name)}</span><div><b>${esc(C.user.name)}</b><span>${esc(C.user.role)}</span></div></div></aside>
<div class="main"><header class="tb"><h1 id="ttl"></h1><label class="srch">${ic("search",16)}<input id="q" placeholder="Ara…"></label><button class="ib" id="th" title="Tema">${ic("moon",17)}</button><button class="ib" id="bell" title="Uyarılar"></button></header><div class="pg" id="pg"></div></div>
<nav class="mb">${C.nav.slice(0,5).map(n=>`<button data-v="${n.id}">${ic(n.icon,20)}${esc(n.short||n.label.split(" ")[0])}</button>`).join("")}</nav></div>`;
document.addEventListener("click",e=>{const t=e.target.closest("[data-v],[data-open],[data-new],[data-sort],[data-f],[data-pg],[data-go],[data-csv],[data-theme],[data-reset],[data-json]");if(!t)return;const d=t.dataset;
 if(d.v){S.view=d.v;S.q="";$("#q").value="";S.page=0;render();scrollTo(0,0)}else if(d.go!==undefined){e.preventDefault();const n=C.nav.find(x=>x.e===d.go);if(n){S.view=n.id;render()}}
 else if(d.open){const [k,id]=d.open.split(":");drawer(k,id)}else if(d.new)drawer(d.new);
 else if(d.sort){const k=C.nav.find(x=>x.id===S.view).e;const c=S.sort[k];S.sort[k]={k:d.sort,d:c&&c.k===d.sort?-c.d:1};render();document.querySelector('button[data-sort="'+CSS.escape(d.sort)+'"]')?.focus({preventScroll:true})}
 else if(d.f!==undefined){const k=C.nav.find(x=>x.id===S.view).e;S.filter[k]=d.f||null;S.page=0;render()}else if(d.pg){S.page+=+d.pg;render()}
 else if(d.csv){const E=ent(d.csv);const head=E.fields.map(f=>f.l);const lines=[head,...rows(d.csv).map(r=>E.fields.map(f=>f.t==="ref"?refName(f,r[f.k]):r[f.k]))].map(l=>l.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";"));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+lines.join("\n")],{type:"text/csv"}));a.download=d.csv+".csv";a.click()}
 else if(d.theme!==undefined)$("#th").click();else if(d.reset!==undefined){if(confirm("Tüm değişiklikler silinip demo verisine dönülsün mü?")){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}}
 else if(d.json!==undefined){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}));a.download=C.id+"-yedek.json";a.click()}});
$("#q").oninput=e=>{S.q=e.target.value;S.page=0;const n=C.nav.find(x=>x.id===S.view);if(n.type==="dashboard"){const f=C.nav.find(x=>x.type==="table");if(f){S.view=f.id}}render();$("#q").focus()};
$("#th").onclick=()=>{S.theme=S.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=S.theme;try{localStorage.setItem(KEY+"_th",S.theme)}catch(e){}render()};
$("#bell").onclick=()=>{S.view=C.nav[0].id;render()};
let drag=null;document.addEventListener("dragstart",e=>{const c=e.target.closest(".kcard");if(c){drag=c.dataset.id;e.dataTransfer.effectAllowed="move"}});
document.addEventListener("dragover",e=>{const c=e.target.closest(".kc");if(c&&drag){e.preventDefault();document.querySelectorAll(".kc").forEach(x=>x.classList.toggle("ov",x===c))}});
document.addEventListener("drop",e=>{const c=e.target.closest(".kc");if(c&&drag){e.preventDefault();const n=C.nav.find(x=>x.id===S.view);const r=DB[n.e].find(x=>x.id===drag);if(r){r[n.by]=c.dataset.col;save();toast("“"+c.dataset.col+"” aşamasına taşındı")}drag=null;render()}});
document.addEventListener("dragend",()=>{drag=null;document.querySelectorAll(".kc").forEach(x=>x.classList.remove("ov"))});
render();
})();
</script></body></html>
