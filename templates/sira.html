<style>
:root{--pr:#6e3551;--paper:#f8f0f4;--ink:#202421;color:var(--ink);background:var(--paper);font:16px/1.55 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1180px;margin:auto;padding:18px clamp(16px,4vw,52px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #92978e}
header b{letter-spacing:-.03em;font-size:19px}header a{color:var(--pr);font-weight:650;min-height:44px;display:inline-flex;align-items:center}
h1,h2,h3,p{margin:0}h1{font-size:clamp(38px,5.8vw,77px);line-height:1.04;letter-spacing:-.055em;max-width:19ch}
h2{font-size:22px;line-height:1.2;letter-spacing:-.03em;margin-bottom:18px}.lead{max-width:62ch;margin-top:12px;color:#39443d}
.hero{padding:clamp(18px,4vw,50px) 0}.work{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
.surface,form,.history{min-width:0;background:#fff;padding:clamp(16px,3vw,30px);border:1px solid #a3aaa1;border-radius:12px}
.history{margin-top:22px}.history ul{padding:0;list-style:none;margin:0}.history li{border-top:1px solid #c0c6bf;padding:12px 0;white-space:pre-line;overflow-wrap:anywhere}
label{display:grid;gap:4px;font-weight:600;margin-bottom:12px}
input,select,button,textarea{font:inherit;min-height:44px;min-width:0;width:100%;padding:8px 10px;border:1px solid #71796f;border-radius:5px;background:white;color:#171e19}
button{background:var(--pr);color:#fff;font-weight:650;cursor:pointer;border:0}button:disabled{background:#515a55}
:focus-visible{outline:3px solid #005bc2;outline-offset:3px}.item{display:flex;justify-content:space-between;gap:15px;border-top:1px solid #bfc5be;padding:14px 0;align-items:center}
.item span{font-size:14px}.readout{margin-top:16px;padding-top:12px;border-top:2px solid var(--pr)}output{display:block;font-weight:720;font-size:26px;overflow-wrap:anywhere}
.pill{display:inline-block;font-weight:bold;margin-right:12px}.check{display:flex;align-items:center;gap:12px}.check input{min-height:22px;width:22px;height:22px}.check{min-height:44px}
small,footer{color:#454d46}#status{margin-top:8px}.history button,.surface button{width:auto;min-width:44px;margin:6px 0}fieldset{border:0;margin:0;padding:0}legend{font-weight:700;margin-bottom:6px}
.surface{text-align:center;border-radius:30px}.surface output{font-size:52px}.hero h1{font-family:Georgia,serif}
@media(max-width:700px){.work{grid-template-columns:minmax(0,1fr)}header,main,footer{padding:13px 16px}.work{gap:15px}.hero{padding:22px 0}.surface,form,.history{padding:16px}.history{margin-top:15px}}
header,main,footer{max-width:920px}.work{grid-template-columns:1fr}.surface{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 24px;border-radius:24px;background:#422c39;color:white}.surface h2,.surface .readout{grid-column:1/-1}.surface .readout{border-top:1px solid white;text-align:center}.surface output{font-size:clamp(46px,7vw,88px)}.surface button{background:white;color:#422c39;border-radius:30px;padding-inline:20px}.history{border:none;background:transparent}
@media(min-width:701px){#task{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}#task h2,#task button{grid-column:1/-1}}

/* Şablonun düzenlenebilir tema ve yerleşim kuralları */
:root{--bg:#efecee;--tx:#182321;--line:color-mix(in srgb,var(--pr) 16%,white);font-family:"Inter",system-ui,sans-serif}
header{max-width:none;padding-block:14px;padding-inline:max(20px,calc((100vw - 1120px)/2 + 32px));background:#fff;border-color:var(--line);gap:12px}
header strong{display:flex;align-items:center;gap:10px;letter-spacing:-.025em}
header strong::before{content:"";width:20px;height:20px;flex:none;border-radius:7px;background:var(--pr);box-shadow:inset 0 0 0 5px #fff5}
header a{padding:8px 13px;background:#f3f5f4;border-radius:20px;text-decoration:none;text-align:center;font-size:13px}
main{padding-top:24px}.hero{position:relative;overflow:hidden;isolation:isolate;display:flex;justify-content:center;flex-direction:column;padding:clamp(22px,4.4vw,62px);margin:0 0 24px;border-radius:26px;background:var(--pr);color:#fff}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:repeating-radial-gradient(ellipse at 100% 0%,transparent 0 26px,#fff2 27px 28px,transparent 29px 49px);mask-image:linear-gradient(90deg,transparent 45%,black)}
.hero h1{font-size:clamp(34px,5.1vw,67px);margin:0;letter-spacing:-.06em;line-height:1.05;text-wrap:balance}
.hero p{color:inherit;font-size:clamp(14px,1.4vw,17px);margin:12px 0 0;max-width:51ch;line-height:1.48}
article,form,.history{border-color:var(--line);border-radius:20px;box-shadow:0 10px 32px -26px var(--pr)}
article h2,form h2,.history h2{letter-spacing:-.035em}
input,select,textarea{border-radius:10px;border-color:color-mix(in srgb,var(--pr) 39%,white)}
button{border-radius:10px}button:hover{filter:brightness(.9)}
article>ul{padding-left:20px}footer{color:var(--pr)}
@media(max-width:680px){header{padding:11px 15px}header strong{font-size:15px}main{padding-top:14px}.hero{margin-bottom:16px;border-radius:20px}.hero h1{font-size:clamp(30px,9vw,44px)}.hero p{margin-top:9px}article,form,.history{border-radius:16px}}
</style></head><body>
<header><b>Sıram Geldi</b><a href="#task">Sıraya ekle</a></header><main><div class="hero"><h1>Salon bekleme sırası</h1><p class="lead">Randevusuz gelen müşterileri geliş sırasına alın. Sıradaki kişiyi çağırıp bekleme süresini güncelleyin.</p></div>
<div class="work"><section class="surface"><h2>Sıradaki müşteri</h2><div class="readout"><span>Bekleyen</span><output id="waiting">—</output></div><p id="next"></p><button id="call" type="button">Sıradakini çağır</button></section><form id="task"><h2>Sıraya ekle</h2><label>Müşteri rumuzu<input type="text" name="name" required ></label><label>Hizmet süresi<select name="minutes" required><option value="">Seçin</option><option value="15">Fön · 15 dk</option><option value="30">Kesim · 30 dk</option><option value="45">Bakım · 45 dk</option></select></label><button type="submit">Sıraya ekle</button></form></div>
<section class="history"><h2>Giriş sırası</h2><p id="empty">Henüz kayıt yok.</p><ul id="records"></ul></section><p role="status" id="status"></p></main><footer>Örnek veriler bu cihazda saklanır.</footer>
<script>
const form=document.querySelector("form");
const key="gitmapp-sira";
const list=document.querySelector("#records"),statusLine=document.querySelector("#status");
let rows=[];
try{rows=JSON.parse(localStorage.getItem(key)||"[]")}catch{}
/* gitmapp-task-records */
const amount=n=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY"}).format(n);
const values=()=>Object.fromEntries(new FormData(form));
const show=(id,text)=>document.getElementById(id).textContent=text;
function persist(){
 render();form.dispatchEvent(new Event("gitmapp-save"));
 try{localStorage.setItem(key,JSON.stringify(rows));statusLine.textContent="Kaydedildi."}
 catch{statusLine.textContent="Kayıt bu oturumda tutuluyor. Cihaz depolaması dolu veya kapalı."}
}
function waiting(){return rows.filter(r=>!r.called).reverse()}
function update(){const queue=waiting();show("waiting",queue.length+" kişi");show("next",queue[0]?.name||"Bekleyen müşteri yok.");document.querySelector("#call").disabled=!queue.length}
function makeRecord(v){const delay=waiting().reduce((sum,r)=>sum+r.minutes,0);return {name:v.name,minutes:Number(v.minutes),text:v.name+" · Tahmini bekleme "+delay+" dk"}}
document.querySelector("#call").onclick=()=>{const row=waiting()[0];if(row){row.called=true;row.text+=" · Çağrıldı";persist()}};
function render(){
 list.replaceChildren();document.querySelector("#empty").hidden=rows.length>0;
 for(const row of rows){
  const li=document.createElement("li");li.textContent=row.text;
  list.append(li);
 }
 update();
}
form.addEventListener("input",()=>{for(const el of form.elements)el.setCustomValidity?.("");update()});
form.addEventListener("submit",event=>{
 event.preventDefault();const row=makeRecord(values());if(!row)return;
 rows.unshift(row);form.reset();persist();
});
render();
</script></body></html>
