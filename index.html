<style>
:root{--bg:#0a0a0a;--bg2:#0f0f0f;--card:#151515;--line:#262626;--txt:#f4f4ef;--mut:#9a9a93;--acc:#e4ff3d;--acc2:#a3e635;--ink:#0a0a0a;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:230px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 8px 18px}
.logo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--mut);border:0;background:none;text-align:left;width:100%}
.nav:hover{background:#222221;color:var(--txt)}.nav.on{background:#292928;color:#fff}
.nav b{margin-left:auto;background:var(--acc);color:#fff;border-radius:20px;padding:0 7px;font-size:11px}
.main{flex:1;min-width:0;padding:24px 28px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:22px 0 10px}.sub{color:var(--mut);margin:0 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px}
.in{background:#131312;border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.in:focus{outline:none;border-color:var(--acc)}
.btn{background:var(--acc);border:0;border-radius:8px;padding:9px 14px;color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}.btn.g{background:#272725;border:1px solid var(--line)}.btn.s{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#191918;border-radius:20px;padding:5px 11px;cursor:pointer;font-size:12px;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card img{width:100%;aspect-ratio:2/1;object-fit:cover;background:#131312;display:block}
.cb{padding:12px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.ct{font-weight:700;font-size:15px;word-break:break-word}.cd{color:var(--mut);font-size:12.5px;line-height:1.45;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:10px;color:var(--mut);font-size:12px;align-items:center}
.tag{display:inline-block;background:#252523;border:1px solid #393937;color:#b9c8ec;border-radius:6px;padding:2px 7px;font-size:11px}
.grade{font-weight:800;border-radius:6px;padding:2px 8px;font-size:12px}
.gA{background:#14532d;color:#86efac}.gB{background:#1e3a2a;color:#bef264}.gC{background:#422006;color:#fcd34d}.gD{background:#450a0a;color:#fca5a5}.gN{background:#282826;color:#a2a29c}
.empty{text-align:center;color:var(--mut);padding:60px 20px;border:1px dashed var(--line);border-radius:12px}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.st b{display:block;font-size:22px}.st span{color:var(--mut);font-size:12px}
.drawer{position:fixed;inset:0;background:rgba(3,6,12,.7);display:flex;justify-content:flex-end;z-index:50}
.dw{width:min(900px,100%);background:var(--bg2);height:100%;overflow:auto;border-left:1px solid var(--line)}
.dh{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--line);padding:16px 20px;z-index:2}
.tabs{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}.tab{padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--mut);background:none;border:0}.tab.on{background:#292928;color:#fff}
.db{padding:20px}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #242423}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex-shrink:0;font-weight:700}
.d-ok{background:#14532d;color:#86efac}.d-warn{background:#422006;color:#fcd34d}.d-bad{background:#450a0a;color:#fca5a5}.d-info{background:#282826;color:#93c5fd}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.gal figure{margin:0;background:#131312;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gal img{width:100%;display:block;max-height:260px;object-fit:contain;background:#fff1}
.gal figcaption{font-size:11px;color:var(--mut);padding:6px 8px}
.lang{height:10px;border-radius:6px;overflow:hidden;display:flex;background:#131312;margin:8px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.step{display:flex;gap:12px;margin-bottom:14px}.step .n{width:28px;height:28px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-weight:700;flex-shrink:0}
pre.cmd{background:#0e0e0d;border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;font-size:12px;color:#c9d6ff}
table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid #242423;text-align:left;font-size:13px}th{color:var(--mut);font-weight:500}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#292928;border:1px solid var(--acc);padding:10px 16px;border-radius:10px;z-index:99}
/* Sunum */
.deck{position:fixed;inset:0;background:#05070c;z-index:80;display:flex;flex-direction:column}
.deckbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.stage{flex:1;display:grid;place-items:center;padding:20px;overflow:auto}
.slide{width:min(1100px,100%);aspect-ratio:16/9;background:linear-gradient(135deg,#171716,#1b1b1a 60%,#181817);border:1px solid #353533;border-radius:16px;padding:48px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.slide:after{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#4f8cff33,transparent 70%)}
.slide h2{font-size:34px;margin:0 0 10px}.slide h3{font-size:14px;letter-spacing:.14em;color:var(--acc);text-transform:uppercase;margin:0 0 14px}
.slide p{font-size:18px;line-height:1.55;color:#d1d1c9}
.slide .foot{margin-top:auto;display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;flex:1;min-height:0}
.sgrid img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid #353533;background:#131312}
.big{font-size:84px;font-weight:800;line-height:1}
@media print{.side,.deckbar,.noprint{display:none!important}.deck{position:static}.stage{display:block;padding:0}.slide{page-break-after:always;margin:0 auto 10px;border-radius:0}body{background:#05070c}}
.spin{width:42px;height:42px;border:4px solid #393937;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:820px){.studio-grid{grid-template-columns:1fr!important}.app{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;overflow:auto;padding:8px}.logo{padding:4px 8px}.nav{width:auto;white-space:nowrap}.main{padding:16px}.slide{padding:22px}.slide h2{font-size:22px}.slide p{font-size:14px}.big{font-size:48px}}

/* v3.2 Stüdyo — Claude Code / Codex / Gemini tarzı */
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.spark.on{animation:spk 3.2s linear infinite,spp 1.6s ease-in-out infinite;transform-origin:50% 50%}@keyframes spk{to{transform:rotate(360deg)}}@keyframes spp{50%{opacity:.55}}
.shimmer{background:linear-gradient(90deg,#969690 0%,#969690 40%,#f2f5fb 50%,#969690 60%,#969690 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shm 2.2s linear infinite}@keyframes shm{from{background-position:120% 0}to{background-position:-120% 0}}
.caret{display:inline-block;width:7px;height:1.05em;background:#d7d7cf;vertical-align:-2px;margin-left:1px;animation:blk 1s steps(1) infinite}@keyframes blk{50%{opacity:0}}
.grad-text{background:linear-gradient(90deg,#e4ff3d,#a3e635 35%,#f4ffb3 65%,#ffffff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{max-width:820px;margin:6vh auto 40px;text-align:center}
.hero-greet{font-family:Newsreader,Georgia,serif;font-size:44px;line-height:1.15;letter-spacing:-.5px;color:#dfdfd6}
.hero-sub{color:var(--mut);font-size:15px;max-width:560px;margin:12px auto 0;line-height:1.6}
.gbox{position:relative;border-radius:22px;padding:1.5px;background:conic-gradient(from var(--a),#e4ff3d,#a3e635,#f4ffb3,#ffffff,#e4ff3d,#e4ff3d);animation:gspin 8s linear infinite;text-align:left}
.gbox::before{content:"";position:absolute;inset:-6px;border-radius:28px;background:inherit;filter:blur(18px);opacity:.28;z-index:0;transition:opacity .4s}
.gbox:focus-within::before{opacity:.45}.gbox.busy{animation-duration:2.4s}.gbox.busy::before{opacity:.6}
@keyframes gspin{to{--a:360deg}}
.gin{position:relative;z-index:1;background:#151514;border-radius:20.5px;padding:12px 12px 10px 16px}
.gta{width:100%;background:transparent;border:0;outline:0;resize:none;font-size:15px;line-height:1.55;color:var(--txt)}.gta::placeholder{color:#686863}
.gbar{display:flex;align-items:center;gap:8px;margin-top:4px}.gnote{font-size:12px;color:#767671;display:flex;align-items:center;gap:5px}
.gsend{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#0f0f0e;background:linear-gradient(135deg,#e8eefc,#b9c8ef);transition:transform .15s,opacity .2s}.gsend:hover:not(:disabled){transform:scale(1.06)}.gsend:disabled{opacity:.35;cursor:default}.gbox.busy .gsend{opacity:1;background:#242422}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.seg{display:inline-flex;background:#181817;border:1px solid #2b2b2a;border-radius:12px;padding:3px;gap:2px}
.seg button{display:flex;align-items:center;gap:6px;border:0;background:none;color:#969690;padding:6px 10px;border-radius:9px;cursor:pointer;font-size:12.5px;transition:all .2s}
.seg button:hover{color:#dbe3f2}.seg button.on{background:#292928;color:#fff;box-shadow:inset 0 0 0 1px #3c3c3a}
.pill{display:inline-flex;align-items:center;gap:7px;background:#181817;border:1px solid #2b2b2a;border-radius:12px;padding:7px 11px;cursor:pointer;font-size:12.5px;color:#d7d7cf;transition:border-color .2s}.pill:hover{border-color:#3b4d75}
.pill-m{display:inline-flex;align-items:center;gap:3px;color:#e4ff3d;background:#21211f;border-radius:7px;padding:1px 6px;font-size:11px}
.gcard{background:linear-gradient(180deg,#1b1b1a,#171716);border:1px solid #2b2b2a;border-radius:18px;transition:transform .25s,border-color .25s,box-shadow .25s}
.tpl-h{margin:34px 0 12px;color:#767671;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;text-align:left}
.tpl{position:relative;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,#1b1b1a,#171716);border:1px solid #2b2b2a;border-radius:18px;padding:14px;cursor:pointer;text-align:left;color:inherit;transition:transform .25s,border-color .25s,box-shadow .25s}
.tpl:hover{transform:translateY(-2px);border-color:#3a4a72;box-shadow:0 10px 30px -12px rgba(228,255,61,.35)}
.tpl-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.tpl-t{font-weight:600;font-size:13.5px}.tpl-d{color:#888883;font-size:12px;line-height:1.45}.tpl-k{position:absolute;top:14px;right:14px;color:#60605d}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px;text-align:left}
.st4{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid #242423}.st4 b{display:block;font-size:13px}.st4 span{color:#767671;font-size:12px}
@media(max-width:820px){.hero-greet{font-size:32px}.steps4{grid-template-columns:1fr 1fr}}
.ws{display:flex;flex-direction:column;height:calc(100vh - 48px)}
.ws-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ws-title{flex:1;min-width:140px;max-width:320px;font-weight:600}
.clr{width:36px;height:34px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.ib{display:grid;place-items:center;min-width:34px;height:34px;border-radius:10px;border:1px solid #2b2b2a;background:#181817;color:#c2c2ba;cursor:pointer;transition:all .2s}.ib:hover:not(:disabled){color:#fff;border-color:#3b4d75}.ib:disabled{opacity:.4;cursor:default}
.ws-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:12px}
.ws-chat{display:flex;flex-direction:column;min-height:0;background:#141413;border:1px solid #252524;border-radius:18px;overflow:hidden}
.ws-ctrl{padding:10px;border-bottom:1px solid #222220}.ws-ctrl .ctrls{justify-content:flex-start}
.ws-msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.ws-in{padding:10px;border-top:1px solid #222220}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sugg .chip{display:inline-flex;align-items:center;gap:4px}
.mu{align-self:flex-end;max-width:85%;background:#222221;border:1px solid #2f2f2d;border-radius:16px 16px 4px 16px;padding:9px 13px;white-space:pre-wrap;line-height:1.5}
.ma{display:flex;flex-direction:column;gap:8px}
.ma-t{display:flex;gap:9px;line-height:1.6;color:#dcdcd3}.ma-t.err{color:#fca5a5}.ma-ic{margin-top:3px}
.wlog{border:1px solid #292927;border-radius:14px;background:#10100f;overflow:hidden}
.wlog-h{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;font-size:13px;user-select:none}.wlog-h:hover{background:#151514}
.wlog-h>span:not(.wlog-t){white-space:nowrap}.wlog-t{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#696965;font-size:11.5px;font-family:"JetBrains Mono",monospace}
.wlog-b{padding:4px 12px 10px 14px;border-top:1px solid #1e1e1c}
.wlog-r{position:relative;display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px;color:#696965;transition:color .4s}

.wlog-i{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.wlog-r.done .wlog-i{background:#14301f;color:#86efac}.wlog-r.run .wlog-i{background:#292928}
.wlog-l{flex:1}
.pend{width:7px;height:7px;border-radius:50%;border:1.5px solid #3f3f3d}
.dots{display:flex;gap:2px}.dots i{width:3px;height:3px;border-radius:50%;background:#e4ff3d;animation:dt 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes dt{0%,80%,100%{opacity:.25}40%{opacity:1}}
.ws-prev{min-height:0;display:flex;justify-content:center;align-items:stretch;background:radial-gradient(circle at 50% 0,#1b1b19,#0f0f0e 70%);border:1px solid #252524;border-radius:18px;padding:12px;overflow:hidden}
.prev-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#60605d;font-size:13px;width:100%}
.frame-m{height:100%;max-height:820px;border:0;border-radius:30px;background:#fff;box-shadow:0 0 0 8px #21211f,0 30px 60px -20px #000}
.frame-d{height:100%;border:0;border-radius:12px;background:#fff}
.livecode{width:100%;display:flex;flex-direction:column;min-height:0}
.lc-h{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:8px}
.lc-b{flex:1;overflow:auto;margin:0;background:#0c0c0b;border:1px solid #222220;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;color:#afafa8;white-space:pre-wrap;word-break:break-all}
@media(max-width:820px){.ws{height:auto}.ws-grid{grid-template-columns:1fr}.ws-prev{min-height:560px}.ws-chat{max-height:70vh}}

/* v3.3 — App Store düzeni, Material zarafeti, cam yüzeyler */
body{background:radial-gradient(1100px 620px at 85% -8%,rgba(228,255,61,.10),transparent 60%),radial-gradient(900px 600px at -5% 105%,rgba(163,230,53,.08),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%)}
.app{position:relative;z-index:1}
.glass{background:rgba(14,14,14,.66);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}
.side{width:256px;border-right:1px solid rgba(255,255,255,.06);padding:16px 12px 12px;gap:2px;overflow:auto}
.logo{gap:11px;font-size:19px;letter-spacing:-.2px;padding:2px 6px 14px}
.brand{display:grid;place-items:center;flex-shrink:0;background:linear-gradient(145deg,#e4ff3d,#a3e635 55%,#f4ffb3);box-shadow:0 6px 18px -6px rgba(163,230,53,.7),inset 0 0 0 1px rgba(255,255,255,.18)}

.ed-chip:nth-of-type(1){right:-8px;top:12px}.ed-chip:nth-of-type(2){left:-10px;bottom:24px}.ed-chip:nth-of-type(3){right:18px;bottom:-6px}

.drawer{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.box{border-radius:20px}

 .sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 14px 100px;border-top:1px solid rgba(255,255,255,.08);animation:sup .3s cubic-bezier(.2,.8,.2,1)}

}

/* v5.0 — Apple dengesi: nötr arayüz, limon yalnızca marka ve gerçekten gereken vurgu */
:root{--ink:#f5f5f7;--fill1:#1c1c1e;--fill2:#2c2c2e;--fill3:#3a3a3c;--sep:rgba(255,255,255,.1);--sys2:#8e8e93;--sys3:#636366}
body,button,input,textarea,select{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif}
/* butonlar: birincil beyaz, ikincil gri */
.btn{background:var(--ink)!important;color:#0a0a0b!important;border:0!important;border-radius:12px;font-weight:600;letter-spacing:-.005em}
.btn:hover:not(:disabled){background:#fff!important;filter:none}
.btn.g{background:var(--fill1)!important;color:var(--ink)!important;border:1px solid var(--sep)!important}
.btn.g:hover:not(:disabled){background:var(--fill2)!important}
.btn:disabled{opacity:.38;cursor:default}
.getbtn{background:var(--fill2)!important;color:var(--ink)!important;font-weight:650!important;letter-spacing:0!important;text-transform:none!important;border-radius:999px}
.getbtn:hover:not(:disabled){background:var(--fill3)!important}
.getbtn.solid{background:var(--ink)!important;color:#000!important}
/* seçim durumları: gri dolgu, sarı yok */
.chip.on{background:var(--fill2)!important;border-color:var(--fill3)!important;color:#fff!important}
.pill.on{border-color:var(--fill3)!important;background:var(--fill2)!important}
.seg button.on{background:var(--fill2)!important;color:#fff!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)!important}
.forme{border-color:var(--sep)!important;background:var(--fill1)!important;color:var(--ink)!important}
.forme-chip,.theme-chip{border-color:var(--sep)!important;color:var(--ink)!important;background:var(--fill1)!important}
.gh-detect{border-color:var(--sep)!important;background:var(--fill1)!important}
/* istem kutusu */
.gsend{background:var(--ink)!important;color:#0a0a0b!important;opacity:1!important}
.gsend:disabled{background:var(--fill2)!important;color:var(--sys3)!important}
.gatt{background:transparent!important;color:#aeaeb2!important}.gatt:hover:not(:disabled),.gatt.on{background:var(--fill2)!important;color:#fff!important}
.gatt.rec{background:#ff453a!important;color:#fff!important}
/* kenar menüsü: kutucuksuz tek renk ikonlar */
.nav{color:#d1d1d6}
.nav .tile{background:none!important;box-shadow:none!important;border-radius:0!important;color:#a1a1a6!important;width:22px!important;height:22px!important}
.nav .tile svg{width:19px!important;height:19px!important}
.nav:hover .tile{color:#e5e5ea!important}
.nav.on{background:var(--fill2)!important;color:#fff!important}
.nav.on .tile{color:#fff!important;background:none!important;box-shadow:none!important}
.nav.on::before{display:none!important}
.nav b{background:var(--fill3)!important;color:var(--ink)!important;font-weight:600}
.bnav button.on{color:#fff}.bnav button.on .bn-ic{background:var(--fill2)!important;color:#fff!important}
/* Apple menüleri */
.amenu,.wsw-m,.pj-menu,.histm,.slashm{background:rgba(40,40,42,.97)!important;backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid rgba(255,255,255,.09)!important;border-radius:16px!important;box-shadow:0 24px 60px -12px rgba(0,0,0,.78),0 0 0 .5px rgba(0,0,0,.6)!important;padding:6px!important}
.amenu button,.wsw-m>button,.pj-menu button,.histm button,.slashm button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--ink);font-size:14.5px;line-height:1.2;padding:9px 12px;border-radius:10px;text-align:left;cursor:pointer}
.amenu button:hover:not(:disabled),.wsw-m>button:hover,.pj-menu button:hover,.histm button:hover,.slashm button:hover{background:rgba(255,255,255,.08)}
.amenu button:disabled{opacity:.4}.amenu button>span{flex:1}
.amenu kbd{font-family:inherit;font-size:13px;color:var(--sys2);background:none;border:0;padding:0}
.amenu-sep{height:1px;background:rgba(255,255,255,.1);margin:5px 10px}
.amenu-h{font-size:12px;color:var(--sys2);padding:6px 12px 4px;font-weight:600}
.plusw{position:relative;display:inline-flex}.plusm{position:absolute;left:-4px;bottom:calc(100% + 12px);width:300px;z-index:60;animation:dgin .16s}

.icp{position:relative;display:inline-flex}
.icp-b{display:flex;align-items:center;gap:4px;border:1px solid var(--sep);background:var(--fill1);border-radius:12px;padding:4px 6px 4px 4px;cursor:pointer}

  "🖼️ Gerçek görseller: kartlar artık hep aynı GitHub paylaşım görselini değil, projenin README'sindeki ilk ekran görüntüsünü gösterir (rozet, logo ve animasyonlar ayıklanır); yoksa paylaşım görseline, o da yoksa şık kapağa düşer. Görseller ekrana geldikçe yüklenir ve önbelleğe alınır",
  "🪄 Yapay zekâ prototipi: proje detayında yeni Prototip sekmesi. Depo çalıştırılmadan README, dosya yapısı ve arayüz dosyaları okunur; gerçek modüller, menüler, tablolar ve iş akışları çıkarılıp gerçekçi Türkçe verilerle tıklanabilir bir prototip ekrana gelir (PHP/Python projeleri dahil). Telefon/masaüstü görünümü, tespit edilen modüller ve “Geliştir'de aç”",
  "🧭 Proje detayı yeniden düzenlendi: proje logosu, skor, lisans ve güvenlik tek satırda; Genel / Prototip / Ekranlar / Güvenlik / Bu projeyi yap sekmeleri; Genel'de skor dökümü ve “Gitmapp'te önizle”",
  "🛠️ “Bu projeyi yap” sadeleşti: yapı özeti kartları, önce Gitmapp yolları (Önizle ve devral, Yapay zekâ prototipi), sonra kaynak kod adımları (fork, geliştirme talebi + Claude komutu, Netlify/Vercel/Render, kuyruk). Sarı numaralar yerine nötr adım numaraları, Claude komutu açılır kapanır",
  "✏️ Yönetim panelinde kalan emoji ve eski simgeler (lisans rozetleri, ☆/★, ⚠, ✕, 🚀, 💡, 🔎, 💎, 🔑…) tek tip ikonlara çevrildi; GitHub Radarı kartları App Store düzenine geçti",
 ]},
 {v:"5.1.0",date:"2026-11-25",items:[
  "🧩 Hazır Kodlar yenilendi (App Store kartları): her projede sahibinin logosu, adı, kategorisi ve sağ üstte “İste” düğmesi; altında yıldız, dil (renkli nokta), son güncelleme ve çatal sayısı tek satırda",
  "🖼️ Kırık önizleme görselleri artık boş kalmıyor: görsel yüklenemezse proje adıyla şık bir kapak, logo yoksa App Store tarzı ikon gösterilir; yüklenirken iskelet animasyonu",
  "🛡️ Lisans rozeti emoji yerine ikonlu (yeşil: satışa uygun, turuncu: kaynak paylaşımı gerekir, gri: belirsiz); güvenlik testi yapıldıysa puanı da görünür",
  "🎛️ Filtreler Apple anahtarları gibi (Satışa uygun lisans, Canlı demolu), sıralama: Popüler / Yeni / Çok kullanılan, dile göre süzme ve temizlenebilir arama; arama çubuğu kaydırırken üstte sabit kalır",
  "👁️ HTML/JS/TypeScript/Vue projelerinde “Önizle”: depo Gitmapp'te açılır, bağımlılıklar kontrol edilir, beğenirsen projeyi devralabilirsin. Canlı demosu olanlarda “Demo” düğmesi",
  "💬 Fiyat “Kurulum dahil 7.490 ₺'den” olarak netleşti; sayfa altında süreci anlatan kısa bir not",
 ]},
 {v:"5.0.0",date:"2026-11-25",items:[
  "🎨 Yeni görünüm, Apple dengesi: sarı artık yalnızca marka logosunda ve gerçekten dikkat isteyen yerlerde (onay bekleyen adım, vurgulu başlık). Birincil düğmeler beyaz, ikinciller gri; seçili sekme, çip, paket ve adımlar sakin gri dolguyla gösterilir. Bağlantılar Apple mavisi, bildirimler cam görünümlü",
  "✏️ Tek tip ikon seti: tüm arayüz ve 8 hazır şablon, SF Symbols tarzında ince çizgili Lucide ikonlarına geçti; yarı saydam dolgulu eski ikonlar ve emojiler kaldırıldı. Kenar menüsündeki renkli kutucuklar yerine sade tek renk ikonlar",
  "📱 App Store tarzı uygulama ikonları: projeler, mağaza, şablonlar ve Keşfet vitrini artık degrade zeminli, beyaz sembollü yuvarlak köşe ikonlar kullanıyor",
  "➕ İstem kutusunda sade “+” menüsü: görsel ya da çizim ekle (⌘U), tasarım teması, beceriler, dil modeli, bağlantılar, GitHub'dan içe aktar, komutlar ve Asistan tek yerde. Proje menüleri, çalışma alanı menüsü ve sürüm geçmişi aynı Apple menü stilinde",
  "🧩 Stüdyo'da emoji listesi yerine ikon ve renk seçici: 24 sembol ve 12 Apple sistem rengi, istersen özel renk",
  "🔤 Yazı tipi Apple cihazlarda San Francisco (SF Pro), diğerlerinde Inter",
 ]},
 {v:"4.9.0",date:"2026-11-25",items:[
  "🐙 GitHub'dan içe aktar: istem kutusuna, ⌘K aramasına ya da Asistan'a bir GitHub adresi (depo, klasör ya da dosya yolu, github.io sayfası) yazınca depo okunur ve site saniyeler içinde canlı önizlemede açılır. Projeler'de “GitHub'dan içe aktar” kartı, Stüdyo'da /github komutu",
  "🔎 Bağımlılık kontrolü: dosya sayısı ve boyutu, giriş sayfası, derleme gerekip gerekmediği (Vite, Next.js, React, Vue, Angular…), package.json bağımlılıkları, dış CDN kaynaklarına erişim, sayfanın istediği ama depoda olmayan dosyalar, sunucu tarafı kodlar, açıkta kalmış gizli anahtar dosyaları ve lisans tek ekranda listelenir",
  "📦 Tek dosyada birleştirme: CSS, @import'lar, betikler, simgeler ve küçük görseller sayfanın içine alınır; büyük dosyalar ve modüller jsDelivr üzerinden sabit sürüme bağlanır. Derleme isteyen projelerde yayındaki sürüm (GitHub Pages ya da ana sayfa adresi) alınır ya da yapay zekâyla tek dosyaya dönüştürülür",
  "🚀 Projeyi devral: tek tıkla (ya da “projeyi devral” yazarak, /devral komutuyla veya Asistan'a söyleyerek) site Gitmapp projesine dönüşür ve app.gitmapp.com adresinde yayına girer; kaynak depo ve sürüm proje bilgisine yazılır. Geliştir'de aç ve Tasarımda aç ile hemen düzenlenebilir",
  "🔐 GitHub hesabını bağlayınca özel depolar da okunabilir ve GitHub istek sınırı yükselir; giriş sonrası içe aktarma kaldığı yerden devam eder",
  "💎 Canlı krediler: her işlemden sonra bakiye anında güncellenir, harcanan miktar uçan bir “−3 kredi” etiketiyle gösterilir. Kenar çubuğundaki ya da Stüdyo'daki kredi rakamına dokununca kalan kredi, bu oturum, bugün, 7 ve 30 gün harcaması, işlem türüne göre dağılım ve son işlemler açılır",
 ]},
 {v:"4.8.0",date:"2026-11-25",items:["Sekiz şablonun tanıtımı yenilendi. Öne çıkan özellikleri inceleyebilir, farklı cihazlarda deneyebilir ve tasarımı doğrudan düzenleyebilirsiniz.","Şablonlara özgün ürün simgeleri eklendi. Menü ve işlem ikonları ortak bir iki tonlu setle yenilendi."]},
 {v:"4.7.0",date:"2026-11-25",items:["Önizlemedeki ok sürüklenebilir, köşeye yerleşir ve kullanılmadığında küçülür. Seçim ve metin araçları açık ekranda çalışır.","Mobil şablon tabloları, grafikler ve tam ekran demolar düzenlendi. Gitmapp ana ekrana yüklenebilir."]},
 {v:"4.6.0",date:"2026-11-25",items:[
  "🎧 Gitmapp Asistan: her sayfada sağda açılan yan sohbet paneli (sol menüde “Asistan”, sağ alttaki düğme ya da Ctrl/⌘+J). Fikrini anlat, sana en fazla iki soru sorarak netleştirir",
  "✍️ Sohbetten prompta: fikir netleşince asistan ayrıntılı geliştirme istemini kendisi yazar, istem kutusuna aktarır, uygun tür, tema ve modu seçer, “Geliştirmeye başlayayım mı?” diye sorar. “Prompta dönüştür” ve “Geliştirmeye başla” kısayolları",
  "🗣️ Sesli sohbet: eller serbest konuşma. Asistan seni dinler (Türkçe), yanıtını sesli okur, sonra yeniden dinler. Konuşurken araya girebilir, onayları “evet” ya da “atla” diyerek verebilirsin. Tek seferlik sesle yazma ve yanıtları sesli okuma aç/kapat",
  "🧭 Oto pilot: asistan konuşmaya göre sayfaları açar, proje türünü, modu, tasarım temasını, çalıştırma ayarlarını ve model/tasarım/beceri panellerini imleçle kendisi ayarlar. Kredi harcayan ya da geri alınamayan adımlarda (geliştir, kontrol, kaydet, yayınla, şablon aç, yeni proje) imleç Onayla düğmesini gösterir ve yalnızca senin tıklamanı bekler",
  "📋 Sohbet modunda asistanın önerdiği her adım bir kartta listelenir: tek tek “Uygula” ya da “Hepsini uygula”",
  "🧠 Asistan o an hangi sayfada olduğunu, Stüdyo'daki projeyi (tür, mod, tema, model, istem kutusu, ayarlar) ve kredini bilir; şablon ve tema kataloğundan yalnızca gerçek seçenekleri önerir. Asistanla sohbet ücretsizdir",
 ]},
 {v:"4.5.0",date:"2026-11-25",items:["Stüdyoda önizleme, tasarım ve kod ayrı görünümlerde. Üretim sırasında son çalışan sürümü inceleyebilirsiniz.","Uygulama ve site şablonlarında seçtiğiniz öğeyi elle veya yapay zekâ önerisiyle düzenleyebilir, tasarımı HTML ve SVG olarak dışa aktarabilirsiniz."]},
 {v:"4.4.0",date:"2026-11-25",items:[
  "🛠️ Yapay zekâ hatası düzeltmesi: seçilen model AI Router'da reddedilirse (401/403/404) Gitmapp otomatik olarak listedeki diğer modeli dener; hata mesajları artık nedeni ve çözümü açıkça yazar (bakiye, model izni, anahtar)",
  "🧠 Beceriler: yapay zekâya kalıcı uzmanlık yükle (kurumsal dil, KVKK uyumu, erişilebilirlik, SEO, mobil önce, koyu tema, Türkiye biçimleri, çok dilli, PWA, yazdır/PDF, CSV, oyun hissi…). Yüklü beceriler her yeni üretime otomatik eklenir",
  "🧩 Açılış ekranında kategori seçince (Pano, Portal, İç araç, Açılış sayfası…) o kategorinin canlı şablonları kaydırılabilir bir panelde açılır; istem kutusunun ipucu da kategoriye göre değişir",
  "📐 Sade ve kompakt yerleşim: masaüstünde üst başlık çubuğu kaldırıldı, kenar çubuğu sıkılaştırıldı, Geliştir ekranı daha fazla alan kullanır, uzun istekler sohbette katlanır, hatalar ayrı kutuda görünür",
 ]},
 {v:"4.3.0",date:"2026-11-25",items:[
  "🎯 Yeni ikon seti: tüm arayüzde modern, tutarlı çizgi ikonlar (Lucide); emojiler model seçiciden ve başlıklardan kaldırıldı",
  "🏷️ Gerçek marka logoları: Claude, Gemini, DeepSeek, Mistral, Qwen, Kimi, Llama, Grok ile WhatsApp, Telegram, Google Haritalar, Analytics, Takvim, E-Tablolar, Supabase, Firebase, Instagram, YouTube, GitHub, Calendly ve daha fazlası",
  "🧠 Yeni dil modeli seçici: her model ailesinin logosu, neye iyi geldiği ve beceri etiketleri (kod yazma, uzun dosya, görsel okuma…), Hızlı/Dengeli/Güçlü seviyeleri ikonlu, önerilen model ve seçim işareti",
  "✨ İstem kutusunun ışığı inceltildi: 1 piksel renkli kenar ve Gemini ölçüsünde hafif ışıma",
 ]},
 {v:"4.2.0",date:"2026-11-25",items:[
  "🌈 Siri tarzı canlı arka plan: mavi, mor, pembe, turuncu ve camgöbeği ışımalar yavaşça akar; ızgara çizgileri kaldırıldı, limon sarısı yalnızca marka vurgusunda",
  "✨ AI Studio tarzı çok renkli istem çerçevesi geri geldi; yazmaya başlayınca hızlanır ve parlar",

  "➕ Hızlı ekler: yazdığın isteğe tek dokunuşla “Giriş sistemi”, “Yönetici paneli”, “Grafikler”, “WhatsApp”, “SSS”, “Skor tablosu” gibi özellikler eklenir (türe göre değişir)",
  "🪄 İyileştir: kısa isteğini ekranlar, özellikler ve tasarımla ayrıntılı bir isteme çevirir (kredi harcamaz)",
  "🎨 Renkli çizgi ikon karoları: her menü ögesinin kendi rengi var; seçilen öge renkli dolguya döner",
 ]},
 {v:"4.1.0",date:"2026-11-25",items:[
  "🏠 Yeni açılış ekranı: “Yapmaya hazır mısın?” başlığı, limon ışıltılı arka plan, büyük istek kutusu (çizim ekle, Çalışma alanı, Uygulama/Site/Oyun, Yap/Planla/Ajan seçimi, sesle yazma) ve hazır fikir düğmeleri (Pano, Portal, Sunum, İç araç, Açılış sayfası, Satış, Oyun)",
  "➡️ İsteği gönderince proje doğrudan Geliştir'de açılır ve üretim başlar; altında projelerin, son açılanlar, en çok ziyaret edilenler ve şablonlar",
  "🔐 Yeni giriş ekranı: tam sayfa, Google / GitHub ile devam et düğmeleri, e-posta ile kayıt ve canlı uygulama önizlemeli tanıtım paneli",
  "🔎 Google için temel SEO: başlık, açıklama, Open Graph, kanonik adres ve yeni simge",
 ]},
 {v:"4.0.0",date:"2026-11-25",items:[
  "🍋 Yeni Gitmapp kimliği: limon sarısı ve grafit renkler, yeni logo (g harfi + rota noktası), küçük harfli “gitmapp.” yazısı, ince çizgili ikon seti ve tüm düğmelerde kurumsal dil",
  "🧭 Yeni kenar çubuğu: çalışma alanı seçici, Yeni proje, Ara (⌘K / Ctrl+K), Keşfet, Projeler, Şablonlar, Bağlantılar, Eylem merkezi, Otomasyonlar, son projeler ve “Daha fazla”",
  "🔌 Bağlantılar: 23 servis (Gitmapp Bulut Kayıt, WhatsApp, Telegram, form gönderimi, canlı destek, Google Haritalar, Takvim, ödeme bağlantısı, E-Tablolar, Supabase, Firebase, Analytics, Search Console, Meta Pixel, Instagram, YouTube…), kategoriler (Büyüt, Sat, İletişim, Çalış, Yapay Zekâ), etkin sayacı, özel bağlayıcı ve MCP kaydı. Etkinleştirilen servisleri yapay zekâ uygulamaya kendisi ekler",
  "☁️ Gitmapp Bulut Kayıt: yayındaki uygulamalar window.GitmappDB ile verilerini buluta kaydedip tüm cihazlarda paylaşabilir",
  "📁 Projeler sayfası: Projelerim, Son görüntülenenler, Bugün en çok ziyaret edilenler ve Gitmapp şablonları sekmeleri; canlı önizlemeli kartlar, Yayında rozeti, ziyaret sayısı ve hızlı menü",
  "🔎 Komut paleti: projeleri, şablonları, sayfaları ve mağazayı tek kutudan ara; “… için uygulama yap” ile doğrudan başlat",
  "🎯 Görsel düzenleme: önizlemede bir öğeyi “Seç” ile işaretleyip yalnızca onu değiştirt; “Metin” ile yazılara tıklayıp doğrudan düzelt (kredi harcamaz)",
  "🎙️ Sesle yazma, 🕘 sürüm geçmişi, 🔔 Eylem merkezi, 🎁 davet bağlantısı (davet ettiğin kişi ilk uygulamasını yayınlayınca 50 kredi), ⚙️ Otomasyon tarifleri (yakında)",
 ]},
 {v:"3.7.0",date:"2026-11-25",items:[

 ]},
 {v:"3.6.0",date:"2026-11-25",items:[
  "✏️ Çizimden uygulama: kağıda çizdiğin ekranın fotoğrafını ekle; yapay zekâ menüleri, kategorileri, görsel alanlarını, okları ve el yazısı başlıkları tanıyıp birebir yerleşimle uygulamaya çevirir",

  "🛡️ Görsel okuyamayan model seçilirse anlaşılır uyarı; görseller tarayıcıda küçültülerek gönderilir",
 ]},
 {v:"3.5.0",date:"2026-11-25",items:[
  "🛠️ Düzeltme: “Anahtar geçersiz ya da yetkisi yok” hatası. Hostinger AI Router model listesi vermediğinde Gitmapp artık hazır model listesine geçiyor (claude-sonnet-5, gpt-5.2; AI_MODELS ile genişletilebilir)",
  "🩺 Yönetici › Talep Radarı'na “Yapay zekâ bağlantı testi”: anahtar, model listesi ve örnek üretim tek tıkla denenir, sorun varsa ne yapılacağı yazar",
  "📱 Yeni uygulama ayrıntı sayfası (Google Play / App Store tarzı): büyük ikon, geliştirici, istatistik şeridi, Yükle / Canlı dene / Paylaş / İstek listesi, öne çıkan telefon görseli",
  "🖼️ Ekran görüntüsü şeridi: tanıtım afişi + uygulamanın telefon, tablet ve bilgisayardaki canlı görünümleri; tıklayınca tam ekran canlı deneme",
  "📝 Bu uygulama hakkında, Nasıl yapıldı (model, istek sayısı, Kopyala ve geliştir), Veri güvenliği, Uygulama desteği, geliştiricinin diğer uygulamaları ve benzer uygulamalar",
  "🎛️ Geliştir'e “Ayarlar” (AI Studio tarzı): yaratıcılık, ayrıntı düzeyi ve sistem talimatları her üretime eklenir",
  "🍎 Tasarım inceltmeleri: koyu ince kaydırma çubukları, klavye odak halkaları, basınca küçülen düğmeler, sabit genişlikli rakamlar, tek satırda kayan Geliştir kontrolleri, başlıklarda emoji yerine sade tipografi",
  "💾 Kaydedilen uygulamalar hangi model, tür ve tasarımla yapıldığını saklar; ayrıntı sayfasında gösterilir",
 ]},
 {v:"3.4.0",date:"2026-11-25",items:[
  "🎨 Sektöre göre tasarım temaları: 12 hazır tasarım dili (Material You, Cam Efekti, Neo Banka, Pastel Lavanta, Minimal Beyaz, Lüks Altın, Doğal & Organik, Sıcak Lezzet, Klinik Ferah, Pop & Cesur, Neon Arcade, Neşeli Renkler)",
  "🧭 Otomatik öneri: fikrini yazarken sektör (güzellik, yemek, sağlık, finans, oyun… 12 sektör) anlaşılır ve o sektöre en uygun 3 tasarım önerilir; “Otomatik” seçiliyse en uygunu kullanılır",

function categorize(r){
 const txt=((r.name||"")+" "+(r.description||"")+" "+(r.topics||[]).join(" ")).toLowerCase();
 const topics=(r.topics||[]).map(t=>t.toLowerCase());
 let best=null,bs=0;
 for(const s of SECTORS){let sc=0;for(const k of s.kw){if((r.name||"").toLowerCase().split(/[-_.]/).includes(k))sc+=2;if(topics.includes(k))sc+=3;else if(new RegExp("(^|[^a-z])"+k.replace(/[-]/g,"[- ]?")+"([^a-z]|$)").test(txt))sc+=1;}
  if(sc>bs){bs=sc;best=s;}}
 return best||OTHER;
}

let RATE={rem:"?",lim:"?"};
async function gh(path){
 const tok=LS.get("token","");
 const r=await fetch("https://api.github.com"+path,{headers:Object.assign({Accept:"application/vnd.github+json"},tok?{Authorization:"Bearer "+tok}:{})});
 RATE={rem:r.headers.get("x-ratelimit-remaining")||"?",lim:r.headers.get("x-ratelimit-limit")||"?"};
 window.dispatchEvent(new Event("rate"));
 if(!r.ok){let m="GitHub hatası "+r.status;if(r.status===403||r.status===429)m="GitHub istek limiti doldu. Ayarlar'dan token ekleyin veya biraz bekleyin.";if(r.status===422)m="Geçersiz arama sorgusu.";throw new Error(m)}
 return r.json();
}

/* ================= GÜVENLİK TESTİ ================= */
async function securityScan(repo){
 const [o,n]=repo.full_name.split("/");const br=repo.default_branch||"main";
 const checks=[];let score=100;
 const add=(lvl,title,detail,pen=0)=>{checks.push({lvl,title,detail});score-=pen};
 // Lisans
 if(repo.license&&repo.license.spdx_id&&repo.license.spdx_id!=="NOASSERTION")add("ok","Lisans",repo.license.name+" — ticari kullanım koşullarını kontrol edin");
 else add("bad","Lisans yok","Lisanssız kodun yeniden kullanımı hukuken risklidir",20);
 if(repo.license&&/GPL/.test(repo.license.spdx_id||""))add("warn","Copyleft lisans",repo.license.spdx_id+": türetilmiş işin kaynağını açmanız gerekebilir",3);
 // Bakım
 const days=(Date.now()-new Date(repo.pushed_at))/864e5;
 if(repo.archived)add("bad","Arşivlenmiş","Proje artık geliştirilmiyor; güvenlik yamaları gelmez",20);
 if(days>365)add("bad","Bakım","Son güncelleme "+ago(repo.pushed_at),12);else if(days>120)add("warn","Bakım","Son güncelleme "+ago(repo.pushed_at),5);else add("ok","Bakım","Aktif — son güncelleme "+ago(repo.pushed_at));
 // Topluluk
 if(repo.stargazers_count<50)add("warn","Topluluk güveni","Düşük yıldız sayısı ("+repo.stargazers_count+")",5);else add("ok","Topluluk güveni",fmt(repo.stargazers_count)+" yıldız, "+fmt(repo.forks_count)+" fork");
 // Dosyalar
 const [sec1,sec2,env,dep1,dep2,pkg,req,lock]=await Promise.all([raw(o,n,br,"SECURITY.md"),raw(o,n,br,".github/SECURITY.md"),raw(o,n,br,".env"),raw(o,n,br,".github/dependabot.yml"),raw(o,n,br,".github/renovate.json"),raw(o,n,br,"package.json"),raw(o,n,br,"requirements.txt"),raw(o,n,br,"package-lock.json").then(t=>t?true:false)]);
 if(sec1||sec2)add("ok","Güvenlik politikası","SECURITY.md mevcut");else add("warn","Güvenlik politikası","SECURITY.md yok — zafiyet bildirme süreci tanımsız",4);
 if(env){const leak=/(KEY|SECRET|TOKEN|PASSWORD)\s*=\s*\S{6,}/i.test(env);add("bad",".env dosyası repoda",leak?"Gizli anahtar sızıntısı olabilir — anahtarları değiştirin":".env dosyası commitlenmiş",leak?25:10)}
 else add("ok","Gizli dosya","Kök dizinde .env bulunamadı");
 if(dep1||dep2)add("ok","Otomatik bağımlılık güncellemesi","Dependabot/Renovate yapılandırılmış");else add("info","Otomatik bağımlılık güncellemesi","Dependabot/Renovate bulunamadı");
 // OSV bağımlılık taraması
 const queries=[];let pk=null;
 const subs=await Promise.all(["frontend","backend","client","server","web","app","api"].map(d=>raw(o,n,br,d+"/package.json")));
 const pkgs=[pkg,...subs].filter(Boolean);const seenQ=new Set();
 for(const t of pkgs){try{const p=JSON.parse(t);if(!pk)pk=p;else{pk={...pk,dependencies:Object.assign({},pk.dependencies,p.dependencies),devDependencies:Object.assign({},pk.devDependencies,p.devDependencies)}}
  const all=Object.assign({},p.dependencies||{},p.devDependencies||{});for(const[k,v]of Object.entries(all)){const ver=String(v).replace(/^[\^~>=<\s]+/,"").split(" ")[0];if(/^\d+\.\d+/.test(ver)&&!seenQ.has(k)){seenQ.add(k);queries.push({package:{name:k,ecosystem:"npm"},version:ver})}}}catch(e){}}
 if(req){for(const line of req.split("\n")){const m=line.trim().match(/^([A-Za-z0-9_.\-]+)\s*==\s*([0-9][^\s;#]*)/);if(m)queries.push({package:{name:m[1],ecosystem:"PyPI"},version:m[2]})}}
 let vulns=[];let osvOk=null;
 if(queries.length){try{const r=await fetch("https://api.osv.dev/v1/querybatch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({queries:queries.slice(0,300)})});const j=await r.json();osvOk=true;
   (j.results||[]).forEach((res,i)=>{if(res.vulns&&res.vulns.length)vulns.push({pkg:queries[i].package.name,ver:queries[i].version,eco:queries[i].package.ecosystem,ids:res.vulns.map(v=>v.id)})});
  }catch(e){osvOk=false}}
 if(!queries.length)add("info","Bağımlılık taraması","Sabit sürümlü package.json / requirements.txt bulunamadı");
 else if(osvOk===false)add("info","Bağımlılık taraması","OSV.dev servisine ulaşılamadı");
 else if(vulns.length){const tot=vulns.reduce((a,v)=>a+v.ids.length,0);add("bad","Bilinen zafiyetler (OSV)",`${queries.length} paketten ${vulns.length} tanesinde ${tot} kayıtlı zafiyet`,Math.min(30,6+vulns.length*3))}
 else add("ok","Bilinen zafiyetler (OSV)",queries.length+" bağımlılık tarandı, kayıtlı zafiyet yok");
 if(pkg&&!lock&&queries.length)add("warn","Kilit dosyası","package-lock.json yok — tekrarlanabilir kurulum zayıf",3);
 // OpenSSF Scorecard
 let scorecard=null;
 try{const r=await fetch(`https://api.securityscorecards.dev/projects/github.com/${o}/${n}`);if(r.ok){scorecard=await r.json();const s=scorecard.score;add(s>=7?"ok":s>=4?"warn":"bad","OpenSSF Scorecard",s.toFixed(1)+" / 10",s>=7?0:s>=4?5:12)}else add("info","OpenSSF Scorecard","Bu proje için skor kaydı yok")}catch(e){add("info","OpenSSF Scorecard","Servise ulaşılamadı")}
 score=Math.max(0,Math.min(100,Math.round(score)));
 const grade=score>=85?"A":score>=70?"B":score>=50?"C":"D";
 return {score,grade,checks,vulns,scorecard,pkg:pk,date:new Date().toISOString()};
}

const EMOJI_EXTRA={"🛡️":"shield","📸":"camera","📨":"send","💡":"lightbulb","🔎":"search","🔍":"search","🗂️":"folder","📱":"device","💎":"gem","🔑":"key","⚠️":"alert","⚠":"alert","➕":"plus","✅":"checkCircle","⛔":"circleX","❌":"circleX","🚀":"rocket","★":"star","☆":"star","✨":"sparkles"};

function repoScore(r,sec){const why=[];let s=0;
 const st=r.stargazers_count||0,fk=r.forks_count||0,days=(Date.now()-new Date(r.pushed_at||0))/864e5,li=licInfo(r);
 const pop=Math.min(28,Math.log10(st+1)/Math.log10(30000)*28);s+=pop;why.push("popülerlik "+Math.round(pop)+"/28");
 const fr=r.archived?0:days<30?20:days<90?16:days<365?10:days<730?4:0;s+=fr;why.push(r.archived?"arşivlenmiş":"güncellik "+fr+"/20");
 const lc=li.ok?20:li.warn?9:0;s+=lc;why.push("lisans "+lc+"/20");
 const com=Math.min(8,Math.log10(fk+1)/Math.log10(4000)*8);s+=com;
 const iss=st>20?((r.open_issues_count||0)/st<.04?8:(r.open_issues_count||0)/st<.12?4:0):2;s+=iss;why.push("bakım "+Math.round(com+iss)+"/16");
 const doc=(r.description?4:0)+((r.topics||[]).length>=3?3:0)+(r.homepage&&/^https?:/.test(r.homepage)?9:0);s+=doc;why.push("tanıtım/demo "+doc+"/16");
 if(sec&&sec.score!=null){s=s*.7+sec.score*.3;why.push("güvenlik "+sec.score)}
 const score=Math.max(0,Math.min(100,Math.round(s)));const grade=score>=72?"A":score>=56?"B":score>=40?"C":"D";

function readmeImages(md,o,n,br,max=14){const out=[];if(!md)return out;const re=/!\[[^\]]*\]\(\s*<?([^)\s>]+)>?(?:\s+"[^"]*")?\s*\)|<img[^>]+src=["']([^"']+)["']/gi;let m;const seen=new Set();
 while((m=re.exec(md))){let u=m[1]||m[2];if(!u)continue;
  if(/shields\.io|badge|badgen|travis-ci|codecov|circleci|\/workflows\/|img\.shields|coveralls|gitter|discord|opencollective|buymeacoffee|ko-fi|sponsor|\.svg(\?|$)|star-history|contrib\.rocks|readme-typing|komarev|vercel\.com\/button|deploy\/button|netlify\.com\/img|logo|icon|avatar|emoji|\.gif(\?|$)/i.test(u))continue;
  if(u.startsWith("//"))u="https:"+u;else if(!/^https?:/i.test(u)){u=u.replace(/^\.?\//,"");u=`https://raw.githubusercontent.com/${o}/${n}/${br}/${u}`}
  u=u.replace(/github\.com\/([^/]+)\/([^/]+)\/blob\//,"raw.githubusercontent.com/$1/$2/").replace(/\?raw=true$/,"");
  if(seen.has(u))continue;seen.add(u);out.push(u);if(out.length>=max)break}return out}

function useDeckData(repos,secs){
 const [data,setData]=useState({});
 useEffect(()=>{let alive=true;(async()=>{for(const r of repos){if(!alive)return;try{const [sh,lg]=await Promise.all([getScreens(r),gh(`/repos/${r.full_name}/languages`).catch(()=>({}))]);if(alive)setData(d=>({...d,[r.full_name]:{shots:sh,langs:lg}}))}catch(e){}}})();return()=>{alive=false}},[repos.map(r=>r.full_name).join()]);
 return data;
}
function Deck({repos,secs,close}){
 const data=useDeckData(repos,secs);const [i,setI]=useState(0);
 const slides=[];
 if(repos.length>1){slides.push({k:"cover",render:()=>html`<div class="slide"><h3>Gitmapsite · Proje Portföyü</h3><h2 style=${{fontSize:46}}>${repos.length} açık kaynak proje</h2><p>İş kollarına göre seçilmiş, güvenlik testinden geçirilmiş ve canlıya alınmaya hazır proje sunumu.</p><div class="chips" style=${{marginTop:20}}>${repos.map(r=>html`<span class="tag" style=${{fontSize:14}}>${symbolIcon(categorize(r).ic)} ${r.full_name}</span>`)}</div><div class="foot"><span>Gitmapsite</span><span>${new Date().toLocaleDateString("tr-TR")}</span></div></div>`})}
 repos.forEach(r=>{const c=categorize(r);const s=secs[r.full_name];const d=data[r.full_name]||{};const shots=(d.shots||[]).filter(x=>!/opengraph/.test(x.src));const lg=d.langs||{};const lt=Object.values(lg).reduce((a,b)=>a+b,0);const prof=deployProfile(r,s&&s.pkg);

  slides.push({render:()=>html`<div class="slide"><h3>Ne yapar?</h3><h2>Ürün özeti</h2><p>${r.description||"Açıklama girilmemiş."}</p><div class="chips">${(r.topics||[]).slice(0,12).map(t=>html`<span class="tag" style=${{fontSize:13}}>#${t}</span>`)}</div><p style=${{fontSize:15}}>Lisans: <b>${r.license?r.license.name:"Yok"}</b> · Son güncelleme: <b>${ago(r.pushed_at)}</b> · Açık konu: <b>${r.open_issues_count}</b></p>${F}</div>`});
  slides.push({render:()=>html`<div class="slide"><h3>Arayüz</h3><h2>Ekran görüntüleri</h2>${shots.length?html`<div class="sgrid">${shots.slice(0,4).map(x=>html`<img src=${x.src} onError=${e=>{e.target.style.visibility="hidden"}}/>`)}</div>`:html`<div class="sgrid" style=${{gridTemplateColumns:"1fr"}}><img src=${og(r.full_name)}/></div>`}${F}</div>`});
  slides.push({render:()=>html`<div class="slide"><h3>Teknoloji</h3><h2>Yığın ve yapı</h2><p>Altyapı: <b>${prof.fw}</b></p>${lt>0&&html`<div class="lang" style=${{height:22}}>${Object.entries(lg).slice(0,6).map(([k,v],j)=>html`<div style=${{width:(v/lt*100)+"%",background:["#e4ff3d","#a3e635","#22c55e","#f59e0b","#ef4444","#06b6d4"][j]}}></div>`)}</div><div style=${{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,fontSize:18,marginTop:10}}>${Object.entries(lg).slice(0,6).map(([k,v])=>html`<div><b>${k}</b> <span style=${{color:"var(--mut)"}}>${(v/lt*100).toFixed(1)}%</span></div>`)}</div>`}${F}</div>`});
  slides.push({render:()=>html`<div class="slide"><h3>Güvenlik</h3><h2>Güvenlik raporu ${s?html`<span class=${"grade g"+s.grade} style=${{fontSize:26,marginLeft:10}}>${s.grade} · ${s.score}/100</span>`:""}</h2>${s?html`<div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px 24px",fontSize:15}}>${s.checks.slice(0,10).map(c=>html`<div><span style=${{color:c.lvl==="ok"?"#86efac":c.lvl==="bad"?"#fca5a5":c.lvl==="warn"?"#fcd34d":"#93c5fd"}}>●</span> <b>${c.title}</b> — <span style=${{color:"#b5b5ae"}}>${c.detail}</span></div>`)}</div>`:html`<p>Bu proje için güvenlik testi henüz çalıştırılmadı. Detay panelindeki Güvenlik sekmesinden başlatın.</p>`}${F}</div>`});
  slides.push({render:()=>html`<div class="slide"><h3>Canlıya alma planı</h3><h2>Nasıl yaparız?</h2><p style=${{fontSize:17}}>1. Fork & klonlama → 2. Güvenlik düzeltmeleri ve bağımlılık güncellemesi → 3. Türkçeleştirme, marka ve özel geliştirmeler → 4. Derleme: <b>${prof.cmd||"—"}</b> → 5. Yayın: <b>${prof.target}</b> → 6. Alan adı + SSL</p>${F}</div>`});
 });
 useEffect(()=>{const h=e=>{if(e.key==="ArrowRight")setI(x=>Math.min(slides.length-1,x+1));if(e.key==="ArrowLeft")setI(x=>Math.max(0,x-1));if(e.key==="Escape")close()};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[slides.length]);
 const [all,setAll]=useState(false);
 return html`<div class="deck"><div class="deckbar"><b>Sunum</b><span style=${{color:"var(--mut)"}}>${i+1} / ${slides.length}</span><span style=${{flex:1}}></span>
  <button class="btn g s" onClick=${()=>setI(Math.max(0,i-1))}>◀</button><button class="btn g s" onClick=${()=>setI(Math.min(slides.length-1,i+1))}>▶</button>
  <button class="btn g s" onClick=${()=>setAll(!all)}>${all?"Tek slayt":"Tümünü göster"}</button>
  <button class="btn s" onClick=${()=>{setAll(true);setTimeout(()=>window.print(),400)}}>PDF olarak kaydet</button><button class="btn g s" onClick=${close}>✕</button></div>
  <div class="stage">${all?html`<div style=${{display:"flex",flexDirection:"column",gap:20,alignItems:"center",width:"100%"}}>${slides.map(s=>s.render())}</div>`:slides[i]&&slides[i].render()}</div></div>`;
}

function Compare({repos,secs,close}){
 const rows=[["İş kolu",r=>{const c=categorize(r);return c.ic+" "+c.name}],["Yıldız",r=>fmt(r.stargazers_count)],["Fork",r=>fmt(r.forks_count)],["Açık konu",r=>fmt(r.open_issues_count)],["Dil",r=>r.language||"—"],["Lisans",r=>!r.license?"Yok":r.license.spdx_id==="NOASSERTION"?"Özel / belirsiz":r.license.spdx_id],["Son güncelleme",r=>ago(r.pushed_at)],["Arşiv",r=>r.archived?"Evet":"Hayır"],["Güvenlik notu",r=>secs[r.full_name]?html`<span class=${"grade g"+secs[r.full_name].grade}>${secs[r.full_name].grade} · ${secs[r.full_name].score}</span>`:"Test edilmedi"],["Zafiyetli paket",r=>secs[r.full_name]?String(secs[r.full_name].vulns.length):"—"],["Yapı",r=>deployProfile(r,secs[r.full_name]&&secs[r.full_name].pkg).fw]];
 const best=[...repos].sort((a,b)=>((secs[b.full_name]||{}).score||0)-((secs[a.full_name]||{}).score||0)||b.stargazers_count-a.stargazers_count)[0];
 return html`<div class="box" style=${{overflowX:"auto"}}><div style=${{display:"flex",alignItems:"center",marginBottom:8}}><b>Karşılaştırma</b><span style=${{flex:1}}></span><button class="btn g s" onClick=${close}>Kapat</button></div>
  <table><thead><tr><th></th>${repos.map(r=>html`<th style=${{color:"var(--txt)"}}>${r.full_name}${best===r?html` <span class="tag"><${Icon} n="star" s=${16}/> öneri</span>`:""}</th>`)}</tr></thead>
  <tbody>${rows.map(([l,f])=>html`<tr><td style=${{color:"var(--mut)"}}>${l}</td>${repos.map(r=>html`<td>${f(r)}</td>`)}</tr>`)}</tbody></table>
  <p style=${{color:"var(--mut)",fontSize:12}}>Öneri: önce güvenlik puanı, eşitse yıldız sayısı esas alınır.</p></div>`;
}

async function loadCategory(cat,force){
 const key="cat_"+cat.id;const c=LS.get(key,null);
 if(c&&!force&&Date.now()-c.t<864e5)return c.items;
 let items=[];const seen=new Set();
 for(const tp of cat.topics){const j=await gh(`/search/repositories?q=${encodeURIComponent("topic:"+tp+" stars:>=20 archived:false")}&sort=stars&order=desc&per_page=40`);
  for(const r of j.items){if(!seen.has(r.full_name)){seen.add(r.full_name);items.push(r)}}}
 items.sort((a,b)=>b.stargazers_count-a.stargazers_count);
 const slim=items.map(r=>({id:r.id,full_name:r.full_name,name:r.name,html_url:r.html_url,description:r.description,topics:r.topics,language:r.language,stargazers_count:r.stargazers_count,forks_count:r.forks_count,open_issues_count:r.open_issues_count,license:r.license,pushed_at:r.pushed_at,homepage:r.homepage,default_branch:r.default_branch,archived:r.archived,owner:{login:r.owner&&r.owner.login}}));
 LS.set(key,{t:Date.now(),items:slim});return slim;
}

function RepoAvatar({r,size=60}){const [bad,setBad]=useState(false);const o=(r.owner&&r.owner.login)||r.full_name.split("/")[0];
 return bad?html`<${AppIcon2} emoji="box" color=${LANG_COL[r.language]||"#5e5ce6"} size=${size}/>`:html`<img class="hk-av" style=${{width:size,height:size,borderRadius:size*.2237}} src=${"https://github.com/"+o+".png?size="+size*2} alt="" loading="lazy" onError=${()=>setBad(true)}/>`}
function RepoShot({r,onClick}){const [src,setSrc]=useState(()=>{const c=RIMG.get(r.full_name);return c===undefined?null:(c||og(r.full_name))});const [st,setSt]=useState("load");const ref=useRef(null);
 useEffect(()=>{if(src!==null)return;const el=ref.current;if(!el)return;let gone=false;const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();repoImage(r).then(u=>{if(!gone)setSrc(u||og(r.full_name))}).catch(()=>{if(!gone)setSrc(og(r.full_name))})}},{rootMargin:"300px"});io.observe(el);return()=>{gone=true;io.disconnect()}},[r.full_name]);
 const isOg=src&&/opengraph/.test(src);
 return html`<div ref=${ref} class=${"hk-shot "+st+(isOg?" og":" real")} onClick=${onClick}>${src&&st!=="bad"&&html`<img loading="lazy" src=${src} alt=${r.name+" ekran görüntüsü"} onLoad=${()=>setSt("ok")} onError=${()=>{if(!isOg){setSrc(og(r.full_name));setSt("load")}else setSt("bad")}}/>`}${st==="bad"&&html`<div class="hk-ph"><b>${r.name}</b><span>${(r.owner&&r.owner.login)||""}</span></div>`}${src&&!isOg&&st==="ok"&&html`<span class="hk-real">Ekran görüntüsü</span>`}</div>`}

function useRemoteData(path,scope=""){
 const [revision,setRevision]=useState(0),[state,setState]=useState(null);
 const key=path?scope+"|"+path+"|"+revision:null;
 useEffect(()=>{
  if(!key)return;
  let current=true;
  api("GET",path).then(data=>{if(current)setState({key,data})}).catch(e=>{if(current)setState({key,error:e.message})});
  return ()=>{current=false};
 },[key]);
 return {...(key&&state?.key===key?state:{}),refresh:()=>setRevision(i=>i+1)};
}

const API=((window.GMS_CONFIG||{}).api||"").replace(/\/$/,"");

const TOK={get:()=>LS.get("tok","")||"",set:t=>LS.set("tok",t||"")};
const SID=(()=>{let s=LS.get("sid","");if(!s){s=Math.random().toString(36).slice(2,12)+Date.now().toString(36);LS.set("sid",s)}return s})();
async function api(method,path,body,signal){
 if(!API)throw new Error("Sunucu yapılandırılmadı");
 const t=TOK.get();const r=await fetch(API+path,{method,signal,headers:{"Content-Type":"application/json",...(t?{Authorization:"Bearer "+t}:{})},body:body?JSON.stringify(body):undefined});
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok){
  if(path.startsWith("/api/admin/") && (r.status===401||r.status===403) && t && t===TOK.get())
   dispatchEvent(new CustomEvent("gm:admin-session",{detail:r.status}));
  const e=new Error(j.error||("Sunucu hatası ("+r.status+")"));e.status=r.status;throw e}if(path!=="/api/admin/credits")crEvent(j);return j;
}
function crEvent(j){if(j&&typeof j==="object"&&j.credits!=null&&isFinite(+j.credits))dispatchEvent(new CustomEvent("gm:credits",{detail:{credits:+j.credits,spent:+(j.spent||0)}}))}
function track(type,o){if(!API_ON)return;o=o||{};api("POST","/api/events",{session_id:SID,type,query:o.query?String(o.query).slice(0,200):null,category:o.category||null,repo:o.repo||null,meta:o.meta||null}).catch(()=>{})}

function useAuth(apiOn){
 const [user,setUser]=useState(null),[phase,setPhase]=useState("checking");const generation=useRef(0);
 const refresh=useCallback(()=>{
  const id=++generation.current,token=TOK.get();
  if(!apiOn||!token){setUser(null);setPhase(token?"checking":"ready");return}
  setPhase("checking");
  api("GET","/api/auth/me").then(j=>{if(id!==generation.current||token!==TOK.get())return;setUser(j.user);if(!j.user)TOK.set("");setPhase("ready")})
   .catch(()=>{if(id===generation.current){setUser(null);setPhase("error")}});
 },[apiOn]);
 useEffect(()=>{
  refresh();
  const sync=e=>{if(e.key==="gms_tok"||e.key===null)refresh()};
  const rejected=e=>{if(e.detail===401)TOK.set("");refresh()};
  addEventListener("storage",sync);addEventListener("gm:admin-session",rejected);
  return()=>{generation.current++;removeEventListener("storage",sync);removeEventListener("gm:admin-session",rejected)};
 },[refresh]);
 return {user,phase,refresh,patch:p=>setUser(u=>u?{...u,...p}:u),
  login:(t,u)=>{generation.current++;TOK.set(t);setUser(u);setPhase("ready")},
  logout:()=>{generation.current++;TOK.set("");setUser(null);setPhase("ready")}};
}

// Codex tarzı yazı efekti
function Typewriter({text,speed=12,onDone}){
 const [n,setN]=useState(0);
 useEffect(()=>{setN(0);if(!text)return;let i=0;const step=Math.max(1,Math.round(text.length/180));const t=setInterval(()=>{i+=step;setN(i);if(i>=text.length){clearInterval(t);onDone&&onDone()}},speed);return()=>clearInterval(t)},[text]);
 return html`<span>${text.slice(0,n)}${n<text.length?html`<span class="caret"></span>`:""}</span>`;
}

// Akışlı API çağrısı (sunucu olayları)
async function apiStream(path,body,onDelta){
 const t=TOK.get();const r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json",...(t?{Authorization:"Bearer "+t}:{})},body:JSON.stringify({...body,stream:true})});
 if(!r.ok){let j={};try{j=await r.json()}catch(e){}const e=new Error(j.error||("Sunucu hatası ("+r.status+")"));e.status=r.status;throw e}
 const rd=r.body.getReader();const dec=new TextDecoder();let buf="",final=null;
 while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
  while((i=buf.indexOf("\n\n"))>=0){const chunk=buf.slice(0,i);buf=buf.slice(i+2);const line=chunk.split("\n").find(l=>l.startsWith("data:"));if(!line)continue;let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
   if(ev.t==="delta")onDelta(ev.d);else if(ev.t==="done")final=ev;else if(ev.t==="error"){const e=new Error(ev.error);e.status=ev.status;throw e}}}
 if(!final)throw new Error("Bağlantı kesildi, lütfen tekrar deneyin.");crEvent(final);return final;
}

function WorkLog({log,open,toggle}){
 const running=log.running;const done=log.steps.filter(s=>s.state==="done").length;
 const head=running?html`<span class="shimmer">${log.title}</span>`:log.error?html`<span style=${{color:"#fca5a5"}}>Durdu: ${log.error}</span>`:html`<span>${log.done||"Tamamlandı"}</span>`;
 return html`<div class="wlog">
  <div class="wlog-h" onClick=${toggle}>${running?html`<${Spark} s=${17}/>`:log.error?html`<${Icon} n="x" s=${15} c="#fca5a5"/>`:html`<${Icon} n="check" s=${15} c="#86efac"/>`}${head}<span class="wlog-t">${log.secs||0} sn${log.kb?" · "+log.kb+" KB":""}${log.model?" · "+shortModel(log.model):""}</span><${Icon} n=${open?"chevDown":"chevRight"} s=${14} c="#767671"/></div>
  ${open&&html`<div class="wlog-b">${log.steps.map((s,i)=>html`<div class=${"wlog-r "+s.state} key=${i}><span class="wlog-i">${s.state==="done"?html`<${Icon} n="check" s=${13} w=${2.2}/>`:s.state==="run"?html`<span class="dots"><i></i><i></i><i></i></span>`:html`<span class="pend"></span>`}</span><span class="wlog-l">${s.state==="run"?html`<span class="shimmer">${s.l}</span>`:s.l}</span>${s.state==="done"?html`<${Icon} n="chevRight" s=${13} c="#4a5470"/>`:""}</div>`)}</div>`}
 </div>`;
}

// ---- Görsel hazırlama: küçült, renk paletini çıkar, rolünü tahmin et ----
const hex2=(r,g,b)=>"#"+[r,g,b].map(v=>Math.max(0,Math.min(255,v|0)).toString(16).padStart(2,"0")).join("");
const lum=(h)=>{const n=parseInt(h.slice(1),16);const [r,g,b]=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const satOf=h=>{const n=parseInt(h.slice(1),16);const r=n>>16&255,g=n>>8&255,b=n&255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);return mx?(mx-mn)/mx:0};
function loadImg(file){return new Promise((ok,bad)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{ok(i);URL.revokeObjectURL(u)};i.onerror=()=>bad(new Error("Görsel açılamadı"));i.src=u})}
function shrink(img,max,q){const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)}
function paletteOf(img){
 const W=72,H=Math.max(1,Math.round(72*img.height/img.width));const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.drawImage(img,0,0,W,H);const d=x.getImageData(0,0,W,H).data;
 const b={};let sat=0,n=0;for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const r=d[i],g=d[i+1],bl=d[i+2];const mx=Math.max(r,g,bl),mn=Math.min(r,g,bl);sat+=mx?(mx-mn)/mx:0;n++;const k=(r>>4)+","+(g>>4)+","+(bl>>4);const o=b[k]||(b[k]={n:0,r:0,g:0,b:0});o.n++;o.r+=r;o.g+=g;o.b+=bl}
 const cols=Object.values(b).map(o=>({n:o.n,h:hex2(o.r/o.n,o.g/o.n,o.b/o.n)})).sort((a,c)=>c.n-a.n);const out=[];
 for(const c of cols){const p=parseInt(c.h.slice(1),16);if(out.every(o=>{const q=parseInt(o.h.slice(1),16);return Math.abs((p>>16&255)-(q>>16&255))+Math.abs((p>>8&255)-(q>>8&255))+Math.abs((p&255)-(q&255))>70}))out.push(c);if(out.length>=6)break}
 return {colors:out.map(c=>c.h),sat:n?sat/n:0};
}
async function prepImage(file){
 if(!/^image\/(jpeg|png|webp|gif|heic|heif)/i.test(file.type||"image/jpeg"))throw new Error(file.name+": desteklenmeyen dosya türü");
 const img=await loadImg(file);const pal=paletteOf(img);
 return {id:Math.random().toString(36).slice(2),name:file.name,full:shrink(img,1024,.74),small:shrink(img,640,.78),thumb:shrink(img,120,.7),pal:pal.colors,role:pal.sat<.14?"layout":"style",w:img.width,h:img.height};
}
const ROLES={layout:["pen","Yerleşim çizimi","Ekran düzenini birebir takip eder"],style:["palette","Stil / renk","Renkleri ve havayı alır"],content:["image","İçerik görseli","Uygulamanın içinde gösterilir"]};
function themeFromPalette(cols){
 if(!cols||cols.length<2)return null;const bg=cols[0];const dark=lum(bg)<.35;const rest=cols.slice(1).sort((a,b)=>satOf(b)-satOf(a));
 const pr=rest[0]||(dark?"#7c9cff":"#2563eb");const ac=rest[1]||pr;
 return {id:"gorsel",name:"Görselden",tag:"Eklediğin görselin renkleri",font:"DM Sans",r:16,p:{bg,sf:dark?hex2(...[0,0,0].map((_,i)=>parseInt(bg.slice(1+i*2,3+i*2),16)+18)):"#ffffff",pr,ac,tx:dark?"#f5f7fb":"#141a26"},style:"Kullanıcının eklediği görselden çıkarılan renk paleti; görseldeki havayı, kontrastı ve renk dengesini koru."};
}

function Assistant({context}){

 useEffect(()=>{end.current&&end.current.scrollIntoView({behavior:"smooth"})},[msgs.length,busy]);
 async function send(e){e.preventDefault();const text=t.trim();if(!text||busy)return;const m=[...msgs,{role:"user",content:text}];setMsgs(m);setT("");setBusy(true);
  try{const j=await api("POST","/api/ai/assist",{messages:m.slice(1),context});setMsgs([...m,{role:"assistant",content:j.reply}])}catch(er){setMsgs([...m,{role:"assistant",content:"⚠️ "+er.message}])}setBusy(false)}

  <div style=${{display:"flex",gap:5,flexWrap:"wrap",margin:"8px 0"}}>${["Alan adı nedir?","GitHub'a neden kaydetmeliyim?","Telefona nasıl yüklerim?"].map(x=>html`<span class="chip" style=${{fontSize:11}} onClick=${()=>setT(x)}>${x}</span>`)}</div>
  <form onSubmit=${send} style=${{display:"flex",gap:6}}><input class="in" style=${{flex:1}} placeholder="Sorunu yaz…" value=${t} onInput=${e=>setT(e.target.value)}/><button class="btn" disabled=${busy}>➤</button></form></div>`;

const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function ghostRun(steps){
 let c=document.getElementById("ghost");
 if(!c){c=document.createElement("div");c.id="ghost";c.innerHTML='<svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 3l7 18 2.5-7.5L21 11z" fill="#fff" stroke="#0f0f0e" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="gh-ring"></span><span class="gh-tag">Gitmapp</span>';document.body.appendChild(c);c.style.transform="translate("+(innerWidth*.6)+"px,"+(innerHeight*.8)+"px)"}
 c.classList.add("on");await wait(60);
 for(const st of steps){const el=typeof st.el==="string"?document.querySelector(st.el):st.el;if(!el)continue;
  el.scrollIntoView({block:"center",behavior:"smooth"});await wait(380);const r=el.getBoundingClientRect();
  c.style.transform="translate("+(r.left+Math.min(r.width*.5,r.width-14))+"px,"+(r.top+r.height*.55)+"px)";await wait(st.slow?950:720);
  c.classList.add("click");el.classList.add("gh-hit");await wait(200);c.classList.remove("click");setTimeout(()=>el.classList.remove("gh-hit"),500);
  if(st.fn)await st.fn(el);await wait(st.after||120)}
 await wait(400);c.classList.remove("on");
}

// Yönetici: yapay zekâ bağlantı testi
function AiCheck({toast}){
 const [r,setR]=useState(null);const [busy,setBusy]=useState(false);
 const run=async()=>{setBusy(true);try{setR(await api("GET","/api/admin/ai-check"))}catch(e){toast(e.message)}setBusy(false)};
 const pill=(ok,t)=>html`<span class=${"aic-p "+(ok?"ok":"bad")}><${Icon} n=${ok?"check":"x"} s=${12} w=${2.4}/> ${t}</span>`;
 return html`<div class="box" style=${{marginBottom:16}}><div style=${{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}><${Tile} n="cpu" g="#a855f7,#a3e635" s=${32}/><div style=${{flex:1}}><b>Yapay zekâ bağlantı testi</b><div style=${{color:"var(--mut)",fontSize:12.5}}>Hostinger AI Router anahtarını, model listesini ve örnek bir üretimi dener.</div></div><button class="btn s" disabled=${busy} onClick=${run}>${busy?"Test ediliyor…":"Testi çalıştır"}</button></div>
  ${r&&html`<div class="aic">
   <div><span>Adres</span><b class="mono">${r.base}</b></div><div><span>Anahtar</span><b class="mono">${r.key||"tanımlı değil"}</b></div>
   <div><span>Model listesi</span>${r.models?pill(r.models.ok,r.models.ok?"çalışıyor":"uç nokta yok ("+(r.models.status||r.models.error)+") · sabit liste kullanılıyor"):"—"}</div>
   <div><span>Modeller</span><b style=${{fontSize:12}}>${(r.list||[]).join(", ")||"—"}</b></div>
   <div><span>Örnek üretim</span>${r.chat?pill(r.chat.ok,r.chat.ok?"çalışıyor · "+r.chat.model+" → “"+r.chat.reply+"”":(r.chat.status||"")+" "+(r.chat.reply||r.chat.error||"")):"—"}</div>
   ${r.chat&&!r.chat.ok&&html`<div class="aic-help">Anahtar reddediliyorsa: hPanel → AI Router'dan anahtarı kopyalayın (sk-hstgr- ile başlar), sunucuda <span class="mono">/etc/gitmapp/api.env</span> içindeki <span class="mono">AI_KEY</span> değerini güncelleyip <span class="mono">systemctl restart gitmapp-api</span> çalıştırın. Model adı reddediliyorsa <span class="mono">AI_MODELS=claude-sonnet-5,gpt-5.2</span> gibi doğru adları ekleyin.</div>`}
  </div>`}</div>`;
}

function PickerDock({mode,onMode}){
 const corners=["br","bl","tl","tr"];
 const [corner,setCorner]=useState(()=>LS.get("pickerCorner","br"));
 const [open,setOpen]=useState(false),[offset,setOffset]=useState(null);
 const dock=useRef(null),gesture=useRef(null),timer=useRef(null),dragged=useRef(false);
 const settle=k=>{setCorner(k);LS.set("pickerCorner",k)};
 function idle(){
   clearTimeout(timer.current);
   timer.current=setTimeout(()=>{if(!gesture.current&&!dock.current?.querySelector(":focus-visible"))setOpen(false)},3500);
 }
 useEffect(()=>{if(open)idle();return ()=>clearTimeout(timer.current)},[open]);
 function begin(e){
   if(e.button!==0)return;
   const box=dock.current.getBoundingClientRect();
   gesture.current={x:e.clientX,y:e.clientY,left:box.left,top:box.top};
   dragged.current=false;e.currentTarget.setPointerCapture(e.pointerId);
 }
 function move(e){
   const g=gesture.current;if(!g)return;
   const dx=e.clientX-g.x,dy=e.clientY-g.y;
   if(!dragged.current&&Math.hypot(dx,dy)<6)return;
   dragged.current=true;
   const el=dock.current,b=el.parentElement.getBoundingClientRect();
   const fit=(v,max)=>Math.max(4,Math.min(v,max-4));
   setOffset({left:fit(g.left-b.left+dx,b.width-el.offsetWidth),top:fit(g.top-b.top+dy,b.height-el.offsetHeight),right:"auto",bottom:"auto"});
 }
 function end(e){
   if(!gesture.current)return;
   if(dragged.current){const b=dock.current.parentElement.getBoundingClientRect();settle((e.clientY<b.top+b.height/2?"t":"b")+(e.clientX<b.left+b.width/2?"l":"r"))}
   gesture.current=null;setOffset(null);idle();
 }
 return html`<div class="picker-dock" ref=${dock} data-corner=${corner} data-mode=${mode||"browse"} style=${offset} onPointerMove=${idle} onFocus=${idle} onBlur=${idle} onKeyDown=${e=>{if(e.key==="Escape"){onMode(null);setOpen(false);dock.current.firstElementChild.focus()}}}>
  <button class="picker-handle" type="button" aria-label=${"Seçici araçları"+(mode==="text"?" · Metin":mode?" · Seçim":"")} aria-expanded=${open} title="Seçici araçları · Taşımak için sürükle" onPointerDown=${begin} onPointerMove=${move} onPointerUp=${end} onPointerCancel=${()=>{gesture.current=null;setOffset(null);idle()}} onClick=${e=>{if(!dragged.current||e.detail===0)setOpen(!open);dragged.current=false}}><${Icon} n="pointer" s=${20}/></button>
  ${open&&html`<div class="picker-menu" role="group" aria-label="Önizleme araçları">${[["select","Seç"],["text","Metin"],[null,"Gezin"]].map(([key,label])=>html`<button key=${label} aria-pressed=${mode===key} onClick=${()=>{onMode(key);idle()}}>${label}</button>`)}<button title="Sonraki köşeye taşı" aria-label="Sonraki köşeye taşı" onClick=${()=>settle(corners[(corners.indexOf(corner)+1)%4])}><${Icon} n="move" s=${15}/> Köşe</button></div>`}
 </div>`;
}

function previewPicker(nodePath){
 let mode=null,hover=null,current=null,editing=null;
 const sheet=document.createElement("style");sheet.textContent="[data-gms-hover]{outline:2px solid #6552ee!important;outline-offset:-2px;cursor:crosshair!important}[data-gms-selected]{outline:3px solid #6552ee!important;outline-offset:-3px}";document.head.append(sheet);
 function clear(){hover?.removeAttribute("data-gms-hover");current?.removeAttribute("data-gms-selected");hover=null;current=null}
 window.addEventListener("message",e=>{if(e.source===parent&&e.data?.gm==="picker-mode"){editing?.blur();clear();mode=e.data.mode}});
 window.addEventListener("pointerover",e=>{if(!mode)return;hover?.removeAttribute("data-gms-hover");hover=e.target.closest("svg")?.parentElement||e.target;hover?.setAttribute("data-gms-hover","")},true);
 window.addEventListener("click",e=>{
   if(!mode||e.target===editing)return;
   e.preventDefault();e.stopImmediatePropagation();
   const el=e.target.closest("svg")?.parentElement||e.target;
   if(!(el instanceof HTMLElement)||el===document.body)return;
   current?.removeAttribute("data-gms-selected");current=el;el.setAttribute("data-gms-selected","");
   const path=nodePath(el);
   if(mode==="select"){
     const sel=path.map(p=>p.id?p.tag+"#"+CSS.escape(p.id):p.tag+":nth-of-type("+p.index+")").join(" > ");
     parent.postMessage({gm:"select",sel,tag:el.localName,text:el.innerText.slice(0,120),html:el.outerHTML.slice(0,600)},"*");return;
   }
   if(el.children.length||!el.textContent.trim()||el.textContent.length>500){parent.postMessage({gm:"picker-tip"},"*");return}
   const old=el.textContent,attr=el.getAttribute("contenteditable");
   editing=el;el.contentEditable="plaintext-only";el.focus();
   function key(event){if(event.key==="Escape"){el.textContent=old;el.blur()}else if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();el.blur()}}
   el.addEventListener("keydown",key);
   el.addEventListener("blur",()=>{editing=null;el.removeEventListener("keydown",key);if(attr===null)el.removeAttribute("contenteditable");else el.setAttribute("contenteditable",attr);
     const now=el.innerText.slice(0,500);if(now!==old)parent.postMessage({gm:"text",path,old,now},"*");
   },{once:true});
 },true);
}

function CopilotReply({text}){

   const type=item?(item[1]?"ol":"ul"):"p",last=blocks.at(-1);
   if(item&&last?.type===type)last.items.push(item[3]);
   else blocks.push({type,start:item?.[1],items:[item?item[3]:line]});
 }

}
