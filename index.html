<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gitmapsite — Uygulama Dünyası</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0b0f17;--bg2:#111827;--card:#151c2b;--line:#243049;--txt:#e6ebf5;--mut:#8b97ad;--acc:#4f8cff;--acc2:#7c5cff;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:230px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 8px 18px}
.logo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--mut);border:0;background:none;text-align:left;width:100%}
.nav:hover{background:#1a2336;color:var(--txt)}.nav.on{background:#1d2a45;color:#fff}
.nav b{margin-left:auto;background:var(--acc);color:#fff;border-radius:20px;padding:0 7px;font-size:11px}
.main{flex:1;min-width:0;padding:24px 28px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:22px 0 10px}.sub{color:var(--mut);margin:0 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px}
.in{background:#0d1320;border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.in:focus{outline:none;border-color:var(--acc)}
.btn{background:var(--acc);border:0;border-radius:8px;padding:9px 14px;color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}.btn.g{background:#1d2740;border:1px solid var(--line)}.btn.s{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#121a2a;border-radius:20px;padding:5px 11px;cursor:pointer;font-size:12px;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card img{width:100%;aspect-ratio:2/1;object-fit:cover;background:#0d1320;display:block}
.cb{padding:12px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.ct{font-weight:700;font-size:15px;word-break:break-word}.cd{color:var(--mut);font-size:12.5px;line-height:1.45;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:10px;color:var(--mut);font-size:12px;align-items:center}
.tag{display:inline-block;background:#1b2540;border:1px solid #2b3a5e;color:#b9c8ec;border-radius:6px;padding:2px 7px;font-size:11px}
.grade{font-weight:800;border-radius:6px;padding:2px 8px;font-size:12px}
.gA{background:#14532d;color:#86efac}.gB{background:#1e3a2a;color:#bef264}.gC{background:#422006;color:#fcd34d}.gD{background:#450a0a;color:#fca5a5}.gN{background:#1f2937;color:#9ca3af}
.empty{text-align:center;color:var(--mut);padding:60px 20px;border:1px dashed var(--line);border-radius:12px}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.st b{display:block;font-size:22px}.st span{color:var(--mut);font-size:12px}
.drawer{position:fixed;inset:0;background:rgba(3,6,12,.7);display:flex;justify-content:flex-end;z-index:50}
.dw{width:min(900px,100%);background:var(--bg2);height:100%;overflow:auto;border-left:1px solid var(--line)}
.dh{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--line);padding:16px 20px;z-index:2}
.tabs{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}.tab{padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--mut);background:none;border:0}.tab.on{background:#1d2a45;color:#fff}
.db{padding:20px}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #1c2538}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex-shrink:0;font-weight:700}
.d-ok{background:#14532d;color:#86efac}.d-warn{background:#422006;color:#fcd34d}.d-bad{background:#450a0a;color:#fca5a5}.d-info{background:#1e293b;color:#93c5fd}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.gal figure{margin:0;background:#0d1320;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gal img{width:100%;display:block;max-height:260px;object-fit:contain;background:#fff1}
.gal figcaption{font-size:11px;color:var(--mut);padding:6px 8px}
.lang{height:10px;border-radius:6px;overflow:hidden;display:flex;background:#0d1320;margin:8px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.step{display:flex;gap:12px;margin-bottom:14px}.step .n{width:28px;height:28px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-weight:700;flex-shrink:0}
pre.cmd{background:#0a0e16;border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;font-size:12px;color:#c9d6ff}
table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid #1c2538;text-align:left;font-size:13px}th{color:var(--mut);font-weight:500}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2a45;border:1px solid var(--acc);padding:10px 16px;border-radius:10px;z-index:99}
/* Sunum */
.deck{position:fixed;inset:0;background:#05070c;z-index:80;display:flex;flex-direction:column}
.deckbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.stage{flex:1;display:grid;place-items:center;padding:20px;overflow:auto}
.slide{width:min(1100px,100%);aspect-ratio:16/9;background:linear-gradient(135deg,#0f1729,#141b30 60%,#1a1340);border:1px solid #2a3556;border-radius:16px;padding:48px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.slide:after{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#4f8cff33,transparent 70%)}
.slide h2{font-size:34px;margin:0 0 10px}.slide h3{font-size:14px;letter-spacing:.14em;color:var(--acc);text-transform:uppercase;margin:0 0 14px}
.slide p{font-size:18px;line-height:1.55;color:#c8d2e8}
.slide .foot{margin-top:auto;display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;flex:1;min-height:0}
.sgrid img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid #2a3556;background:#0d1320}
.big{font-size:84px;font-weight:800;line-height:1}
@media print{.side,.deckbar,.noprint{display:none!important}.deck{position:static}.stage{display:block;padding:0}.slide{page-break-after:always;margin:0 auto 10px;border-radius:0}body{background:#05070c}}
.spin{width:42px;height:42px;border:4px solid #2b3a5e;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:820px){.studio-grid{grid-template-columns:1fr!important}.app{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;overflow:auto;padding:8px}.logo{padding:4px 8px}.nav{width:auto;white-space:nowrap}.main{padding:16px}.slide{padding:22px}.slide h2{font-size:22px}.slide p{font-size:14px}.big{font-size:48px}}
</style>
</head>

const OTHER={id:"diger",name:"Diğer",ic:"📦"};
function categorize(r){
 const txt=((r.name||"")+" "+(r.description||"")+" "+(r.topics||[]).join(" ")).toLowerCase();
 const topics=(r.topics||[]).map(t=>t.toLowerCase());
 let best=null,bs=0;
 for(const s of SECTORS){let sc=0;for(const k of s.kw){if((r.name||"").toLowerCase().split(/[-_.]/).includes(k))sc+=2;if(topics.includes(k))sc+=3;else if(new RegExp("(^|[^a-z])"+k.replace(/[-]/g,"[- ]?")+"([^a-z]|$)").test(txt))sc+=1;}
  if(sc>bs){bs=sc;best=s;}}
 return best||OTHER;
}

/* ================= GITHUB ================= */
const LS={get(k,d){try{const v=localStorage.getItem("gms_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("gms_"+k,JSON.stringify(v))}catch(e){}}};
let RATE={rem:"?",lim:"?"};
async function gh(path){
 const tok=LS.get("token","");
 const r=await fetch("https://api.github.com"+path,{headers:Object.assign({Accept:"application/vnd.github+json"},tok?{Authorization:"Bearer "+tok}:{})});

async function raw(o,n,br,p){try{const r=await fetch(`https://raw.githubusercontent.com/${o}/${n}/${br}/${p}`);if(!r.ok)return null;return await r.text()}catch(e){return null}}
const og=(full)=>`https://opengraph.githubassets.com/1/${full}`;
const shot=(url)=>`https://image.thum.io/get/width/1280/crop/800/noanimate/${url}`;
const fmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":String(n);
const ago=d=>{const days=Math.floor((Date.now()-new Date(d))/864e5);if(days<1)return"bugün";if(days<30)return days+" gün önce";if(days<365)return Math.floor(days/30)+" ay önce";return Math.floor(days/365)+" yıl önce"};

async function securityScan(repo){
 const [o,n]=repo.full_name.split("/");const br=repo.default_branch||"main";
 const checks=[];let score=100;
 const add=(lvl,title,detail,pen=0)=>{checks.push({lvl,title,detail});score-=pen};
 // Lisans
 if(repo.license&&repo.license.spdx_id&&repo.license.spdx_id!=="NOASSERTION")add("ok","Lisans",repo.license.name+" — ticari kullanım koşullarını kontrol edin");
 else add("bad","Lisans yok","Lisanssız kodun yeniden kullanımı hukuken risklidir",20);
 if(repo.license&&/GPL/.test(repo.license.spdx_id||""))add("warn","Copyleft lisans",repo.license.spdx_id+": türetilmiş işin kaynağını açmanız gerekebilir",3);
 // Bakım
 const days=(Date.now()-new Date(repo.pushed_at))/864e5;
 if(repo.archived)add("bad","Arşivlenmiş","Proje artık geliştirilmiyor; güvenlik yamaları gelmez",20);
 if(days>365)add("bad","Bakım","Son güncelleme "+ago(repo.pushed_at),12);else if(days>120)add("warn","Bakım","Son güncelleme "+ago(repo.pushed_at),5);else add("ok","Bakım","Aktif — son güncelleme "+ago(repo.pushed_at));
 // Topluluk
 if(repo.stargazers_count<50)add("warn","Topluluk güveni","Düşük yıldız sayısı ("+repo.stargazers_count+")",5);else add("ok","Topluluk güveni",fmt(repo.stargazers_count)+" yıldız, "+fmt(repo.forks_count)+" fork");
 // Dosyalar
 const [sec1,sec2,env,dep1,dep2,pkg,req,lock]=await Promise.all([raw(o,n,br,"SECURITY.md"),raw(o,n,br,".github/SECURITY.md"),raw(o,n,br,".env"),raw(o,n,br,".github/dependabot.yml"),raw(o,n,br,".github/renovate.json"),raw(o,n,br,"package.json"),raw(o,n,br,"requirements.txt"),raw(o,n,br,"package-lock.json").then(t=>t?true:false)]);
 if(sec1||sec2)add("ok","Güvenlik politikası","SECURITY.md mevcut");else add("warn","Güvenlik politikası","SECURITY.md yok — zafiyet bildirme süreci tanımsız",4);
 if(env){const leak=/(KEY|SECRET|TOKEN|PASSWORD)\s*=\s*\S{6,}/i.test(env);add("bad",".env dosyası repoda",leak?"Gizli anahtar sızıntısı olabilir — anahtarları değiştirin":".env dosyası commitlenmiş",leak?25:10)}
 else add("ok","Gizli dosya","Kök dizinde .env bulunamadı");
 if(dep1||dep2)add("ok","Otomatik bağımlılık güncellemesi","Dependabot/Renovate yapılandırılmış");else add("info","Otomatik bağımlılık güncellemesi","Dependabot/Renovate bulunamadı");
 // OSV bağımlılık taraması
 const queries=[];let pk=null;
 const subs=await Promise.all(["frontend","backend","client","server","web","app","api"].map(d=>raw(o,n,br,d+"/package.json")));
 const pkgs=[pkg,...subs].filter(Boolean);const seenQ=new Set();
 for(const t of pkgs){try{const p=JSON.parse(t);if(!pk)pk=p;else{pk={...pk,dependencies:Object.assign({},pk.dependencies,p.dependencies),devDependencies:Object.assign({},pk.devDependencies,p.devDependencies)}}
  const all=Object.assign({},p.dependencies||{},p.devDependencies||{});for(const[k,v]of Object.entries(all)){const ver=String(v).replace(/^[\^~>=<\s]+/,"").split(" ")[0];if(/^\d+\.\d+/.test(ver)&&!seenQ.has(k)){seenQ.add(k);queries.push({package:{name:k,ecosystem:"npm"},version:ver})}}}catch(e){}}
 if(req){for(const line of req.split("\n")){const m=line.trim().match(/^([A-Za-z0-9_.\-]+)\s*==\s*([0-9][^\s;#]*)/);if(m)queries.push({package:{name:m[1],ecosystem:"PyPI"},version:m[2]})}}
 let vulns=[];let osvOk=null;
 if(queries.length){try{const r=await fetch("https://api.osv.dev/v1/querybatch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({queries:queries.slice(0,300)})});const j=await r.json();osvOk=true;
   (j.results||[]).forEach((res,i)=>{if(res.vulns&&res.vulns.length)vulns.push({pkg:queries[i].package.name,ver:queries[i].version,eco:queries[i].package.ecosystem,ids:res.vulns.map(v=>v.id)})});
  }catch(e){osvOk=false}}
 if(!queries.length)add("info","Bağımlılık taraması","Sabit sürümlü package.json / requirements.txt bulunamadı");
 else if(osvOk===false)add("info","Bağımlılık taraması","OSV.dev servisine ulaşılamadı");
 else if(vulns.length){const tot=vulns.reduce((a,v)=>a+v.ids.length,0);add("bad","Bilinen zafiyetler (OSV)",`${queries.length} paketten ${vulns.length} tanesinde ${tot} kayıtlı zafiyet`,Math.min(30,6+vulns.length*3))}
 else add("ok","Bilinen zafiyetler (OSV)",queries.length+" bağımlılık tarandı, kayıtlı zafiyet yok");
 if(pkg&&!lock&&queries.length)add("warn","Kilit dosyası","package-lock.json yok — tekrarlanabilir kurulum zayıf",3);
 // OpenSSF Scorecard
 let scorecard=null;
 try{const r=await fetch(`https://api.securityscorecards.dev/projects/github.com/${o}/${n}`);if(r.ok){scorecard=await r.json();const s=scorecard.score;add(s>=7?"ok":s>=4?"warn":"bad","OpenSSF Scorecard",s.toFixed(1)+" / 10",s>=7?0:s>=4?5:12)}else add("info","OpenSSF Scorecard","Bu proje için skor kaydı yok")}catch(e){add("info","OpenSSF Scorecard","Servise ulaşılamadı")}
 score=Math.max(0,Math.min(100,Math.round(score)));
 const grade=score>=85?"A":score>=70?"B":score>=50?"C":"D";
 return {score,grade,checks,vulns,scorecard,pkg:pk,date:new Date().toISOString()};
}

async function getScreens(repo){
 const [o,n]=repo.full_name.split("/");const br=repo.default_branch||"main";
 let md=null;for(const f of["README.md","readme.md","Readme.md","README.MD","docs/README.md"]){md=await raw(o,n,br,f);if(md)break}
 const out=[];
 if(repo.homepage&&/^https?:\/\//.test(repo.homepage))out.push({src:shot(repo.homepage),cap:"Canlı site — "+repo.homepage,live:true});
 if(md){const re=/!\[[^\]]*\]\(\s*<?([^)\s>]+)>?(?:\s+"[^"]*")?\s*\)|<img[^>]+src=["']([^"']+)["']/gi;let m;const seen=new Set();
  while((m=re.exec(md))){let u=m[1]||m[2];if(!u)continue;
   if(/shields\.io|badge|badgen|travis-ci|codecov|circleci|github\.com\/.*\/workflows|img\.shields|coveralls|gitter|discord\.com\/api|opencollective|buymeacoffee|ko-fi|sponsor|\.svg(\?|$)|star-history|contrib\.rocks|readme-typing|komarev|vercel\.com\/button|deploy\/button|netlify\.com\/img/i.test(u))continue;
   if(u.startsWith("//"))u="https:"+u;
   else if(!/^https?:/i.test(u)){u=u.replace(/^\.?\//,"");u=`https://raw.githubusercontent.com/${o}/${n}/${br}/${u}`}
   u=u.replace(/github\.com\/([^/]+)\/([^/]+)\/blob\//,"raw.githubusercontent.com/$1/$2/");
   if(seen.has(u))continue;seen.add(u);out.push({src:u,cap:"README görseli"});if(out.length>=14)break}}
 out.push({src:og(repo.full_name),cap:"Proje kartı (GitHub)"});
 return out;
}

function deployProfile(repo,pkg){
 const d=Object.assign({},pkg&&pkg.dependencies||{},pkg&&pkg.devDependencies||{});const s=pkg&&pkg.scripts||{};
 let fw="Statik / Bilinmiyor",cmd="",dir="";
 if(d.next){fw="Next.js";cmd="npm run build";dir=".next"}
 else if(d.nuxt){fw="Nuxt";cmd="npm run build";dir=".output/public"}
 else if(d["@sveltejs/kit"]){fw="SvelteKit";cmd="npm run build";dir="build"}
 else if(d.astro){fw="Astro";cmd="npm run build";dir="dist"}
 else if(d.vite){fw="Vite";cmd="npm run build";dir="dist"}

function useDeckData(repos,secs){
 const [data,setData]=useState({});
 useEffect(()=>{let alive=true;(async()=>{for(const r of repos){if(!alive)return;try{const [sh,lg]=await Promise.all([getScreens(r),gh(`/repos/${r.full_name}/languages`).catch(()=>({}))]);if(alive)setData(d=>({...d,[r.full_name]:{shots:sh,langs:lg}}))}catch(e){}}})();return()=>{alive=false}},[repos.map(r=>r.full_name).join()]);
 return data;
}

function Compare({repos,secs,close}){

}

const SAFE_LIC=["MIT","Apache-2.0","BSD-3-Clause","BSD-2-Clause","ISC","0BSD","Unlicense","Zlib"];
const COPYLEFT=["GPL-2.0","GPL-3.0","AGPL-3.0","LGPL-2.1","LGPL-3.0","MPL-2.0","EUPL-1.2","OSL-3.0"];
function licInfo(r){const id=r.license&&r.license.spdx_id;
 if(!id||id==="NOASSERTION")return{ok:false,cls:"gD",txt:"⛔ Lisans belirsiz",tip:"Lisans yok/özel: ticari kullanım için sahibinden izin gerekir"};
 if(SAFE_LIC.includes(id))return{ok:true,cls:"gA",txt:"✅ Satışa uygun · "+id,tip:"Kapalı kaynak ticari kullanım serbest; telif bildirimi korunmalı"};
 if(COPYLEFT.includes(id))return{ok:false,warn:true,cls:"gC",txt:"⚠️ Kaynak paylaşımı · "+id,tip:id.startsWith("AGPL")?"Değiştirilmiş hâli internette sunulursa kaynak kodu kullanıcılarla paylaşılmalı":"Dağıtılırsa kaynak kodu aynı lisansla paylaşılmalı"};
 return{ok:false,cls:"gN",txt:"🔍 İncelenmeli · "+id,tip:"Lisans metni manuel kontrol edilmeli"};
}

async function loadCategory(cat,force){
 const key="cat_"+cat.id;const c=LS.get(key,null);
 if(c&&!force&&Date.now()-c.t<864e5)return c.items;
 let items=[];const seen=new Set();
 for(const tp of cat.topics){const j=await gh(`/search/repositories?q=${encodeURIComponent("topic:"+tp+" stars:>=20 archived:false")}&sort=stars&order=desc&per_page=40`);
  for(const r of j.items){if(!seen.has(r.full_name)){seen.add(r.full_name);items.push(r)}}}
 items.sort((a,b)=>b.stargazers_count-a.stargazers_count);
 const slim=items.map(r=>({id:r.id,full_name:r.full_name,name:r.name,html_url:r.html_url,description:r.description,topics:r.topics,language:r.language,stargazers_count:r.stargazers_count,forks_count:r.forks_count,open_issues_count:r.open_issues_count,license:r.license,pushed_at:r.pushed_at,homepage:r.homepage,default_branch:r.default_branch,archived:r.archived,owner:{login:r.owner&&r.owner.login}}));
 LS.set(key,{t:Date.now(),items:slim});return slim;
}

function Strategy(){
 const P=getPrices();

   <div style=${{display:"flex",alignItems:"center",gap:8}}><span style=${{color:"var(--mut)",fontSize:12}}>${auth.user?("💎 "+(auth.user.credits??0)+" krediniz var"):"Hesapsız 3 deneme · ücretsiz hesapla hoş geldin kredisi"}${prefs.mode==="planli"?" · önce plan yazılır":""}</span><span style=${{flex:1}}></span><button class="btn" style=${{padding:"11px 22px",fontSize:15}} disabled=${!input.trim()}>${prefs.mode==="planli"?"🧭 Planı çıkar":"✨ "+(prefs.kind==="game"?"Oyunu":prefs.kind==="site"?"Siteyi":"Uygulamayı")+" oluştur"}</button></div></form>

function Assistant({context}){
 const [msgs,setMsgs]=useState([{role:"assistant",content:"Merhaba! 👋 Yayın Asistanıyım. Her adımda yanındayım; takıldığın yeri sor."}]);const [t,setT]=useState("");const [busy,setBusy]=useState(false);const end=useRef(null);
 useEffect(()=>{end.current&&end.current.scrollIntoView({behavior:"smooth"})},[msgs.length,busy]);
 async function send(e){e.preventDefault();const text=t.trim();if(!text||busy)return;const m=[...msgs,{role:"user",content:text}];setMsgs(m);setT("");setBusy(true);
  try{const j=await api("POST","/api/ai/assist",{messages:m.slice(1),context});setMsgs([...m,{role:"assistant",content:j.reply}])}catch(er){setMsgs([...m,{role:"assistant",content:"⚠️ "+er.message}])}setBusy(false)}
 return html`<div style=${{display:"flex",flexDirection:"column",height:"100%",minHeight:300}}><b style=${{marginBottom:8}}>🤖 Yayın Asistanı</b>
  <div style=${{flex:1,overflow:"auto",display:"flex",flexDirection:"column",gap:7}}>${msgs.map(m=>html`<div style=${{alignSelf:m.role==="user"?"flex-end":"flex-start",maxWidth:"92%",background:m.role==="user"?"var(--acc)":"#1b2540",padding:"7px 10px",borderRadius:10,fontSize:13,lineHeight:1.5,whiteSpace:"pre-wrap"}}>${m.content}</div>`)}${busy&&html`<div style=${{color:"var(--mut)",fontSize:12}}>yazıyor…</div>`}<div ref=${end}></div></div>
  <div style=${{display:"flex",gap:5,flexWrap:"wrap",margin:"8px 0"}}>${["Alan adı nedir?","GitHub'a neden kaydetmeliyim?","Telefona nasıl yüklerim?"].map(x=>html`<span class="chip" style=${{fontSize:11}} onClick=${()=>setT(x)}>${x}</span>`)}</div>
  <form onSubmit=${send} style=${{display:"flex",gap:6}}><input class="in" style=${{flex:1}} placeholder="Sorunu yaz…" value=${t} onInput=${e=>setT(e.target.value)}/><button class="btn" disabled=${busy}>➤</button></form></div>`;
}

   </div>`}
  </main>
  ${cur&&html`<${Detail} key=${cur.full_name} repo=${cur} close=${()=>setCur(null)} sec=${secs[cur.full_name]} setSec=${setSec} saved=${!!saved[cur.full_name]} toggleSave=${toggleSave} builds=${builds} addBuild=${addBuild} toast=${toast} present=${r=>{setDeck(r)}} onWant=${mode==="musteri"?(r=>{setCur(null);goWizard(r)}):null}/>`}
  ${deck&&html`<${Deck} repos=${deck} secs=${secs} close=${()=>setDeck(null)}/>`}
  ${authModal!==null&&html`<${Modal} close=${()=>setAuthModal(null)}><${AuthBox} auth=${auth} health=${health} toast=${toast} reason=${authModal} onDone=${()=>setAuthModal(null)}/></${Modal}>`}
  ${pubApp&&html`<${PublishPanel} app=${pubApp} auth=${auth} health=${health} toast=${toast} close=${()=>setPubApp(null)}/>`}
  ${msg&&html`<div class="toast">${msg}</div>`}
 </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
