<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beceri kaynakları · Gitmapp Stüdyo</title>
<style>
:root{color-scheme:light dark;font:100%/1.6 system-ui,sans-serif}body{max-width:66rem;margin:auto;padding:1rem}h1,h2{line-height:1.22}h2{font-size:1.15rem}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:1rem}article{border:1px solid GrayText;border-radius:.75rem;padding:1rem}a{display:inline-flex;align-items:center;min-height:44px}label{display:grid;gap:.25rem;max-width:24rem;margin:1rem 0}input{min-height:44px;font:inherit;padding:0 .6rem}:focus-visible{outline:3px solid Highlight;outline-offset:2px}small{display:block}
</style>
<body><header><a href="../#studio">← Stüdyo’ya dön</a><h1>Beceri kaynakları</h1><p>İşine uygun beceriyi bul. Kaynak bağlantısı, yayıncının incelenen sürümünü açar.</p><label>Görev veya teknoloji ara<input type="search" placeholder="Örneğin afiş, form veya Expo"></label></header>
<main aria-label="Beceriler"></main><p id="count" role="status"></p>
<script type="module">
const list = document.querySelector('main');
const field = document.querySelector('input');
const count = document.querySelector('#count');
try {
  const response = await fetch('./catalog.json');
  if (!response.ok) throw Error();
  const catalog = await response.json();
  function show() {
    const term = field.value.trim().toLocaleLowerCase('tr');
    const matches = catalog.filter(item => [item.title,item.publisher,item.task,item.name].join(' ').toLocaleLowerCase('tr').includes(term));
    list.replaceChildren();
    for (const item of matches) {
      const card = document.createElement('article');
      for (const [tag, value] of [['small',item.publisher+' · '+item.license],['h2',item.title],['p',item.task],['p',item.evidence]]) {
        const node = document.createElement(tag);
        node.textContent = value;
        card.append(node);
      }
      const link = document.createElement('a');
      link.href = item.source;
      link.textContent = item.name+' ↗';
      card.append(link);
      list.append(card);
    }
    count.textContent = matches.length ? matches.length+' beceri gösteriliyor.' : 'Eşleşen beceri yok. Başka bir görev adı deneyin.';
  }
  field.addEventListener('input',show);
  show();
} catch {
  count.textContent = 'Beceri kaynakları yüklenemedi. Sayfayı yenileyerek tekrar deneyin.';
}
</script></body></html>
